"原填空题改造"},{"id":"zt2-004","chapter":"zt2","type":"single","stem":"（　），准备打才可能不必打，越不能打越可能挨打，这就是战争与和平的辩证法。","options":["能打仗方能止战","止戈为武","以战去战","兵者，国之大事"],"answer":0,"exp":"“能打仗方能止战”揭示了准备打才可能不必打、越不能打越可能挨打的辩证法；止戈为武、以战去战、兵者国之大事虽谈战争，但不是题干原句。","note":"原填空题改造"},{"id":"zt2-005","chapter":"zt2","type":"single","stem":"潜艇按动力分为常规动力潜艇与（　）潜艇。","options":["蒸汽动力","闭式循环动力","柴电动力","非常规动力"],"answer":3,"exp":"教材按动力把潜艇分为常规动力潜艇和非常规动力潜艇两类；蒸汽动力、柴电动力、闭式循环动力属具体动力装置或常规动力，不能与之并列。","note":"原填空题改造"},{"id":"zt2-006","chapter":"zt2","type":"single","stem":"信息化装备的核心是（　）。","options":["军事通讯系统","军事侦察系统","军事信息系统","军事导航系统"],"answer":2,"exp":"信息化装备以军事信息系统为纽带，把通信、侦察、导航等系统联为一体，故其核心是军事信息系统，其余选项均为其分系统。"},{"id":"zt2-008","chapter":"zt2","type":"single","stem":"“财不盖天下，不能正天下”说的是（　）问题。","options":["战争起因","战争性质","战争与政治的关系","战争与经济的关系"],"answer":3,"exp":"此语意为财力不足以覆盖天下就无法号令天下，说明经济实力是进行战争和赢得战争的基础，讲的是战争与经济的关系。"},{"id":"zt2-009","chapter":"zt2","type":"single","stem":"（　）是毛泽东军事思想的核心内容。","options":["人民战争思想","积极防御","运动战","游击战"],"answer":0,"exp":"人民战争思想是毛泽东军事思想的核心，人民军队、人民战争、战略战术等理论中，人民战争居于中心地位，故选项正确。"},{"id":"zt2-010","chapter":"zt2","type":"single","stem":"（　）成为信息化装备全面走上战争舞台的标志。","options":["海湾战争","利比亚战争","伊拉克战争","叙利亚战争"],"answer":0,"exp":"1991年海湾战争大量使用精确制导武器、电子战手段和指挥自动化系统，被视为信息化装备全面走上战争舞台的标志。"},{"id":"zt2-011","chapter":"zt2","type":"single","stem":"一般认为直接命中概率达（　）以上的制导武器才能称为精确制导武器。","options":["40%","50%","60%","70%"],"answer":1,"exp":"通常以直接命中概率达到50%以上作为精确制导武器的门槛，低于此值仍属普通制导武器，故选50%。"},{"id":"zt2-012","chapter":"zt2","type":"multi","stem":"按防卫力量的运用方式，国防可分为（　）。","options":["中立型国防","独立自主型国防","联盟型国防","扩张型国防"],"answer":[0,1,2],"exp":"按防卫力量运用方式，国防分为独立自主型、联盟型和中立型三类；扩张型是按国防政策性质划分的类型，与本题分类标准不同，故不选D。"},{"id":"zt2-013","chapter":"zt2","type":"multi","stem":"深化国防和军队改革，是为了设计和塑造军队未来。领导管理和作战指挥体制改革，以重塑军委机关和战区为重点，强化中央军委集中统一领导和战略指挥、战略管理功能，建立（　）的新格局。","options":["军委管总","联指主战","战区主战","军种主建"],"answer":[0,2,3],"exp":"改革确立军委管总、战区主战、军种主建的新格局：军委集中统一领导，战区专司联合作战指挥，军种负责建设管理；B项“联指主战”表述不规范，故选A、C、D。"},{"id":"zt2-014","chapter":"zt2","type":"multi","stem":"新概念武器与其它武器本质的区别，主要表现在（　）等方面。","options":["基本原理不同","杀伤机理不同","作战方式不同","使用时机不同"],"answer":[0,1,2,3],"exp":"新概念武器依托新原理、新能源，其基本原理、杀伤机理与传统武器不同，作战方式和使用时机也随之改变，四点都是本质区别，故选ABCD。"},{"id":"zt2-015","chapter":"zt2","type":"multi","stem":"大学生有哪些入伍优待政策（　）","options":["学费减免政策","升学考学优待政策","部队考学提干政策","退役复学后，经学校同意并履行相关程序后，可转入本校其他专业学习"],"answer":[0,1,2,3],"exp":"大学生入伍可享受学费补偿减免、升学考学优待、部队考学提干，退役复学后还可按规定转专业，四项均属优待政策，故选ABCD。"},{"id":"zt2-016","chapter":"zt2","type":"judge","stem":"传统安全与非传统安全不仅有产生先后、表现形式不同的区分，也有轻重的区分。","options":["正确","错误"],"answer":1,"exp":"传统安全与非传统安全只有产生时间、表现形式和作用范围的不同，没有轻重之分，二者相互交织渗透，必须统筹应对，故该判断错误。"},{"id":"zt2-017","chapter":"zt2","type":"judge","stem":"无人化兵器登上战争舞台，必将对传统的军事思想、作战理论、作战样式、军事组织结构和武器装备发展等带来一系列新的变革和挑战。","options":["正确","错误"],"answer":0,"exp":"无人化兵器改变作战力量构成和交战方式，推动作战理论、编制体制和装备发展变革，同时带来伦理、法律和安全等方面的新挑战，表述正确。"},{"id":"zt2-018","chapter":"zt2","type":"judge","stem":"战争实践证明，在具备一定的客观物质基础之上，军事思想正确与否决定战争胜负。","options":["正确","错误"],"answer":0,"exp":"战争胜负取决于客观物质条件和主观指导两方面，在物质基础具备的前提下，军事思想正确与否直接决定作战指导的成败，进而影响战争胜负。"},{"id":"zt2-019","chapter":"zt2","type":"judge","stem":"当今世界，意识形态领域看不见硝烟的战争无处不在，政治领域没有枪炮的较量一直未停。","options":["正确","错误"],"answer":0,"exp":"意识形态和政治领域的较量虽无枪炮硝烟，却直接关系国家政权安全和人心向背，是和平时期国家安全斗争的重要方面，题干表述正确。"},{"id":"zt2-020","chapter":"zt2","type":"judge","stem":"法国首先创制了将火力、装甲防护能力和机动能力结合为一体的坦克，使战车以全新的面貌出现于战场。","options":["正确","错误"],"answer":1,"exp":"首先创制坦克的是英国，1916年索姆河战役中首次投入使用；法国是较早为坦克装上旋转炮塔、使其成为独立战斗车辆的国家，故表述有误。"},{"id":"zt2-021","chapter":"zt2","type":"judge","stem":"台湾问题事关国家主权和领土完整，是中国国家核心利益所在。","options":["正确","错误"],"answer":0,"exp":"台湾是中国领土不可分割的一部分，台湾问题涉及国家主权和领土完整，属于国家核心利益，不容任何外来干涉，题干表述正确。"},{"id":"zt2-022","chapter":"zt2","type":"judge","stem":"根据国家相关政策，当年年满17周岁，未满18岁的男性高中（含中专、职高、技校）毕业生，本人自愿的也可以参加兵役登记。","options":["正确","错误"],"answer":0,"exp":"兵役法规定每年十二月三十一日前年满十八周岁的男性公民应进行兵役登记，当年年满十七周岁未满十八周岁、本人自愿的也可登记。"},{"id":"zt2-023","chapter":"zt2","type":"judge","stem":"铜器时代的到来标志着冷兵器进入了成熟阶段。","options":["正确","错误"],"answer":1,"exp":"冷兵器成熟于铁器时代。青铜器时代虽已使用青铜兵器，但青铜质脆易折，冶铁技术进步后才使冷兵器走向成熟，故该判断错误。"},{"id":"zt2-024","chapter":"zt2","type":"judge","stem":"军事手段是国防的惟一手段。","options":["正确","错误"],"answer":1,"exp":"国防手段包括军事、政治、经济、外交、科技、教育等多种手段，军事手段是主要手段但并非唯一手段，故惟一的说法错误。"},{"id":"zt2-025","chapter":"zt2","type":"judge","stem":"智能化作战平台归根结底仍然是人的能力的延伸和发展。","options":["正确","错误"],"answer":0,"exp":"智能化作战平台由人设计、控制和运用，其自主性服务于人的意图，无论智能水平多高，都是人的能力的延伸和发展，不能取代人的主导地位。"}]};
const KEY = "junli_bank_v3";
const LS = (() => { try { return window.localStorage; } catch (e) { return null; } })();

const ALL = DATA.questions;
const CHAPS = DATA.meta.chapters;
const TYPES = DATA.meta.types;
const CHAP_NAME = {};
CHAPS.forEach(c => CHAP_NAME[c.id] = c.name.replace(/^第\d+章\s*/, ""));
const TYPE_NAME = {};
TYPES.forEach(t => TYPE_NAME[t.id] = t.name);
const LETTERS = "ABCDE";
const EXAM_MIN = 25;

/* 需要「整句记忆」的题：
   ① 由填空题改造而来（选项就是原填空的完整答案）；
   ② 正确选项本身是一整段话/一长串要素，只记关键词会选错。 */
const MEMO_KIND = {};
ALL.forEach(q => {
  if (q.note) { MEMO_KIND[q.id] = "fill"; return; }
  if (q.type === "judge") return;
  const idxs = Array.isArray(q.answer) ? q.answer : [q.answer];
  const text = idxs.map(i => q.options[i] || "").join("");
  if (text.length >= 14) MEMO_KIND[q.id] = "long";
});
const MEMO_TIP = {
  fill: "本题由填空题改造：正确选项就是原填空题的答案，需要整句逐字记住，不能只记关键词。",
  long: "本题正确选项是一段完整表述（多个要素/长句），答题时要能完整复述，不能只认关键词。"
};

const DEFAULT = { ans: {}, stars: {}, cur: null, chapter: "all", type: "all",
  mode: "seq", seed: 20261122, theme: "auto", search: "", autoNext: true, exam: null };
let state = JSON.parse(JSON.stringify(DEFAULT));
try {
  const raw = LS && LS.getItem(KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) { /* 存档损坏则用默认值 */ }
if (!state.ans) state.ans = {};
if (!state.stars) state.stars = {};
state.search = "";

const $ = s => document.querySelector(s);
let selSet = null;          // 多选题临时选择
let autoTimer = null;
let clockTimer = null;

function save() {
  try { LS && LS.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

function isWrong(id) { const a = state.ans[id]; return !!a && a.r === 0; }

function memoKind(q) { return MEMO_KIND[q.id] || ""; }

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function list() {
  let arr = ALL;
  if (state.mode === "wrong") arr = arr.filter(q => isWrong(q.id));
  if (state.mode === "star") arr = arr.filter(q => state.stars[q.id]);
  if (state.mode === "memo") arr = arr.filter(q => memoKind(q));
  if (state.chapter !== "all") arr = arr.filter(q => q.chapter === state.chapter);
  if (state.type !== "all") arr = arr.filter(q => q.type === state.type);
  const kw = state.search.trim();
  if (kw) {
    arr = arr.filter(q => q.stem.indexOf(kw) >= 0 || q.options.some(o => o.indexOf(kw) >= 0));
  }
  if (state.mode === "random") {
    arr = arr.slice().sort((a, b) => hash(a.id + state.seed) - hash(b.id + state.seed));
  }
  return arr;
}

function stats() {
  const ids = Object.keys(state.ans);
  let right = 0, judged = 0;
  ids.forEach(id => {
    const r = state.ans[id].r;
    if (r === 1 || r === 0) { judged++; if (r === 1) right++; }
  });
  return { done: ids.length, judged, right,
    wrong: ids.filter(isWrong).length,
    star: Object.keys(state.stars).filter(k => state.stars[k]).length };
}

function refreshStats() {
  const s = stats();
  $("#s-done").textContent = s.done;
  $("#s-total").textContent = ALL.length;
  $("#s-acc").textContent = s.judged ? Math.round(s.right / s.judged * 100) + "%" : "—";
  $("#s-wrong").textContent = s.wrong;
  $("#s-star").textContent = s.star;
  $("#bar").style.width = (s.done / ALL.length * 100).toFixed(1) + "%";
}

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}

/* ============ 练习模式 ============ */
function render() {
  refreshStats();
  if (state.mode === "exam") { renderExam(); return; }
  $("#exam-card").hidden = true;
  $("#card").hidden = false;

  const arr = list();
  if (!arr.length) {
    $("#card").hidden = true;
    $("#empty").hidden = false;
    $("#empty").textContent = state.mode === "wrong" ? "错题本是空的 —— 先去做几题吧（答错的题会自动进来）。"
      : state.mode === "star" ? "还没有收藏的题目，点题目右上角的 ☆ 就能收藏。"
      : state.mode === "memo" ? "当前筛选下没有需要整句记忆的题目。"
      : state.search ? "没有匹配的题目，换个关键词试试。"
      : "当前筛选下没有题目。";
    return;
  }
  $("#empty").hidden = true;
  $("#card").hidden = false;

  let i = arr.findIndex(q => q.id === state.cur);
  if (i < 0) {
    const fresh = arr.findIndex(q => !state.ans[q.id]);
    i = fresh >= 0 ? fresh : 0;
  }
  const q = arr[i];
  state.cur = q.id;

  $("#q-no").textContent = (i + 1) + " / " + arr.length;
  $("#q-chap").textContent = CHAP_NAME[q.chapter] || q.chapter;
  $("#q-type").textContent = TYPE_NAME[q.type] || q.type;

  const kind = memoKind(q);
  const memoTag = $("#q-memo");
  memoTag.hidden = !kind;
  memoTag.textContent = kind === "fill" ? "填空改编 · 整句记忆" : kind ? "长答案 · 整句记忆" : "";
  const tip = $("#memo-tip");
  if (kind) { tip.hidden = false; tip.textContent = MEMO_TIP[kind]; }
  else { tip.hidden = true; tip.textContent = ""; }

  $("#stem").textContent = q.stem;
  const star = $("#q-star");
  star.textContent = state.stars[q.id] ? "★" : "☆";
  star.classList.toggle("on", !!state.stars[q.id]);

  const skim = state.mode === "skim";
  const rec = state.ans[q.id];
  const answered = !!rec && !skim;
  const reveal = skim || answered;
  const picked = answered ? rec.p : null;

  const box = $("#opts");
  box.textContent = "";
  q.options.forEach((text, idx) => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.dataset.idx = idx;
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = q.type === "judge" ? (idx === 0 ? "✓" : "✗") : LETTERS[idx];
    const sp = document.createElement("span");
    sp.className = "txt";
    sp.textContent = text;
    b.append(k, sp);
    if (reveal) {
      b.disabled = true;
      const isRight = q.type === "multi" ? q.answer.indexOf(idx) >= 0 : q.answer === idx;
      const isPick = Array.isArray(picked) ? picked.indexOf(idx) >= 0 : picked === idx;
      if (isRight) b.classList.add("right");
      else if (isPick) b.classList.add("wrong");
      if (isRight && kind) {
        const mf = document.createElement("span");
        mf.className = "memoflag";
        mf.textContent = kind === "fill" ? "填空答案·整句背" : "整句背";
        mf.title = kind === "fill"
          ? "此选项就是原填空题的答案，需整句逐字记住"
          : "此选项是一段完整表述，需整句记住";
        b.appendChild(mf);
      }
    }
    b.addEventListener("click", () => onPick(q, idx));
    box.appendChild(b);
  });

  if (!reveal && q.type === "multi") {
    if (!selSet || selSet.for !== q.id) selSet = { for: q.id, set: [] };
    selSet.set.forEach(idx => {
      const el = box.querySelector('.opt[data-idx="' + idx + '"]');
      if (el) el.classList.add("sel");
    });
  } else {
    selSet = null;
  }

  const fb = $("#fb");
  fb.textContent = "";
  if (answered) {
    if (rec.r === null || rec.r === undefined) {
      fb.append(ansLine(q, "已显示答案"));
    } else if (rec.r === 1) {
      const ok = document.createElement("span");
      ok.className = "ok"; ok.textContent = "✓ 回答正确";
      fb.append(ok, ansLine(q, ""));
    } else {
      const bad = document.createElement("span");
      bad.className = "bad"; bad.textContent = "✗ 回答错误";
      fb.append(bad, ansLine(q, ""));
    }
  }

  showExp(q, reveal);

  $("#confirm").hidden = !(q.type === "multi" && !reveal);
  $("#confirm").disabled = !(selSet && selSet.set.length);
  $("#peek").hidden = reveal || state.mode === "skim";
  $("#prev").disabled = i === 0;
  $("#next").disabled = i === arr.length - 1;

  const card = $("#card");
  card.classList.remove("anim");
  card.classList.add("anim");
}

function showExp(q, reveal) {
  const box = $("#exp");
  if (!reveal || !q.exp) { box.hidden = true; box.textContent = ""; return; }
  box.hidden = false;
  box.textContent = "";
  const b = document.createElement("b");
  b.textContent = "解析：";
  box.append(b, document.createTextNode ? document.createTextNode(q.exp) : q.exp);
}

function ansLine(q, prefix) {
  const span = document.createElement("span");
  span.className = "ans";
  const idxs = Array.isArray(q.answer) ? q.answer : [q.answer];
  const label = idxs.map(i => LETTERS[i] + ". " + q.options[i]).join("；");
  span.textContent = (prefix ? prefix + " " : "") + "正确答案：" + label;
  return span;
}

function onPick(q, idx) {
  if (state.mode === "skim") return;
  if (state.mode === "exam") { examPick(idx); return; }
  if (state.ans[q.id] && state.mode !== "skim") return;
  if (q.type === "multi") {
    const sel = selSet && selSet.for === q.id ? selSet : (selSet = { for: q.id, set: [] });
    const at = sel.set.indexOf(idx);
    if (at >= 0) sel.set.splice(at, 1); else sel.set.push(idx);
    const el = document.querySelector('.opt[data-idx="' + idx + '"]');
    if (el) el.classList.toggle("sel", sel.set.indexOf(idx) >= 0);
    $("#confirm").disabled = sel.set.length === 0;
    return;
  }
  judge(q, idx);
}

function judge(q, picked) {
  let right;
  if (q.type === "multi") {
    const a = (Array.isArray(picked) ? picked : [picked]).slice().sort((x, y) => x - y);
    const b = q.answer.slice().sort((x, y) => x - y);
    right = a.length === b.length && a.every((v, i) => v === b[i]);
  } else {
    right = picked === q.answer;
  }
  const wasWrong = isWrong(q.id);
  state.ans[q.id] = { p: picked, r: right ? 1 : 0 };
  save();
  if (right && wasWrong && state.mode === "wrong") toast("已掌握，移出错题本");
  selSet = null;
  render();
  if (right && state.autoNext) {
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => step(1), 650);
  }
}

$("#confirm").addEventListener("click", () => {
  const arr = list();
  const q = arr.find(x => x.id === state.cur);
  if (!q || !selSet || !selSet.set.length) return;
  judge(q, selSet.set.slice());
});

$("#peek").addEventListener("click", () => {
  const arr = list();
  const q = arr.find(x => x.id === state.cur);
  if (!q || state.ans[q.id]) return;
  state.ans[q.id] = { p: null, r: null };
  save(); render();
});

$("#q-star").addEventListener("click", () => {
  if (!state.cur) return;
  const on = !state.stars[state.cur];
  state.stars[state.cur] = on;
  save(); render();
  toast(on ? "已收藏" : "已取消收藏");
});

function step(delta) {
  const arr = list();
  if (!arr.length) return;
  let i = arr.findIndex(q => q.id === state.cur);
  if (i < 0) i = 0;
  const j = Math.min(arr.length - 1, Math.max(0, i + delta));
  if (j === i) return;
  state.cur = arr[j].id;
  save(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("#prev").addEventListener("click", () => step(-1));
$("#next").addEventListener("click", () => step(1));

/* ============ 模拟考试 ============ */
function pick(pool, n) {
  const c = pool.slice();
  for (let i = c.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [c[i], c[j]] = [c[j], c[i]];
  }
  return c.slice(0, n);
}

function startExam() {
  const ids = []
    .concat(pick(ALL.filter(q => q.type === "judge"), 10).map(q => q.id))
    .concat(pick(ALL.filter(q => q.type === "single"), 10).map(q => q.id))
    .concat(pick(ALL.filter(q => q.type === "multi"), 5).map(q => q.id));
  state.exam = { ids, ans: {}, idx: 0, startAt: Date.now(),
    deadline: Date.now() + EXAM_MIN * 60000, submitted: false, result: null };
  state.mode = "exam";
  save(); render();
}

function examQuestions() {
  const map = {};
  ALL.forEach(q => map[q.id] = q);
  return state.exam.ids.map(id => map[id]).filter(Boolean);
}

function renderExam() {
  $("#card").hidden = true;
  const card = $("#exam-card");
  card.hidden = false;
  const ex = state.exam;
  if (!ex) { startPanel(); return; }

  if (ex.submitted) { renderResult(); return; }

  const qs = examQuestions();
  const q = qs[Math.min(ex.idx, qs.length - 1)];
  $("#ex-no").textContent = (ex.idx + 1) + " / " + qs.length;
  $("#ex-type").textContent = TYPE_NAME[q.type] || q.type;
  $("#ex-stem").textContent = q.stem;

  const box = $("#ex-opts");
  box.textContent = "";
  const picked = ex.ans[q.id];
  q.options.forEach((text, idx) => {
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.dataset.idx = idx;
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = q.type === "judge" ? (idx === 0 ? "✓" : "✗") : LETTERS[idx];
    const sp = document.createElement("span");
    sp.className = "txt";
    sp.textContent = text;
    b.append(k, sp);
    const isPick = Array.isArray(picked) ? picked.indexOf(idx) >= 0 : picked === idx;
    if (isPick) b.classList.add("sel");
    b.addEventListener("click", () => examPick(idx));
    box.appendChild(b);
  });

  const answered = Object.keys(ex.ans).length;
  $("#ex-done").textContent = answered;
  $("#ex-bar").style.width = (answered / qs.length * 100).toFixed(1) + "%";
  $("#ex-prev").disabled = ex.idx === 0;
  $("#ex-next").disabled = ex.idx === qs.length - 1;

  const sheet = $("#ex-sheet");
  sheet.textContent = "";
  qs.forEach((item, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.className = ex.ans[item.id] ? "done" : "";
    if (i === ex.idx) b.classList.add("cur");
    b.addEventListener("click", () => { ex.idx = i; save(); renderExam(); });
    sheet.appendChild(b);
  });

  startClock();
}

function examPick(idx) {
  const ex = state.exam;
  if (!ex || ex.submitted) return;
  const qs = examQuestions();
  const q = qs[Math.min(ex.idx, qs.length - 1)];
  if (q.type === "multi") {
    let cur = ex.ans[q.id] || [];
    const at = cur.indexOf(idx);
    cur = at >= 0 ? cur.filter(v => v !== idx) : cur.concat(idx);
    ex.ans[q.id] = cur.length ? cur.sort((a, b) => a - b) : undefined;
    if (!cur.length) delete ex.ans[q.id];
  } else {
    ex.ans[q.id] = idx;
  }
  save(); renderExam();
}

function startClock() {
  clearInterval(clockTimer);
  clockTimer = setInterval(tickClock, 1000);
  tickClock();
}

function tickClock() {
  const ex = state.exam;
  if (!ex || ex.submitted) { clearInterval(clockTimer); return; }
  const left = Math.max(0, ex.deadline - Date.now());
  const m = Math.floor(left / 60000);
  const s = Math.floor((left % 60000) / 1000);
  const el = $("#ex-clock");
  el.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  el.classList.toggle("low", left < 120000);
  if (left <= 0) { toast("时间到，自动交卷"); submitExam(true); }
}

function submitExam(auto) {
  const ex = state.exam;
  if (!ex || ex.submitted) return;
  if (!auto && !confirm("确定交卷？交卷后不能再修改答案。")) return;
  const qs = examQuestions();
  let right = 0;
  const wrongs = [];
  qs.forEach(q => {
    const picked = ex.ans[q.id];
    if (picked === undefined) { wrongs.push(q.id); return; }
    const ok = q.type === "multi"
      ? JSON.stringify(picked.slice().sort((a, b) => a - b)) === JSON.stringify(q.answer.slice().sort((a, b) => a - b))
      : picked === q.answer;
    if (ok) right++; else wrongs.push(q.id);
    state.ans[q.id] = { p: picked, r: ok ? 1 : 0 };
  });
  ex.submitted = true;
  ex.result = { right, total: qs.length, wrongs, used: Math.min(EXAM_MIN * 60000, Date.now() - ex.startAt) };
  clearInterval(clockTimer);
  save(); refreshStats(); renderExam();
}

function renderResult() {
  const ex = state.exam;
  const r = ex.result;
  $("#ex-stem").textContent = "考试结束";
  $("#ex-opts").textContent = "";
  $("#ex-sheet").textContent = "";
  $("#ex-done").textContent = r.right;
  $("#ex-clock").textContent = Math.floor(r.used / 60000) + " 分 " + Math.floor((r.used % 60000) / 1000) + " 秒";
  $("#ex-bar").style.width = (r.right / r.total * 100).toFixed(1) + "%";

  const wrap = $("#ex-opts");
  const score = document.createElement("div");
  score.className = "score";
  score.textContent = r.right + " / " + r.total;
  const sm = document.createElement("small");
  sm.textContent = "得分 " + Math.round(r.right / r.total * 100);
  score.appendChild(sm);
  wrap.appendChild(score);

  const tip = document.createElement("div");
  tip.className = "hint";
  tip.textContent = r.wrongs.length ? "错题已记入错题本，下面可以逐题看解析：" : "全对，太稳了。";
  wrap.appendChild(tip);

  const map = {};
  ALL.forEach(q => map[q.id] = q);
  const listBox = document.createElement("div");
  listBox.className = "wlist";
  r.wrongs.forEach(id => {
    const q = map[id];
    const item = document.createElement("div");
    item.className = "witem";
    const s = document.createElement("div");
    s.className = "s"; s.textContent = q.stem;
    const a = document.createElement("div");
    a.className = "a";
    a.textContent = "正确答案：" + (Array.isArray(q.answer)
      ? q.answer.map(i => LETTERS[i] + ". " + q.options[i]).join("；")
      : LETTERS[q.answer] + ". " + q.options[q.answer]);
    const y = document.createElement("div");
    y.className = "y";
    const p = ex.ans[q.id];
    y.textContent = p === undefined ? "你未作答" : "你选了：" + (Array.isArray(p)
      ? p.map(i => LETTERS[i] + ". " + q.options[i]).join("；")
      : LETTERS[p] + ". " + q.options[p]);
    item.append(s, a, y);
    if (q.exp) {
      const e = document.createElement("div");
      e.className = "exp";
      e.textContent = "解析：" + q.exp;
      item.appendChild(e);
    }
    listBox.appendChild(item);
  });
  wrap.appendChild(listBox);

  const acts = document.createElement("div");
  acts.className = "acts";
  const again = document.createElement("button");
  again.textContent = "再考一次";
  again.addEventListener("click", startExam);
  const back = document.createElement("button");
  back.textContent = "回到刷题";
  back.addEventListener("click", () => { state.mode = "seq"; state.exam = null; state.cur = null; save(); syncChips(); render(); });
  acts.append(again, back);
  wrap.appendChild(acts);
}

function startPanel() {
  /* 考试前的说明页 */
  const wrap = $("#ex-opts");
  $("#ex-stem").textContent = "模拟考试说明";
  $("#ex-no").textContent = "";
  $("#ex-type").textContent = "";
  wrap.textContent = "";
  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "共 25 题：判断 10 题、单选 10 题、多选 5 题，限时 25 分钟。"
    + "交卷后给出得分与错题解析，答题结果会记入统计和错题本。";
  wrap.appendChild(hint);
  const acts = document.createElement("div");
  acts.className = "acts";
  const start = document.createElement("button");
  start.textContent = "开始考试";
  start.addEventListener("click", startExam);
  const back = document.createElement("button");
  back.textContent = "返回刷题";
  back.addEventListener("click", () => { state.mode = "seq"; save(); syncChips(); render(); });
  acts.append(start, back);
  wrap.appendChild(acts);
  $("#ex-sheet").textContent = "";
  $("#ex-bar").style.width = "0";
  $("#ex-done").textContent = "0";
}

$("#btn-exam").addEventListener("click", () => {
  state.mode = "exam";
  save(); syncChips();
  renderExam();   // 无考试→说明页；未交卷→继续作答；已交卷→成绩页
  refreshStats();
});

$("#ex-submit").addEventListener("click", () => submitExam(false));
$("#ex-prev").addEventListener("click", () => {
  const ex = state.exam;
  if (ex && ex.idx > 0) { ex.idx--; save(); renderExam(); }
});
$("#ex-next").addEventListener("click", () => {
  const ex = state.exam;
  const qs = examQuestions();
  if (ex && ex.idx < qs.length - 1) { ex.idx++; save(); renderExam(); }
});

/* ============ 统计面板 ============ */
function openStats() {
  const body = $("#panel-body");
  body.textContent = "";
  const s = stats();

  const head = document.createElement("p");
  head.className = "hint";
  head.textContent = "已作答 " + s.done + " / " + ALL.length + " 题，判分 " + s.judged
    + " 题，正确 " + s.right + " 题（" + (s.judged ? Math.round(s.right / s.judged * 100) : 0)
    + "%），错题 " + s.wrong + " 题，收藏 " + s.star + " 题。";
  body.appendChild(head);

  const tbl = document.createElement("table");
  const hr = document.createElement("tr");
  ["章节", "已答", "正确", "正确率", ""].forEach(t => {
    const th = document.createElement("th"); th.textContent = t; hr.appendChild(th);
  });
  tbl.appendChild(hr);
  CHAPS.forEach(c => {
    const qs = ALL.filter(q => q.chapter === c.id);
    let done = 0, right = 0;
    qs.forEach(q => {
      const a = state.ans[q.id];
      if (!a) return;
      done++;
      if (a.r === 1) right++;
    });
    const tr = document.createElement("tr");
    const name = document.createElement("td");
    name.textContent = c.name;
    const d = document.createElement("td"); d.className = "n"; d.textContent = done + "/" + qs.length;
    const r = document.createElement("td"); r.className = "n"; r.textContent = right;
    const p = document.createElement("td"); p.className = "n";
    p.textContent = done ? Math.round(right / done * 100) + "%" : "—";
    const act = document.createElement("td");
    const b = document.createElement("button");
    b.className = "mini ghost";
    b.textContent = "清空本章";
    b.addEventListener("click", () => clearChapter(c.id, c.name));
    act.appendChild(b);
    tr.append(name, d, r, p, act);
    tbl.appendChild(tr);
  });
  body.appendChild(tbl);

  const t2 = document.createElement("table");
  const hr2 = document.createElement("tr");
  ["题型", "已答", "正确", "正确率"].forEach(t => {
    const th = document.createElement("th"); th.textContent = t; hr2.appendChild(th);
  });
  t2.appendChild(hr2);
  TYPES.forEach(ty => {
    const qs = ALL.filter(q => q.type === ty.id);
    let done = 0, right = 0;
    qs.forEach(q => {
      const a = state.ans[q.id];
      if (!a) return;
      done++;
      if (a.r === 1) right++;
    });
    const tr = document.createElement("tr");
    const name = document.createElement("td"); name.textContent = ty.name;
    const d = document.createElement("td"); d.className = "n"; d.textContent = done + "/" + qs.length;
    const r = document.createElement("td"); r.className = "n"; r.textContent = right;
    const p = document.createElement("td"); p.className = "n";
    p.textContent = done ? Math.round(right / done * 100) + "%" : "—";
    tr.append(name, d, r, p);
    t2.appendChild(tr);
  });
  body.appendChild(t2);

  const memoCount = ALL.filter(q => memoKind(q)).length;
  const m = document.createElement("p");
  m.className = "hint";
  m.textContent = "全库共 " + memoCount + " 题需要整句记忆（其中由填空题改造 "
    + ALL.filter(q => memoKind(q) === "fill").length + " 题），可在顶部「整句记忆」里集中背。";
  body.appendChild(m);

  $("#panel").classList.add("show");
}

function clearChapter(cid, cname) {
  if (!confirm("清空「" + cname + "」的答题记录？收藏不受影响。")) return;
  ALL.forEach(q => { if (q.chapter === cid) delete state.ans[q.id]; });
  save(); refreshStats(); openStats(); render();
  toast("已清空本记录");
}

$("#btn-stats").addEventListener("click", openStats);
$("#panel-close").addEventListener("click", () => $("#panel").classList.remove("show"));
$("#panel").addEventListener("click", e => { if (e.target.id === "panel") $("#panel").classList.remove("show"); });

/* ============ 工具栏 ============ */
function fillSelect(sel, items, allLabel, value) {
  sel.textContent = "";
  const o0 = document.createElement("option");
  o0.value = "all"; o0.textContent = allLabel;
  sel.appendChild(o0);
  items.forEach(it => {
    const o = document.createElement("option");
    o.value = it.id; o.textContent = it.name;
    sel.appendChild(o);
  });
  sel.value = value;
}

function syncChips() {
  const chips = document.querySelectorAll("#chips button[data-mode]");
  chips.forEach(b => b.classList.toggle("on", b.dataset.mode === state.mode));
  $("#btn-exam").classList.toggle("on", state.mode === "exam");
}

function syncTools() {
  fillSelect($("#f-chapter"), CHAPS, "全部章节", state.chapter);
  fillSelect($("#f-type"), TYPES, "全部题型", state.type);
  $("#f-theme").value = state.theme;
  $("#f-auto").checked = state.autoNext !== false;
  document.documentElement.setAttribute("data-theme", state.theme);
  syncChips();
}

$("#f-chapter").addEventListener("change", e => {
  state.chapter = e.target.value; state.cur = null; save(); render();
});
$("#f-type").addEventListener("change", e => {
  state.type = e.target.value; state.cur = null; save(); render();
});
$("#f-search").addEventListener("input", e => {
  state.search = e.target.value; state.cur = null; render();
});
$("#f-theme").addEventListener("change", e => {
  state.theme = e.target.value;
  document.documentElement.setAttribute("data-theme", state.theme);
  save();
});
$("#f-auto").addEventListener("change", e => {
  state.autoNext = e.target.checked;
  save();
});

document.querySelectorAll("#chips button[data-mode]").forEach(b => {
  b.addEventListener("click", () => {
    state.mode = b.dataset.mode;
    state.cur = null;
    clearInterval(clockTimer);
    save(); syncChips(); render();
  });
});

$("#reset").addEventListener("click", () => {
  if (!confirm("清空本机所有答题记录、收藏和考试记录？此操作不可撤销。")) return;
  state = JSON.parse(JSON.stringify(DEFAULT));
  save(); syncTools(); render(); toast("已重置");
});

/* ============ 键盘 ============ */
document.addEventListener("keydown", e => {
  if (state.mode === "exam") return;
  const arr = list();
  if (!arr.length) return;
  const q = arr.find(x => x.id === state.cur) || arr[0];
  const k = e.key;
  if (k === "ArrowLeft") { step(-1); return; }
  if (k === "ArrowRight") { step(1); return; }
  let idx = -1;
  if (/^[1-5]$/.test(k)) idx = parseInt(k, 10) - 1;
  else if (/^[a-eA-E]$/.test(k)) idx = "ABCDE".indexOf(k.toUpperCase());
  if (idx >= 0 && idx < q.options.length) { e.preventDefault(); onPick(q, idx); }
});

syncTools();
render();
</script>
