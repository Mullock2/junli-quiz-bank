<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>军事理论题库（2026）</title>
<style>
  :root{
    --bg:#f3f5fb; --card:#ffffff; --ink:#151b26; --dim:#6b7686; --faint:#8b95a5;
    --line:#e5e9f2; --soft:#f2f5fb;
    --brand:#4557f5; --brand2:#7a4dff; --brandsoft:rgba(69,87,245,.10);
    --ok:#0f9d63; --okbg:#eafaf1; --okline:#0f9d63;
    --bad:#e0342f; --badbg:#fdedec; --badline:#e0342f;
    --star:#f0a92c; --memo:#a25b00; --memobg:#fff7e5; --memoline:#f0b429;
    --shadow:0 12px 30px -14px rgba(21,32,64,.20), 0 2px 6px rgba(21,32,64,.04);
    --shadow-sm:0 2px 8px rgba(21,32,64,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --card:#161c25; --ink:#e8edf5; --dim:#94a1b2; --faint:#7c8899;
    --line:#242e3a; --soft:#1d242f;
    --brand:#6d84ff; --brand2:#9a7bff; --brandsoft:rgba(109,132,255,.16);
    --ok:#3fce93; --okbg:#12291f; --okline:#3fce93;
    --bad:#ff7169; --badbg:#2c1818; --badline:#ff7169;
    --star:#f5c451; --memo:#f2c477; --memobg:#2a2314; --memoline:#c08a2a;
    --shadow:0 14px 34px -18px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.35);
    --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="auto"]{
      --bg:#0d1117; --card:#161c25; --ink:#e8edf5; --dim:#94a1b2; --faint:#7c8899;
      --line:#242e3a; --soft:#1d242f;
      --brand:#6d84ff; --brand2:#9a7bff; --brandsoft:rgba(109,132,255,.16);
      --ok:#3fce93; --okbg:#12291f; --okline:#3fce93;
      --bad:#ff7169; --badbg:#2c1818; --badline:#ff7169;
      --star:#f5c451; --memo:#f2c477; --memobg:#2a2314; --memoline:#c08a2a;
      --shadow:0 14px 34px -18px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.35);
      --shadow-sm:0 2px 8px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.65 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::before{
    content:""; position:fixed; inset:-20% -10% auto -10%; height:520px; z-index:-1;
    background:
      radial-gradient(48% 46% at 18% 10%, rgba(69,87,245,.20), transparent 70%),
      radial-gradient(46% 44% at 86% 0%, rgba(122,77,255,.18), transparent 70%);
    filter:blur(6px); pointer-events:none;
  }
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}

  /* ---------- 顶部 ---------- */
  .hero{
    position:relative; overflow:hidden; border-radius:24px; padding:20px 20px 18px;
    color:#fff; background:linear-gradient(135deg,#3f56f0 0%,#6a4cf6 52%,#9b4df3 100%);
    box-shadow:0 20px 44px -22px rgba(84,72,240,.75);
  }
  .hero::after{
    content:""; position:absolute; right:-70px; top:-90px; width:260px; height:260px;
    background:radial-gradient(circle,rgba(255,255,255,.28),transparent 62%); border-radius:50%;
  }
  .hero-top{display:flex; align-items:flex-start; gap:10px; position:relative; z-index:1}
  h1{font-size:21px; margin:0; font-weight:750; letter-spacing:.6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  h1 span{font-size:12px; font-weight:400; opacity:.82; letter-spacing:.4px}
  .hero-sub{margin:4px 0 0; font-size:12.5px; opacity:.8; letter-spacing:.3px}
  .kpills{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; position:relative; z-index:1}
  .kpill{
    display:flex; align-items:baseline; gap:5px; font-size:11.5px; letter-spacing:.3px;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.20);
    padding:6px 11px; border-radius:999px; backdrop-filter:blur(6px);
  }
  .kpill b{font-size:15px; font-weight:700; letter-spacing:0; font-variant-numeric:tabular-nums}
  .kpill i{font-style:normal; opacity:.65}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.26);margin-top:14px;overflow:hidden;position:relative;z-index:1}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.65); transition:width .35s ease}

  /* ---------- 工具条 ---------- */
  .toolbar{
    display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 10px;
  }
  select,input[type="search"],button{
    font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:9px 12px; cursor:pointer;
    box-shadow:var(--shadow-sm); transition:border-color .16s, box-shadow .16s, transform .12s;
  }
  select:hover,input[type="search"]:hover,button:hover{border-color:var(--brand)}
  input[type="search"]{cursor:text; flex:1; min-width:130px}
  select.theme{margin-left:auto; flex:0 0 auto}
  .toolbar #reset{flex:0 0 auto;padding:9px 14px}
  select{-webkit-appearance:none; appearance:none; padding-right:26px;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  button:active{transform:translateY(1px)}
  button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;
    box-shadow:0 8px 18px -10px rgba(84,72,240,.85)}
  button.ghost{background:transparent;box-shadow:none}

  .chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .chips button{padding:7px 13px;font-size:13.5px;border-radius:999px;box-shadow:var(--shadow-sm)}
  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--brand);width:15px;height:15px;margin:0}
  .grow{flex:1}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:20px 18px 16px; box-shadow:var(--shadow);
  }
  .card.anim{animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .meta{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--dim);margin-bottom:12px;flex-wrap:wrap}
  .tag{background:var(--soft);border-radius:999px;padding:3px 9px;letter-spacing:.2px}
  .tag.t{color:var(--brand);background:var(--brandsoft);font-weight:600}
  .tag.memo{color:var(--memo);background:var(--memobg);border:1px solid var(--memoline);
    font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .tag.memo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--memoline)}
  .star{margin-left:auto;background:transparent;border:0;box-shadow:none;font-size:20px;line-height:1;padding:2px 6px;color:var(--faint)}
  .star.on{color:var(--star);text-shadow:0 0 12px rgba(240,169,44,.45)}

  .memotip{
    display:flex; gap:8px; align-items:flex-start; margin:0 0 14px;
    padding:10px 12px; border-radius:12px; font-size:12.8px; line-height:1.6;
    color:var(--memo); background:var(--memobg); border-left:3px solid var(--memoline);
  }
  .memotip b{font-weight:700}

  .stem{font-size:17.5px;line-height:1.8;margin:2px 0 16px;font-weight:500;letter-spacing:.25px;white-space:pre-wrap}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);
    font-size:15.5px;line-height:1.65;box-shadow:none;
  }
  .opt:hover:not([disabled]){border-color:var(--brand);transform:translateX(2px);box-shadow:0 8px 20px -14px rgba(69,87,245,.7)}
  .opt .k{
    flex:0 0 26px;height:26px;border-radius:50%;background:var(--soft);
    display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--dim);
    margin-top:0; transition:background .16s,color .16s;
  }
  .opt .txt{flex:1}
  .opt.sel{border-color:var(--brand);background:var(--brandsoft);box-shadow:0 0 0 3px var(--brandsoft)}
  .opt.sel .k{background:var(--brand);color:#fff}
  .opt.right{border-color:var(--okline);background:var(--okbg);box-shadow:none}
  .opt.right .k{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--badline);background:var(--badbg)}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt.right::after{content:"✓";margin-left:6px;color:var(--ok);font-weight:800;align-self:center}
  .opt.wrong::after{content:"✕";margin-left:6px;color:var(--bad);font-weight:800;align-self:center}
  .opt .memoflag{
    flex:0 0 auto;align-self:center;margin-left:4px;padding:1px 7px;border-radius:999px;
    font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
    color:var(--memo);background:var(--memobg);border:1px solid var(--memoline);
  }
  .opt[disabled]{cursor:default;opacity:1}

  .fb{margin-top:14px;font-size:14.5px;min-height:22px;line-height:1.7}
  .fb .ok,.fb .bad{display:inline-flex;align-items:center;gap:6px;font-weight:700;
    padding:3px 10px;border-radius:999px;font-size:13.5px}
  .fb .ok{color:var(--ok);background:var(--okbg)}
  .fb .bad{color:var(--bad);background:var(--badbg)}
  .fb .ans{display:block;margin-top:8px;color:var(--ink);font-size:14.5px}
  .fb .ans em{font-style:normal;color:var(--faint)}
  .exp{
    margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--soft);
    border-left:3px solid var(--brand);
    font-size:14px;line-height:1.78;color:var(--dim);
  }
  .exp b{color:var(--brand);font-weight:700}

  .acts{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .acts button{flex:1;min-width:88px;padding:11px 12px;font-size:14.5px;border-radius:12px}
  #next,#confirm{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;
    font-weight:600;box-shadow:0 10px 22px -12px rgba(84,72,240,.85)}
  #next:disabled,#prev:disabled{opacity:.45;box-shadow:none}
  .empty{text-align:center;color:var(--dim);padding:52px 12px;font-size:15px;line-height:1.9}
  footer{margin-top:18px;font-size:12px;color:var(--faint);text-align:center;line-height:1.9}
  footer em{font-style:normal;color:var(--memo);font-weight:600}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(8px);
    background:rgba(17,24,39,.94);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;z-index:40;
    box-shadow:0 16px 34px -16px rgba(0,0,0,.7); backdrop-filter:blur(6px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 考试 ---------- */
  .examhead{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--dim);margin-bottom:10px;flex-wrap:wrap}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:15px;
    background:var(--soft);border-radius:999px;padding:3px 11px}
  .clock.low{color:#fff;background:var(--bad)}
  .sheet{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
  .sheet button{width:36px;height:32px;padding:0;font-size:13px;border-radius:9px;background:var(--card);box-shadow:none}
  .sheet button.done{background:var(--brandsoft);border-color:var(--brand);color:var(--brand);font-weight:700}
  .sheet button.cur{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;font-weight:700}
  .score{font-size:42px;font-weight:800;letter-spacing:1px;text-align:center;margin:10px 0 4px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .score small{font-size:14px;font-weight:500;color:var(--dim);margin-left:8px;-webkit-text-fill-color:var(--dim)}
  .wlist{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .witem{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;background:var(--soft)}
  .witem .s{font-weight:600;margin-bottom:6px;line-height:1.6}
  .witem .a{color:var(--ok)}
  .witem .y{color:var(--bad);margin-top:2px}
  .witem .exp{background:var(--card);margin-top:8px}

  /* ---------- 统计面板 ---------- */
  .panel{position:fixed;inset:0;background:rgba(12,18,30,.5);display:none;z-index:30;overflow:auto;padding:28px 12px;
    backdrop-filter:blur(4px)}
  .panel.show{display:block}
  .panel .inner{max-width:640px;margin:0 auto;background:var(--card);border-radius:22px;padding:22px 18px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.6); animation:rise .26s ease both}
  .panel h2{font-size:17px;margin:0 0 14px;letter-spacing:.4px}
  .panel table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px}
  .panel th,.panel td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:left}
  .panel th{color:var(--faint);font-weight:400;font-size:12px;letter-spacing:.3px}
  .panel td.n{font-variant-numeric:tabular-nums}
  .panel tr:last-child td{border-bottom:0}
  .mini{font-size:12.5px;padding:5px 10px;border-radius:9px;box-shadow:none}
  .hint{font-size:13px;color:var(--dim);line-height:1.8}

  @media (max-width:520px){
    .wrap{padding:12px 10px 40px}
    .hero{padding:16px 16px 14px;border-radius:20px}
    h1{font-size:19px}
    .stem{font-size:16.5px}
    .opt{font-size:15px;padding:12px}
    .card{padding:16px 14px 14px;border-radius:18px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div>
        <h1>军事理论题库<span>2026 · 刷题版</span></h1>
        <p class="hero-sub">南航《军事理论》 · 章节 + 综合练习 + 期末真题卷</p>
      </div>
    </div>
    <div class="kpills">
      <span class="kpill">进度 <b id="s-done">0</b><i>/</i><b id="s-total">0</b></span>
      <span class="kpill">正确率 <b id="s-acc">—</b></span>
      <span class="kpill">错题 <b id="s-wrong">0</b></span>
      <span class="kpill">收藏 <b id="s-star">0</b></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </header>

  <div class="toolbar">
    <select id="f-chapter" aria-label="章节"></select>
    <select id="f-type" aria-label="题型"></select>
    <input id="f-search" type="search" placeholder="搜索题干 / 选项…">
    <select id="f-theme" aria-label="主题" class="theme">
      <option value="auto">跟随系统</option>
      <option value="light">白天</option>
      <option value="dark">夜间</option>
    </select>
    <button id="reset" class="ghost" title="清空本机记录">重置</button>
  </div>

  <div class="chips" id="chips">
    <button data-mode="seq">顺序</button>
    <button data-mode="random">随机</button>
    <button data-mode="wrong">错题本</button>
    <button data-mode="star">收藏</button>
    <button data-mode="skim">速览</button>
    <button data-mode="memo">整句记忆</button>
    <button id="btn-exam">考试</button>
    <button id="btn-stats">统计</button>
    <label class="chk"><input type="checkbox" id="f-auto" checked> 答完自动下一题</label>
  </div>

  <div class="card" id="card">
    <div class="meta">
      <span class="tag" id="q-no"></span>
      <span class="tag" id="q-chap"></span>
      <span class="tag t" id="q-type"></span>
      <span class="tag memo" id="q-memo" hidden>整句记忆</span>
      <button class="star" id="q-star" title="收藏此题">☆</button>
    </div>
    <div class="memotip" id="memo-tip" hidden></div>
    <div class="stem" id="stem"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="exp" id="exp" hidden></div>
    <div class="acts">
      <button id="prev">← 上一题</button>
      <button id="confirm" hidden>确认答案</button>
      <button id="peek">看答案</button>
      <button id="next">下一题 →</button>
    </div>
  </div>

  <div class="card" id="exam-card" hidden>
    <div class="examhead">
      <span>模拟考试 · 25 题</span>
      <span class="clock" id="ex-clock">25:00</span>
      <span>已答 <b id="ex-done">0</b>/25</span>
      <span class="grow"></span>
      <button id="ex-submit" class="mini">交卷</button>
    </div>
    <div class="bar"><i id="ex-bar"></i></div>
    <div class="meta"><span class="tag" id="ex-no"></span><span class="tag" id="ex-type"></span></div>
    <div class="stem" id="ex-stem"></div>
    <div class="opts" id="ex-opts"></div>
    <div class="acts">
      <button id="ex-prev">← 上一题</button>
      <button id="ex-next">下一题 →</button>
    </div>
    <div class="sheet" id="ex-sheet"></div>
  </div>

  <div class="empty" id="empty" hidden></div>

  <footer>
    点选项即时判定 · 多选题选好后点「确认答案」<br>
    <em>整句记忆</em> 标记的题目，正确选项要整句背下来（多为由填空题改造的题）<br>
    键盘：1–5 ／ A–E 选选项，← → 切换题目
  </footer>
</div>

<div class="panel" id="panel">
  <div class="inner">
    <h2>学习统计</h2>
    <div id="panel-body"></div>
    <div class="acts"><button id="panel-close">关闭</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"meta":{"title":"军事理论题库（2026）","chapters":[{"id":"ch1","name":"第1章 中国国防"},{"id":"ch2","name":"第2章 国家安全"},{"id":"ch3","name":"第3章 军事思想"},{"id":"ch4","name":"第4章 现代战争"},{"id":"ch5","name":"第5章 信息化装备"},{"id":"zh","name":"综合练习"},{"id":"zt","name":"2025 期末真题卷（E 卷）"},{"id":"zt2","name":"2022 期末真题卷（D 卷）"}],"types":[{"id":"single","name":"单选题"},{"id":"multi","name":"多选题"},{"id":"judge","name":"判断题"}]},"questions":[{"id":"ch1-001","chapter":"ch1","type":"single","stem":"国防的主体是 （　）。","options":["军队","国家","政府","人民"],"answer":1,"exp":"国防是国家防备和抵抗侵略、制止武装颠覆的军事及相关活动，主体只能是国家；军队、政府、人民都在国家领导下参与国防，不能取代国家的主体地位。"},{"id":"ch1-002","chapter":"ch1","type":"single","stem":"（　）年7月，中国共产党成立，中国工人阶级开始以自觉的姿态登上历史舞台。","options":["1911","1919","1920","1921"],"answer":3,"exp":"1921年7月中国共产党成立，这是开天辟地的大事变；1919年五四运动是准备和开端，1920年各地开始建立早期组织，均早于党的正式成立。"},{"id":"ch1-003","chapter":"ch1","type":"single","stem":"（　）通篇贯穿“让军人成为全社会尊崇的职业”这条主线,对军人地位、荣誉维护、待遇保障、抚恤优待的基本原则和基本制度,以及国家和社会的保障责任作出系统规范。","options":["《中华人民共和国兵役法》","《中华人民共和国国防动员法》","《中华人民共和国国防教育法》","《中华人民共和国军人地位和权益保障法》"],"answer":3,"exp":"该法以“让军人成为全社会尊崇的职业”为主线，系统规范军人地位、荣誉维护、待遇保障和抚恤优待；兵役法管兵役义务，国防教育法管教育。"},{"id":"ch1-004","chapter":"ch1","type":"single","stem":"《中国人民解放军内务条令》属于国防法规体系的（　）层次。","options":["法律","军事法规","规章","地方性法规"],"answer":1,"exp":"国防法规体系分法律、军事法规、军事规章等层次，《内务条令》由中央军委制定，属军事法规；法律由全国人大及其常委会制定，规章层次更低。"},{"id":"ch1-005","chapter":"ch1","type":"single","stem":"中国人民解放军现设有（　）个战区。","options":["5","6","7","8"],"answer":0,"exp":"军委管总、战区主战格局下，全军按战略方向划分为东部、南部、西部、北部、中部五个战区，故为5个，其余数字均与实际设置不符。"},{"id":"ch1-006","chapter":"ch1","type":"single","stem":"每年九月的（　）个星期六为“全民国防教育日”。","options":["第一","第二","第三","第四"],"answer":2,"exp":"全民国防教育日由国防教育法规定，固定为每年九月的第三个星期六，便于全国统一组织和记忆；第一、第二、第四个星期六均非法定日期。"},{"id":"ch1-007","chapter":"ch1","type":"single","stem":"我国第一颗原子弹爆炸成功的时间是（　）。","options":["1964年10月","1966年10月","1967年6月","1970年4月"],"answer":0,"exp":"1964年10月我国第一颗原子弹爆炸成功；1966年10月是导弹核武器试验，1967年6月是氢弹爆炸，1970年4月是第一颗人造卫星，时间均不符。"},{"id":"ch1-008","chapter":"ch1","type":"single","stem":"《征兵工作条例》属于国防法规体系的（　）层次。","options":["法律","军事行政法规","规章","地方性法规"],"answer":1,"exp":"《征兵工作条例》由国务院、中央军委联合制定，属军事行政法规层次，低于法律；地方性法规由地方人大制定，与国防法规体系层次不同。"},{"id":"ch1-009","chapter":"ch1","type":"single","stem":"（　）是指导和规范中华人民共和国国防活动的基本法律依据。","options":["《中华人民共和国兵役法》","《中华人民共和国国防法》","《中华人民共和国国防动员法》","《中华人民共和国国防教育法》"],"answer":1,"exp":"《国防法》是国防领域的基本法律，规定国防活动的基本原则、领导体制和武装力量建设等，因而是指导和规范国防活动的基本法律依据。"},{"id":"ch1-010","chapter":"ch1","type":"single","stem":"（　）是规范中华人民共和国公民履行兵役义务的基本法律依据。","options":["《中华人民共和国兵役法》","《中华人民共和国国防法》","《中华人民共和国国防动员法》","《中华人民共和国国防教育法》"],"answer":0,"exp":"《兵役法》专门规定公民依法服兵役的权利义务、兵役制度和优抚安置，是公民履行兵役义务的基本法律依据；国防法则统领国防各领域。"},{"id":"ch1-011","chapter":"ch1","type":"single","stem":"（　）于2024年4月19日正式成立，是全新打造的战略性兵种。","options":["军事航天部队","网络空间部队","信息支援部队","联勤保障部队"],"answer":2,"exp":"信息支援部队是全新打造的战略性兵种，2024年4月19日正式成立，承担信息保障等任务；军事航天、网络空间、联勤保障部队的职能定位不同。"},{"id":"ch1-012","chapter":"ch1","type":"single","stem":"中国人民解放军诞生于1927年8月1日，初创时期称（　）。","options":["中国工农革命军","中国工农红军","八路军","新四军"],"answer":0,"exp":"南昌起义后部队打出中国工农革命军的旗号，后来才改称中国工农红军，抗战中又改编为八路军、新四军，故初创时期称中国工农革命军。"},{"id":"ch1-013","chapter":"ch1","type":"single","stem":"（　）是中国人民解放军的组成部分，是寓军于民、快速动员的有效组织形式，是现役部队的有效补充。","options":["中国人民解放军现役部队","中国人民解放军预备役部队","中国人民武装警察部队","民兵"],"answer":1,"exp":"预备役部队以现役军人为骨干、以预备役人员为基础编成，寓军于民、便于快速动员，是现役部队的有效补充；民兵则是不脱离生产的群众武装。"},{"id":"ch1-014","chapter":"ch1","type":"single","stem":"（　）是实施联勤保障和战略战役支援保障的主体力量,是中国特色现代军事力量体系的重要组成部分。","options":["军事航天部队","网络空间部队","信息支援部队","联勤保障部队"],"answer":3,"exp":"联勤保障部队是实施联勤保障和战略战役支援保障的主体力量；军事航天、网络空间、信息支援部队分别担负太空、网络、信息领域任务。"},{"id":"ch1-015","chapter":"ch1","type":"single","stem":"（　）手段是国防的主要手段，也是保底手段。","options":["教育","军事","科技","经济"],"answer":1,"exp":"国防手段包括军事、政治、经济、外交、教育等，其中军事手段最直接、最可靠，是主要手段，也是其他手段失效时的保底手段。"},{"id":"ch1-016","chapter":"ch1","type":"single","stem":"战时宣传教育和面向社会的思想发动属于（　）。","options":["武装力量动员","人民防空动员","信息动员","政治动员"],"answer":3,"exp":"政治动员指战时宣传教育和面向社会的思想发动，用以凝聚民心士气；武装力量动员调集兵力，人民防空动员防敌空袭，信息动员保障信息领域。"},{"id":"ch1-017","chapter":"ch1","type":"single","stem":"（　）是国防和军队建设中最活跃、最具变革性的因素。","options":["政治","经济","人才","科技"],"answer":3,"exp":"科技是国防和军队建设中最活跃、最具变革性的因素，历次军事革命多由技术突破引发；政治、经济、人才虽重要，但变革性不如科技突出。"},{"id":"ch1-018","chapter":"ch1","type":"single","stem":"（　）是国家为保障人民生命财产安全而发动和组织人民群众防备敌人空袭、消除空袭后果所进行的活动。","options":["武装力量动员","人民防空动员","信息动员","政治动员"],"answer":1,"exp":"人民防空动员是国家发动和组织群众防备敌人空袭、消除空袭后果的活动，简称人防；武装力量动员、信息动员、政治动员的对象和任务都不同。"},{"id":"ch1-019","chapter":"ch1","type":"single","stem":"（　）是海军中以水面舰艇为基本装备,在水面遂行作战任务的兵种,是海军的基本作战兵力。","options":["潜艇部队","水面舰艇部队","海军航空兵","海军陆战队"],"answer":1,"exp":"水面舰艇部队以水面舰艇为基本装备、在水面遂行作战任务，是海军的基本作战兵力；潜艇部队在水下活动，航空兵在空中，陆战队用于登陆作战。"},{"id":"ch1-020","chapter":"ch1","type":"single","stem":"1978年12月， （　）作出把党和国家的工作中心转移到经济建设上来、实行改革开放的历史性决策。","options":["党的十一届三中全会","党的十二届三中全会","党的十三届三中全会","党的十四届三中全会"],"answer":0,"exp":"1978年12月党的十一届三中全会作出把工作中心转移到经济建设上来、实行改革开放的历史性决策；十二届、十三届、十四届三中全会主题不同。"},{"id":"ch1-021","chapter":"ch1","type":"single","stem":"中国人民解放军是一支具有光荣历史的人民军队，诞生于（　）。","options":["1921年8月1日","1927年8月1日","1928年8月1日","1935年8月1日"],"answer":1,"exp":"1927年8月1日南昌起义打响武装反抗国民党反动派的第一枪，人民军队由此诞生，8月1日后来成为建军节；其余年份均不符史实。"},{"id":"ch1-022","chapter":"ch1","type":"single","stem":"（　）是党领导的人民武装力量的重要组成部分，肩负着维护国家安全和社会稳定、保卫人民美好生活的神圣使命。","options":["中国人民解放军现役部队","中国人民解放军预备役部队","中国人民武装警察部队","民兵"],"answer":2,"exp":"武警部队是党领导的人民武装力量的重要组成部分，担负维护国家安全和社会稳定、保卫人民美好生活的使命；现役、预备役部队和民兵定位不同。"},{"id":"ch1-023","chapter":"ch1","type":"single","stem":"（　）是军民融合发展的重点，也是衡量军民融合发展水平的重要标志。","options":["国防科技和武器装备领域","后勤建设","基础设施建设","新兴领域"],"answer":0,"exp":"国防科技和武器装备领域军民通用性强、带动作用大，是军民融合发展的重点，也是衡量融合水平的重要标志；后勤、基础设施等是重要方面而非标志。"},{"id":"ch1-024","chapter":"ch1","type":"single","stem":"自（　）参加联合国维和行动以来，中国军队在国际维和、国际救援、海外撤侨、远洋护航等行动中，发挥的作用越来越重要，已成为维护世界和平的一支重要力量。","options":["1989年4月","1990年4月","1991年4月","1992年4月"],"answer":1,"exp":"中国军队自1990年4月起参加联合国维和行动，此后在国际维和、救援、撤侨、护航中作用日益重要；其他年份都不是这一起点。"},{"id":"ch1-025","chapter":"ch1","type":"single","stem":"2011年2月22日至3月5日，中国政府分批组织中国在（　）人员安全有序撤离。这是新中国成立以来最大规模的有组织撤离海外中国公民行动。","options":["乌克兰","也门","苏丹","利比亚"],"answer":3,"exp":"2011年2月利比亚局势动荡，中国政府分批组织在利人员撤离，这是新中国成立以来最大规模的有组织撤离海外中国公民行动；其余国家背景不同。"},{"id":"ch1-026","chapter":"ch1","type":"single","stem":"（　），中国海军舰艇编队赴亚丁湾、索马里海域执行护航任务。这是中国海军首次组织海上作战力量赴海外履行国际人道主义义务、首次在远海保护重要运输线安全。","options":["2007年12月","2008年12月","2009年12月","2010年12月"],"answer":1,"exp":"2008年12月中国海军舰艇编队赴亚丁湾、索马里海域护航，首次组织海上作战力量赴海外履行国际人道主义义务、首次在远海保护重要运输线安全。"},{"id":"ch1-027","chapter":"ch1","type":"single","stem":"（　）是以坦克、步兵战车、装甲输送车为基本装备,主要遂行地面突击和两栖任务的兵种。","options":["步兵","炮兵","防空兵","装甲兵"],"answer":3,"exp":"装甲兵以坦克、步兵战车、装甲输送车为基本装备，主要遂行地面突击和两栖任务；步兵、炮兵、防空兵的装备和任务与题干描述不符。"},{"id":"ch1-028","chapter":"ch1","type":"single","stem":"新时代中国国防和军队建设的战略目标是，确保（　）年实现建军一百年奋斗目标， 到2035年基本实现国防和军队现代化，到本世纪中叶把人民军队全面建成世界一流军队。","options":["2025","2026","2027","2028"],"answer":2,"exp":"新时代国防和军队建设分三步走：确保2027年实现建军一百年奋斗目标，2035年基本实现现代化，本世纪中叶把人民军队建成世界一流军队。"},{"id":"ch1-029","chapter":"ch1","type":"single","stem":"（　）是一个国家在一定时期内指导国防行为、维护国家安全和利益的总方略、总纲领，是国防建设、军队建设的龙头和总揽。","options":["国防战略","国防政策","国防动员","国防体制"],"answer":0,"exp":"国防战略是国家指导国防行为、维护国家安全和利益的总方略、总纲领，是国防和军队建设的龙头；国防政策、动员、体制都是其下的具体范畴。"},{"id":"ch1-030","chapter":"ch1","type":"single","stem":"（　）是最高国家军事机关，负责领导全国武装力量。","options":["中华人民共和国全国人民代表大会","全国人民代表大会常务委员会","中华人民共和国国务院","中华人民共和国中央军事委员会"],"answer":3,"exp":"中央军事委员会是最高国家军事机关，负责领导全国武装力量；全国人大及其常委会是权力机关，国务院是行政机关，都不直接领导武装力量。"},{"id":"ch1-031","chapter":"ch1","type":"single","stem":"（　）是我们民族精神的核心，是中国人民和中华民族同心同德、自强不息的精神纽带。","options":["爱国主义","集体主义","人道主义","社会主义"],"answer":0,"exp":"爱国主义是民族精神的核心，是中国人民和中华民族同心同德、自强不息的精神纽带；集体主义、人道主义、社会主义各有侧重，不构成这一核心。"},{"id":"ch1-032","chapter":"ch1","type":"single","stem":"（　）是不脱离生产的群众武装组织，是中国武装力量的重要组成部分，是人民解放军的助手和后备力量。","options":["中国人民解放军现役部队","中国人民解放军预备役部队","中国人民武装警察部队","民兵"],"answer":3,"exp":"民兵是不脱离生产的群众武装组织，是武装力量的重要组成部分，也是人民解放军的助手和后备力量；预备役部队则是成建制的后备力量。"},{"id":"ch1-033","chapter":"ch1","type":"single","stem":"2024年6月25日，（　）任务取得圆满成功，实现世界首次月球背面采样返回。","options":["探月工程嫦娥四号","探月工程嫦娥五号","探月工程嫦娥六号","探月工程嫦娥七号"],"answer":2,"exp":"嫦娥六号2024年6月25日完成世界首次月球背面采样返回；嫦娥四号首次实现月背软着陆，嫦娥五号完成月面采样返回，嫦娥七号任务不同。"},{"id":"ch1-034","chapter":"ch1","type":"single","stem":"实施（　）发展战略，是构建一体化国家战略体系和能力的必然选择。","options":["科教兴国","创新驱动","军民融合","人才强国"],"answer":2,"exp":"实施军民融合发展战略，把国防和军队建设融入经济社会发展体系，是构建一体化国家战略体系和能力的必然选择；科教兴国、人才强国指向不同。"},{"id":"ch1-035","chapter":"ch1","type":"single","stem":"（　）是新时代中国国防的根本目标。","options":["坚决捍卫国家主权、安全、发展利益","坚持永不称霸、永不扩张、永不谋求势力范围","贯彻落实新时代军事战略方针","坚持走中国特色强军之路","服务构建人类命运共同体"],"answer":0,"exp":"新时代中国国防的根本目标是坚决捍卫国家主权、安全、发展利益；永不称霸是鲜明特征，军事战略方针是战略指导，强军之路是发展路径。"},{"id":"ch1-036","chapter":"ch1","type":"single","stem":"（　）是新时代中国国防的鲜明特征。","options":["坚决捍卫国家主权、安全、发展利益","坚持永不称霸、永不扩张、永不谋求势力范围","贯彻落实新时代军事战略方针","坚持走中国特色强军之路","服务构建人类命运共同体"],"answer":1,"exp":"永不称霸、永不扩张、永不谋求势力范围体现我国国防的防御性与和平性，是新时代中国国防的鲜明特征；根本目标、战略指导、发展路径另有表述。"},{"id":"ch1-037","chapter":"ch1","type":"single","stem":"（　）是新时代中国国防的战略指导。","options":["坚决捍卫国家主权、安全、发展利益","坚持永不称霸、永不扩张、永不谋求势力范围","贯彻落实新时代军事战略方针","坚持走中国特色强军之路","服务构建人类命运共同体"],"answer":2,"exp":"贯彻落实新时代军事战略方针，为国防和军队建设提供战略牵引，是新时代中国国防的战略指导；其余选项分别对应根本目标、特征、路径和世界意义。"},{"id":"ch1-038","chapter":"ch1","type":"single","stem":"（　）是新时代中国国防的发展路径。","options":["坚决捍卫国家主权、安全、发展利益","坚持永不称霸、永不扩张、永不谋求势力范围","贯彻落实新时代军事战略方针","坚持走中国特色强军之路","服务构建人类命运共同体"],"answer":3,"exp":"坚持走中国特色强军之路，回答怎样建设国防和军队的问题，是新时代中国国防的发展路径；根本目标、鲜明特征、战略指导、世界意义不能混用。"},{"id":"ch1-039","chapter":"ch1","type":"single","stem":"（　）是新时代中国国防的世界意义。","options":["坚决捍卫国家主权、安全、发展利益","坚持永不称霸、永不扩张、永不谋求势力范围","贯彻落实新时代军事战略方针","坚持走中国特色强军之路","服务构建人类命运共同体"],"answer":4,"exp":"服务构建人类命运共同体，把中国国防放在世界和平与发展大局中定位，是新时代中国国防的世界意义；其余四项属国内维度的目标、特征与路径。"},{"id":"ch1-040","chapter":"ch1","type":"single","stem":"（　）是公民最重要的一项国防义务。","options":["服兵役","接受国防教育","保护国防设施","保守国防秘密"],"answer":0,"exp":"依法服兵役是公民最重要的一项国防义务，直接关系武装力量的兵员来源；接受国防教育、保护国防设施、保守国防秘密也是义务，但重要性次于服兵役。"},{"id":"ch1-041","chapter":"ch1","type":"single","stem":"（　）是中国武装力量的主体力量。","options":["中国人民解放军","中国人民解放军现役部队","中国人民武装警察部队","民兵"],"answer":0,"exp":"中国人民解放军是中国武装力量的主体力量，由现役部队和预备役部队组成；武警部队、民兵是武装力量的重要组成部分，但不起主体作用。"},{"id":"ch1-042","chapter":"ch1","type":"single","stem":"2024年9月13日，新修订的（　）由十四届全国人大常委会第十一次会议通过，自2024年9月21日起施行。","options":["《中华人民共和国兵役法》","《中华人民共和国国防法》","《中华人民共和国国防动员法》","《中华人民共和国国防教育法》"],"answer":3,"exp":"2024年9月13日新修订的《国防教育法》通过，自9月21日起施行；兵役法、国防法、国防动员法的修订时间与题干日期不对应。"},{"id":"ch1-043","chapter":"ch1","type":"single","stem":"（　）是我国战略威慑的核心力量，是我国大国地位的战略支撑，是维护国家安全的重要基石。","options":["陆军","海军","空军","火箭军"],"answer":3,"exp":"火箭军是我国战略威慑的核心力量，是大国地位的战略支撑和国家安全的重要基石；陆海空三军各有主战领域，不承担战略威慑的核心职能。"},{"id":"ch1-044","chapter":"ch1","type":"single","stem":"（　）是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的战略支撑。","options":["推进对外开放和国际合作","全面深化改革、完善国家治理","巩固国防和强大人民军队","发展经济、科技自立自强"],"answer":2,"exp":"巩固国防和强大人民军队，为坚持和发展中国特色社会主义、实现中华民族伟大复兴提供战略支撑；对外开放、深化改革、发展经济不具这一作用。","note":"原填空题改造"},{"id":"ch1-045","chapter":"ch1","type":"single","stem":"国防的对象是（　）。","options":["侵略、武装颠覆和分裂","自然灾害和突发事件","恐怖主义和分裂势力","侵略和领土争端"],"answer":0,"exp":"国防的对象是侵略、武装颠覆和分裂；自然灾害、突发事件属于抢险救灾和应急管理，恐怖主义只是威胁之一，不能与法定对象简单等同。","note":"原填空题改造"},{"id":"ch1-046","chapter":"ch1","type":"single","stem":"（　）是国家的事业，是国家机构的基本职能、社会公民的神圣职责。","options":["国防","安全","战争","军事"],"answer":0,"exp":"国防是国家的事业，是国家机构的基本职能、社会公民的神圣职责；安全、战争、军事都不能涵盖国家机构与公民共同承担的这一定位。","note":"原填空题改造"},{"id":"ch1-047","chapter":"ch1","type":"single","stem":"（　）是国防的主要手段。","options":["外交手段","经济手段","政治手段","军事手段"],"answer":3,"exp":"军事手段是国防的主要手段，外交、经济、政治手段与之配合；后三者只起辅助作用，不能替代军事手段在国防中的主导地位。","note":"原填空题改造"},{"id":"ch1-048","chapter":"ch1","type":"single","stem":"国防的目的是保卫国家的（　）。","options":["政权、主权和领土完整","国家安全、发展利益和海外利益","主权、领土和资源","主权、统一、领土完整、安全和发展利益"],"answer":3,"exp":"国防法规定国防的目的是保卫国家主权、统一、领土完整、安全和发展利益；只提政权、资源或海外利益的选项都遗漏了法定要素。","note":"原填空题改造"},{"id":"ch1-049","chapter":"ch1","type":"single","stem":"国防的基本要素包括（　）。","options":["主体、对象、目的、手段","政治、经济、军事、外交","领土、人口、政府和军队","主体、军队、武器、财政"],"answer":0,"exp":"国防的基本要素是主体、对象、目的和手段，分别回答谁来国防、防什么、为何防、怎样防；政治经济军事外交是手段分类，不是基本要素。","note":"原填空题改造"},{"id":"ch1-050","chapter":"ch1","type":"single","stem":"中国的社会主义制度和国防政策，以及防御性的军事战略，决定了中国的国防是（　）国防。","options":["自卫型、联盟型","防御型、扩张型","防御型、独立自主型","扩张型、中立型"],"answer":2,"exp":"中国的社会主义制度、国防政策和防御性军事战略，决定了国防是防御型、独立自主型国防；联盟型、扩张型、中立型均与我国国防性质不符。","note":"原填空题改造"},{"id":"ch1-051","chapter":"ch1","type":"single","stem":"在武装力量体制上，我国古代一般区分为（　）。","options":["中央军、地方军和边防军","正规军、预备役和民兵","陆军、水军和骑兵","禁军、厢军和乡兵"],"answer":0,"exp":"古代武装力量按任务和驻防范围分为中央军、地方军和边防军三类，分别承担机动作战、地方镇守和边境防卫，其余选项属近现代体制或兵种划分。","note":"原填空题改造"},{"id":"ch1-052","chapter":"ch1","type":"single","stem":"（　）虽然推翻了清朝的统治，建立了中华民国，但并没有改变中国任人宰割的状况。","options":["辛亥革命","太平天国运动","戊戌变法","五四运动"],"answer":0,"exp":"辛亥革命推翻清王朝、结束帝制并建立中华民国，但未改变半殖民地半封建社会性质，政权随后落入北洋军阀之手，国家依然任人宰割。","note":"原填空题改造"},{"id":"ch1-053","chapter":"ch1","type":"single","stem":"（　）年7月，中国共产党成立，把中国人民的救亡图存斗争推向新阶段。","options":["1927","1949","1919","1921"],"answer":3,"exp":"1921年7月中国共产党成立，使救亡图存斗争有了先进政党领导，从此转入新民主主义革命阶段；1919年是五四运动，1927年是建军之年。","note":"原填空题改造"},{"id":"ch1-054","chapter":"ch1","type":"single","stem":"（　），日本发动七七事变，标志着日本帝国主义蓄谋已久的全面侵华战争开始。","options":["1935年12月9日","1931年9月18日","1937年7月7日","1941年12月7日"],"answer":2,"exp":"1937年7月7日卢沟桥事变即七七事变，日军由此发动全面侵华战争；1931年9月18日是局部侵华的起点，1941年12月7日则是珍珠港事件。","note":"原填空题改造"},{"id":"ch1-055","chapter":"ch1","type":"single","stem":"我国现行的国防法规体系区分为四个层次，由高到低依次是（　）。","options":["宪法、法律、法规、规章","法律、法规、条例、细则","法律、条例、条令、规章","法律、法规、规章、地方性法规"],"answer":3,"exp":"国防法规体系由法律、法规、规章、地方性法规四个层次构成，效力依次递减并逐级具体化；宪法是国防立法的根本依据，不算其中一个层次。","note":"原填空题改造"},{"id":"ch1-056","chapter":"ch1","type":"single","stem":"（　）是国家或政治集团所拥有的各种武装组织的总称。","options":["军队","军事力量","国防力量","武装力量"],"answer":3,"exp":"武装力量是国家或政治集团所拥有各种武装组织的总称，外延最宽；军队只是其中骨干，国防力量还包含非武装因素，均不能替代该定义。","note":"原填空题改造"},{"id":"ch1-057","chapter":"ch1","type":"single","stem":"根据宪法和国防法，中华人民共和国的国防领导职权由（　）行使。","options":["中共中央、全国人大及其常务委员会、国家主席、国务院、中央军委","全国人大、国家主席、国务院","中共中央、国务院、中央军委","中共中央、中央军委、国防部"],"answer":0,"exp":"宪法和国防法把国防领导职权赋予中共中央、全国人大及其常委会、国家主席、国务院和中央军委，体现党对国防的集中统一领导，五者缺一不可。","note":"原填空题改造"},{"id":"ch1-058","chapter":"ch1","type":"single","stem":"按照军委管总、战区主战、军种主建的总原则，我军的战区包括（　）。","options":["沈阳、北京、兰州、济南、南京、广州、成都战区","东部战区、南部战区、西部战区、北部战区、中部战区和战略支援部队","陆军、海军、空军、火箭军、战略支援部队","东部战区、南部战区、西部战区、北部战区、中部战区"],"answer":3,"exp":"军委管总、战区主战改革后设东部、南部、西部、北部、中部五大战区；战略支援部队属力量构成而非战区，旧七大军区称谓也已不再使用。","note":"原填空题改造"},{"id":"ch1-059","chapter":"ch1","type":"single","stem":"按照军委管总、战区主战、军种主建的总原则，我军的军种包括（　）。","options":["陆军、海军、空军、火箭军","陆军、海军、空军、火箭军、战略支援部队","陆军、海军、空军、联勤保障部队","陆军、海军、空军、战略支援部队"],"answer":0,"exp":"军种主建格局下我军军种为陆军、海军、空军、火箭军四个，战略支援部队与联勤保障部队是力量体系中的其他组成部分，不列为军种。","note":"原填空题改造"},{"id":"ch1-060","chapter":"ch1","type":"single","stem":"我国的武装力量由（　）组成。","options":["中国人民解放军、中国人民武装警察部队、民兵","现役部队、预备役部队、民兵","陆军、海军、空军","中国人民解放军、中国人民武装警察部队、预备役部队"],"answer":0,"exp":"我国武装力量由人民解放军、人民武装警察部队和民兵三结合组成；预备役部队已纳入解放军序列，不能同武警、民兵并列为三大组成部分。","note":"原填空题改造"},{"id":"ch1-061","chapter":"ch1","type":"single","stem":"抗日战争时期，主力红军和南方八省红军游击队分别改编为（　）。","options":["中国工农红军和八路军","八路军和新四军","新四军和华南抗日纵队","八路军和东北抗日联军"],"answer":1,"exp":"抗战爆发后主力红军改编为国民革命军第八路军，南方八省红军游击队改编为新四军，二者共同构成党在抗战时期领导的主力武装力量。","note":"原填空题改造"},{"id":"ch1-062","chapter":"ch1","type":"single","stem":"（　）是国家为应对战争或其他安全威胁，使社会诸领域的全部或部分由平时状态转入战时状态或紧急状态的活动。","options":["紧急状态","国防教育","战争动员","国防动员"],"answer":3,"exp":"国防动员是国家为使社会诸领域全部或部分由平时转入战时或紧急状态的活动，涵盖武装力量、经济、交通等多领域，战争动员只是其中一部分。","note":"原填空题改造"},{"id":"ch1-063","chapter":"ch1","type":"single","stem":"党的十八大以来，中国特色社会主义进入新时代，国防和军队建设也进入（　）。","options":["新阶段","新起点","新征程","新时代"],"answer":3,"exp":"党的十八大以来中国特色社会主义进入新时代，国防和军队建设也随之进入新时代，这是历史方位判断，并非新阶段、新起点一类程度较轻的表述。","note":"原填空题改造"},{"id":"ch1-064","chapter":"ch1","type":"single","stem":"中国的社会主义国家性质，走和平发展道路的战略抉择，独立自主的和平外交政策，\"和为贵\"的中华文化传统，决定了中国始终不渝奉行（　）国防政策。","options":["防御性","中立性","联盟性","进攻性"],"answer":0,"exp":"社会主义国家性质、和平发展的战略抉择、独立自主的和平外交政策与和为贵的文化传统，共同决定我国奉行防御性国防政策；中立性、联盟性、进攻性均不符。","note":"原填空题改造"},{"id":"ch1-065","chapter":"ch1","type":"single","stem":"中国人民解放军的性质是（　）。","options":["党的军队、人民的军队、社会主义国家的军队","无产阶级的军队、工农的军队、人民的军队","国家的军队、人民的军队、正规化的军队","党的军队、国家的军队、职业化的军队"],"answer":0,"exp":"我军性质概括为党的军队、人民的军队、社会主义国家的军队，三者统一体现党的领导、人民立场与国家属性，缺一不可，其他表述均不完整。","note":"原填空题改造"},{"id":"ch1-066","chapter":"ch1","type":"single","stem":"中国人民解放军的宗旨是（　）。","options":["服从党对军队的绝对领导","建设世界一流军队","保卫国家主权和领土完整","全心全意为人民服务"],"answer":3,"exp":"全心全意为人民服务是我军唯一宗旨，由人民军队性质决定；服从党的领导是根本原则，建设世界一流军队是奋斗目标，都不能与宗旨混为一谈。","note":"原填空题改造"},{"id":"ch1-067","chapter":"ch1","type":"single","stem":"坚持富国和强军的统一，必须统筹经济建设和国防建设，走出一条（　）式发展路子。","options":["军民融合","平战结合","军地分离","寓军于民"],"answer":0,"exp":"统筹经济建设和国防建设，要走军民融合式发展路子，把国防和军队建设融入经济社会发展体系；平战结合、寓军于民只是其中的具体要求。","note":"原填空题改造"},{"id":"ch1-068","chapter":"ch1","type":"single","stem":"新中国成立以来，人民军队在（　）的指引下，不断向革命化现代化正规化迈进。","options":["毛泽东军事思想、邓小平理论、\"三个代表\"重要思想、科学发展观","毛泽东军事思想、邓小平新时期军队建设思想、江泽民国防和军队建设思想","毛泽东思想、邓小平理论、\"三个代表\"重要思想、科学发展观、习近平新时代中国特色社会主义思想","毛泽东军事思想、邓小平新时期军队建设思想、江泽民国防和军队建设思想、胡锦涛国防和军队建设思想、习近平强军思想"],"answer":3,"exp":"人民军队在毛泽东军事思想、邓小平新时期军队建设思想、江泽民国防和军队建设思想、胡锦涛国防和军队建设思想、习近平强军思想指引下不断迈进。","note":"原填空题改造"},{"id":"ch1-069","chapter":"ch1","type":"single","stem":"（　），是党矢志不渝的历史任务，是全体中华儿女的共同愿望，是实现中华民族伟大复兴的必然要求。","options":["解决台湾问题、实现国家完全统一","维护国家主权、反对分裂势力","推进祖国和平统一、加强两岸交流","坚持一个中国原则、反对\"台独\""],"answer":0,"exp":"解决台湾问题、实现国家完全统一是党矢志不渝的历史任务和民族复兴的必然要求；一个中国原则、反对台独是其中的原则立场，层次低于这一目标。","note":"原填空题改造"},{"id":"ch1-070","chapter":"ch1","type":"single","stem":"中国人民抗日战争胜利是以（　）为核心的民族精神的伟大胜利。","options":["爱国主义","集体主义","英雄主义","民族团结"],"answer":0,"exp":"抗日战争胜利是以爱国主义为核心的民族精神的伟大胜利，爱国情怀凝聚起全民族抗战力量；集体主义、英雄主义、民族团结是具体体现而非核心。","note":"原填空题改造"},{"id":"ch1-071","chapter":"ch1","type":"single","stem":"国防动员的对象是一切能够为战争服务的（　）。","options":["人员、装备、物资","军队、警察、民兵","人力、物力、科技","人力、物力、财力"],"answer":3,"exp":"国防动员的对象是一切能为战争服务的人力、物力、财力，即人力动员、物力动员和财力动员；人员装备物资的表述偏窄，未涵盖财力。","note":"原填空题改造"},{"id":"ch1-072","chapter":"ch1","type":"single","stem":"中国人民解放军由（　）组成。","options":["现役部队和预备役部队","战斗部队和保障部队","正规部队和民兵","陆军、海军、空军和火箭军"],"answer":0,"exp":"中国人民解放军由现役部队和预备役部队组成，预备役部队已正式纳入解放军建制序列；武警、民兵属于武装力量组成部分，但不属于解放军。","note":"原填空题改造"},{"id":"ch1-073","chapter":"ch1","type":"single","stem":"中国近代国防史既是一部（　）史。","options":["反抗、斗争、胜利","屈辱、探索、抗争","探索、改革、崛起","屈辱、失败、妥协"],"answer":1,"exp":"中国近代国防史是屈辱、探索、抗争交织的历史：屡遭侵略是屈辱，寻求救亡是探索，奋起反抗是抗争，只讲失败妥协或只讲胜利都不全面。","note":"原填空题改造"},{"id":"ch1-074","chapter":"ch1","type":"single","stem":"（　）是我党我军一贯坚持的军事战略方针，是我们战胜国内外一个又一个强大敌人的法宝。","options":["诱敌深入","人民战争","积极防御","运动战"],"answer":2,"exp":"积极防御是我党我军一贯坚持的军事战略方针，强调战略上防御与战役战斗上进攻相统一；诱敌深入、运动战只是贯彻该方针的具体战法。","note":"原填空题改造"},{"id":"ch1-075","chapter":"ch1","type":"single","stem":"《中华人民共和国兵役法》规定我国实行以（　）为主体的志愿兵役与义务兵役相结合的兵役制度。","options":["义务兵役","志愿兵役","预备役","合同兵役"],"answer":1,"exp":"现行兵役法规定实行以志愿兵役为主体的志愿兵役与义务兵役相结合的兵役制度，义务兵役仍然保留，但已不再居于主体地位。","note":"原填空题改造"},{"id":"ch1-076","chapter":"ch1","type":"multi","stem":"中国古代的兵役制度主要有（　）等形式。","options":["民军制","征兵制","府兵制","募兵制"],"answer":[0,1,2,3],"exp":"中国古代兵役制度主要有民军制、征兵制、府兵制和募兵制等形态，随生产力水平和战争形态演进而更替，四个选项均属其中。"},{"id":"ch1-077","chapter":"ch1","type":"multi","stem":"国防的目的是（　）。","options":["捍卫国家主权","维护国家统一","保卫国家领土完整","确保国家安全","保障国家发展利益"],"answer":[0,1,2,3,4],"exp":"国防的目的包括捍卫国家主权、维护国家统一、保卫领土完整、确保国家安全和保障发展利益五个方面，共同构成完整的国防目标体系。"},{"id":"ch1-078","chapter":"ch1","type":"multi","stem":"根据《中华人民共和国国防法》的规定，公民负有（　）等方面的国防义务。","options":["服兵役","接受国防教育","保护国防设施","保守国防秘密","支持和协助国防活动"],"answer":[0,1,2,3,4],"exp":"国防法规定公民负有服兵役、接受国防教育、保护国防设施、保守国防秘密、支持和协助国防活动等义务，五项均属公民国防义务。"},{"id":"ch1-079","chapter":"ch1","type":"multi","stem":"中华人民共和国武装力量由（　）组成。","options":["中国人民解放军现役部队","中国人民解放军预备役部队","中国人民武装警察部队","民兵"],"answer":[0,1,2,3],"exp":"武装力量由解放军现役部队、预备役部队、武警部队和民兵四部分构成；现役与预备役同属解放军，但在这里分列，四项须全选。"},{"id":"ch1-080","chapter":"ch1","type":"multi","stem":"按军事战略和国防建设的目标，国防可分为（　）。","options":["中立型国防","防御型国防","自卫型国防","扩张型国防"],"answer":[1,3],"exp":"按军事战略和国防建设目标，国防分为防御型与扩张型两类；中立型、独立自主型、联盟型是按防卫力量运用方式划分的另一组类型。"},{"id":"ch1-081","chapter":"ch1","type":"multi","stem":"按防卫力量的运用方式，国防可分为（　）。","options":["中立型国防","独立自主型国防","联盟型国防","扩张型国防"],"answer":[0,1,2],"exp":"按防卫力量运用方式，国防分为中立型、独立自主型和联盟型；扩张型属于按国防目标划分的类型，不能混入本组，注意两组标准不同。"},{"id":"ch1-082","chapter":"ch1","type":"multi","stem":"根据《兵役法》的规定，公民履行兵役义务主要形式有（　）。","options":["服现役","服预备役","参加军事训练","参加军事夏令营"],"answer":[0,1],"exp":"兵役法规定的兵役义务履行形式是服现役和服预备役；参加军事训练是预备役人员的内容，军事夏令营属国防教育活动，不是法定兵役形式。"},{"id":"ch1-083","chapter":"ch1","type":"multi","stem":"中华人民共和国成立以来，人民军队在（　）的指引下，不断向革命化现代化正规化迈进。","options":["毛泽东军事思想","邓小平新时期军队建设思想","江泽民国防和军队建设思想","胡锦涛国防和军队建设思想","习近平强军思想"],"answer":[0,1,2,3,4],"exp":"从毛泽东军事思想到习近平强军思想，五个理论成果一脉相承，共同构成人民军队革命化现代化正规化建设的科学指南，五项须全选。"},{"id":"ch1-084","chapter":"ch1","type":"multi","stem":"我国新时代军事战略方针，主要包括（　）。","options":["坚持防御、自卫、后发制人原则","实行积极防御","坚持“人不犯我、我不犯人，人若犯我、我必犯人”","强调遏制战争与打赢战争相统一","强调战略上防御与战役战斗上进攻相统一"],"answer":[0,1,2,3,4],"exp":"新时代军事战略方针包含防御自卫后发制人、实行积极防御、人不犯我我不犯人、遏制战争与打赢战争相统一、战略防御与战役战斗进攻相统一等内容。"},{"id":"ch1-085","chapter":"ch1","type":"multi","stem":"（　）决定了中国始终不渝奉行防御性国防政策。","options":["中国的社会主义国家性质","走和平发展道路的战略抉择","独立自主的和平外交政策","“和为贵”的中华文化传统"],"answer":[0,1,2,3],"exp":"社会主义国家性质、走和平发展道路的战略抉择、独立自主的和平外交政策、和为贵的中华文化传统，四者共同决定我国奉行防御性国防政策。"},{"id":"ch1-086","chapter":"ch1","type":"multi","stem":"中国人民解放军作为中国武装力量的主体力量,新时代的使命任务主要包括（　）。","options":["为巩固中国共产党领导和社会主义制度提供战略支撑","为捍卫国家主权、统一、领土完整提供战略支撑","为维护国家海外利益提供战略支撑","为促进世界和平与发展提供战略支撑"],"answer":[0,1,2,3],"exp":"新时代使命任务即四个战略支撑，分别指向党的领导和社会主义制度、国家主权统一领土完整、国家海外利益、世界和平与发展，四项全选。"},{"id":"ch1-087","chapter":"ch1","type":"multi","stem":"在纵向关系上,依据宪法规定和立法权力及立法原则,我国现行的国防法规体系可分为（　）等几个层次。","options":["法律","法规","规章","地方性法规"],"answer":[0,1,2,3],"exp":"依据立法权限与效力高低，国防法规纵向分为法律、法规、规章、地方性法规四个层次，逐级具体化，四个选项均属该体系层次。"},{"id":"ch1-088","chapter":"ch1","type":"judge","stem":"防止武装侵略和非武装侵略，是国防的首要任务。","options":["正确","错误"],"answer":0,"exp":"正确。国防的首要任务是防止武装侵略和非武装侵略，既包括抵御军事入侵，也包括防范渗透、颠覆、破坏等非军事方式的威胁。"},{"id":"ch1-089","chapter":"ch1","type":"judge","stem":"军事手段是国防的唯一手段。","options":["正确","错误"],"answer":1,"exp":"错误。国防手段包括军事、政治、经济、外交、科技、心理等多种手段，军事手段是核心和最后手段，但并非唯一手段，表述过于绝对。"},{"id":"ch1-090","chapter":"ch1","type":"judge","stem":"国家的社会制度不同，奉行的国防政策和追求的国防目标不同，国防的类型也就各不相同。","options":["正确","错误"],"answer":0,"exp":"正确。国家社会制度不同，奉行的国防政策与追求的国防目标随之不同，据此划分的国防类型也各不相同，这正是国防阶级性的体现。"},{"id":"ch1-091","chapter":"ch1","type":"judge","stem":"公民和组织在国防活动中享有的经济损失补偿，与其在民事活动中享有的损害赔偿是相同的。","options":["正确","错误"],"answer":1,"exp":"错误。国防活动中的经济损失补偿源于国防公共利益和依法征用，遵循适当补偿原则，与民事侵权损害赔偿的归责依据和范围不同，二者不能等同。"},{"id":"ch1-092","chapter":"ch1","type":"judge","stem":"中国共产党是领导包括国防事务在内的中国特色社会主义事业的核心力量。","options":["正确","错误"],"answer":0,"exp":"正确。中国共产党是领导包括国防事务在内的中国特色社会主义事业的核心力量，党对军队的绝对领导是国防和军队建设的根本原则。"},{"id":"ch1-093","chapter":"ch1","type":"judge","stem":"中国人民解放军预备役部队是人民解放军的组成部分,是寓军于民、快速动员的有效组织形式,是现役部队的有效补充,与现役部队一体建设运用,共同履行人民军队使命任务。","options":["正确","错误"],"answer":0,"exp":"正确。预备役部队是解放军组成部分，是寓军于民、快速动员的有效组织形式和现役部队的有效补充，与现役部队一体建设运用。"},{"id":"ch1-094","chapter":"ch1","type":"judge","stem":"一个国家实行什么样的国防是由这个国家的社会制度和国家政策所决定的。","options":["正确","错误"],"answer":0,"exp":"正确。一个国家实行什么样的国防，由其社会制度和国家政策决定，制度性质与政策取向直接塑造国防的类型、目标和基本样式。"},{"id":"ch1-095","chapter":"ch1","type":"judge","stem":"国防政策有其鲜明的阶级性，不同的国家有不同的国防政策。","options":["正确","错误"],"answer":0,"exp":"正确。国防政策体现统治阶级的意志，具有鲜明的阶级性，不同社会制度和国家利益的国家会制定各不相同的国防政策。"},{"id":"ch1-096","chapter":"ch1","type":"judge","stem":"后勤建设是军民融合发展的重点，也是衡量军民融合发展水平的重要标志。","options":["正确","错误"],"answer":1,"exp":"错误。军民融合涵盖科技、产业、基础设施、人才培养等多个领域，后勤建设只是其中一个方面，称其为重点和重要标志夸大了定位。"},{"id":"ch1-097","chapter":"ch1","type":"judge","stem":"国防的目的主要是保卫国家主权、统一、领土完整、安全和发展利益。","options":["正确","错误"],"answer":0,"exp":"正确。国防的目的主要是保卫国家主权、统一、领土完整、安全和发展利益，与国防法关于国防目的的表述完全一致。"},{"id":"ch1-098","chapter":"ch1","type":"judge","stem":"国防活动中，权利和义务的一致性并不直观，甚至在一定范围或一定层次上表现为不对等、不平等。","options":["正确","错误"],"answer":0,"exp":"正确。国防活动中的权利与义务并非一一对应，公民承担国防义务往往先于、重于享有的权利，在一定范围和层次上表现为不对等。"},{"id":"ch1-099","chapter":"ch1","type":"judge","stem":"在人的动员中，武装力量动员是核心，并且是全部战争动员活动的重点。","options":["正确","错误"],"answer":0,"exp":"正确。人的动员中以武装力量动员为核心，它直接形成作战能力，是全部战争动员活动的重点，其他各项动员都围绕它展开。"},{"id":"ch1-100","chapter":"ch1","type":"judge","stem":"民兵在国务院、中央军委统一领导下，实行地方党委、政府和军事系统的双重领导。","options":["正确","错误"],"answer":0,"exp":"正确。民兵在国务院、中央军委统一领导下，实行地方党委、政府和军事系统的双重领导，这是我国民兵领导体制的既定原则。"},{"id":"ch1-101","chapter":"ch1","type":"judge","stem":"中国是联合国第二大维和摊款国和安理会常任理事国中第一大维和出兵国。","options":["正确","错误"],"answer":0,"exp":"中国承担的联合国维和摊款居第二位，在安理会常任理事国中派兵最多，故该表述与实际相符。"},{"id":"ch1-102","chapter":"ch1","type":"judge","stem":"我国在坚持积极防御战略的同时，还应当根据国际国内形势的发展变化适时赋予其新的内涵。","options":["正确","错误"],"answer":0,"exp":"积极防御战略的内涵随形势发展而不断丰富，坚持后发制人、防御中寓有进攻，故应适时赋予新内容。"},{"id":"ch1-103","chapter":"ch1","type":"judge","stem":"中外各国在“上海合作组织”框架内进行的军事活动，并不具有结盟性或依附性，属于一种平等主体间的国际军事合作。","options":["正确","错误"],"answer":0,"exp":"上海合作组织奉行不结盟、不对抗、不针对第三方原则，其框架内军事合作属平等主体间的安全合作。"},{"id":"ch1-104","chapter":"ch1","type":"judge","stem":"国防法规体系各个层次表征着国防法律规范之间的横向关系，不同门类表征着国防法律规范之间的纵向关系。","options":["正确","错误"],"answer":1,"exp":"题干颠倒了两者关系：层次表征纵向的效力等级关系，门类才表征横向的规范分类，故表述错误。"},{"id":"ch1-105","chapter":"ch1","type":"judge","stem":"中国共产党人勇敢战斗在抗日战争最前线，支撑起中华民族救亡图存的希望，成为全民族抗战的中流砥柱。","options":["正确","错误"],"answer":0,"exp":"中国共产党领导的抗日武装深入敌后、浴血奋战，成为全民族抗战的中流砥柱，该表述符合历史事实。"},{"id":"ch1-106","chapter":"ch1","type":"judge","stem":"网信军民融合是军民融合的重点领域和前沿领域，也是军民融合最具活力和潜力的领域。","options":["正确","错误"],"answer":0,"exp":"网信领域技术迭代快、军民通用性强，既是军民融合的重点与前沿，也是最具活力和潜力的领域。"},{"id":"ch1-107","chapter":"ch1","type":"judge","stem":"1931年9月18日，日本帝国主义悍然制造九一八事变，开始了对中国的侵略战争。中国人民奋勇抵抗，揭开了世界反法西斯战争的序幕。","options":["正确","错误"],"answer":0,"exp":"九一八事变后中国人民率先奋起抵抗，比欧洲战场更早展开反法西斯斗争，故说揭开了序幕。"},{"id":"ch3-001","chapter":"ch3","type":"single","stem":"《战争论》的作者是 （　）","options":["克劳塞维茨","拿破仑","斯大林","艾森豪威尔"],"answer":0,"exp":"《战争论》是克劳塞维茨的代表作，被誉为西方近代军事理论的奠基之作；其余人物均无此书。"},{"id":"ch3-002","chapter":"ch3","type":"single","stem":"英国地缘政治学家（　）提出“大陆心脏”说和“世界岛”理论。","options":["麦金德","马汉","施利芬","富勒"],"answer":0,"exp":"麦金德提出大陆心脏说与世界岛理论；马汉倡海权论，施利芬主歼灭战，富勒倡机械化战争论。"},{"id":"ch3-003","chapter":"ch3","type":"single","stem":"（　）根据国际形势的发展,正确指出和平与发展是当今时代的主题,战争的威胁依然存在,但推迟或制止世界战争的爆发已成为可能。","options":["毛泽东","邓小平","江泽民","胡锦涛"],"answer":1,"exp":"邓小平依据国际形势变化，判断和平与发展成为时代主题、世界大战可以推迟或避免，故所指为邓小平。"},{"id":"ch3-004","chapter":"ch3","type":"single","stem":"（　）提出“内修文德，外治武备” 的战略思想。","options":["孙子","吴子","墨子","戚继光"],"answer":1,"exp":"内修文德、外治武备出自《吴子》，强调对内修明政治、对外加强战备，与孙子重战慎战思想有别。"},{"id":"ch3-005","chapter":"ch3","type":"single","stem":"推进中国特色的军事变革，是一场深刻的革命，是实现军队建设总目标，解决好（　）两个历史性课题的必由之路。","options":["和平与发展","人和物","打得赢，不变质","科技与人才"],"answer":2,"exp":"打得赢、不变质是军队建设要解决的两个历史性课题，推进中国特色军事变革正是破解这两大课题的必由之路。"},{"id":"ch3-006","chapter":"ch3","type":"single","stem":"习近平强军思想贯穿的鲜明主题是（　）。","options":["听党指挥","强军兴军","能打胜仗","作风优良"],"answer":1,"exp":"习近平强军思想以强军兴军为鲜明主题，听党指挥、能打胜仗、作风优良则是强军目标的具体要求。"},{"id":"ch3-007","chapter":"ch3","type":"single","stem":"（　）是毛泽东军事思想的核心。","options":["人民战争思想","积极防御","运动战","游击战"],"answer":0,"exp":"人民战争思想是毛泽东军事思想的核心，回答依靠谁进行战争、怎样进行战争的根本问题，其余为具体战法。"},{"id":"ch3-008","chapter":"ch3","type":"single","stem":"“财不盖天下，不能正天下”说的是（　）问题。","options":["战争起因","战争性质","战争与政治的关系","战争与经济的关系"],"answer":3,"exp":"财不盖天下、不能正天下强调财力不足难以支撑战争，反映战争对经济基础的依赖，属战争与经济的关系。"},{"id":"ch3-009","chapter":"ch3","type":"single","stem":"（　）是世界上现存最早的系统的军事理论著作,标志着中国古代军事思想的成熟。","options":["《吴子兵法》","《孙膑兵法》","《孙子兵法》","《司马法》"],"answer":2,"exp":"《孙子兵法》是世界现存最早的系统军事理论著作，标志中国古代军事思想成熟，早于《吴子》《孙膑兵法》。"},{"id":"ch3-010","chapter":"ch3","type":"single","stem":"（　）深刻揭示了战争的目的和本质，它是一切战争行动的根据。","options":["依靠人民群众进行战争","不打无准备之仗","保存自己，消灭敌人","先打分散孤立之敌，后打集中强大之敌"],"answer":2,"exp":"保存自己、消灭敌人是战争的目的和本质，是一切战争行动的根据，其余选项属于作战原则或方法。"},{"id":"ch3-011","chapter":"ch3","type":"single","stem":"（　）是第一资源，是推动我军高质量发展、赢得军事竞争和未来战争主动的关键因素。","options":["装备","人才","科技","改革"],"answer":1,"exp":"人才是第一资源，是推动军队高质量发展、赢得军事竞争和未来战争主动的关键，装备、科技、改革均为支撑条件。"},{"id":"ch3-012","chapter":"ch3","type":"single","stem":"控制、调动敌人而不被敌人所控制和调动是指古人说的（　）。","options":["全胜","先胜","致人","任势"],"answer":2,"exp":"致人即调动敌人而不被敌人调动，出自《孙子兵法》致人而不致于人，讲的是争夺战争主动权。"},{"id":"ch3-013","chapter":"ch3","type":"single","stem":"吴子治军思想的核心是（　）。","options":["内修文德","外治武备","以治为胜","教成三军"],"answer":2,"exp":"吴子治军以以治为胜为核心，强调严明法令、训练有素；内修文德、外治武备则是其治国治军的总方针。"},{"id":"ch3-014","chapter":"ch3","type":"single","stem":"（　）是强军的必由之路，必须推进军队组织形态现代化，构建中国特色现代军事力量体系，完善中国特色社会主义军事制度。","options":["改革","备战","创新","实践"],"answer":0,"exp":"改革是强军的必由之路，通过推进组织形态现代化、构建现代军事力量体系，为强军提供制度保障。"},{"id":"ch3-015","chapter":"ch3","type":"single","stem":"（　）敏锐洞察、准确把握世界新军事革命发展趋势和我国军事安全态势,高瞻远瞩地提出要积极推进中国特色的军事变革。","options":["毛泽东","邓小平","江泽民","胡锦涛"],"answer":2,"exp":"江泽民准确把握世界新军事革命发展趋势，提出积极推进中国特色军事变革，故题干所指为江泽民。"},{"id":"ch3-016","chapter":"ch3","type":"single","stem":"“不战而屈人之兵”的“全胜”思想见于《孙子兵法》的（　）。","options":["《计篇》","《作战篇》","《势篇》","《谋攻篇》"],"answer":3,"exp":"不战而屈人之兵出自《谋攻篇》，该篇提出上兵伐谋、其次伐交，是全胜思想最集中的体现。"},{"id":"ch3-017","chapter":"ch3","type":"single","stem":"“兵民是胜利之本”属于毛泽东军事思想的（　）部分。","options":["人民军队思想","人民战争思想","人民战争的战略战术思想","国防建设思想"],"answer":1,"exp":"兵民是胜利之本强调战争伟力最深厚的根源存在于民众之中，属于人民战争思想，而非人民军队思想。"},{"id":"ch3-018","chapter":"ch3","type":"single","stem":"“战略上藐视敌人,战术上重视敌人”属于毛泽东军事思想的（　）部分。","options":["人民军队思想","人民战争思想","人民战争的战略战术思想","国防建设思想"],"answer":2,"exp":"战略上藐视敌人、战术上重视敌人是指导战争的策略原则，属于人民战争的战略战术思想部分。"},{"id":"ch3-019","chapter":"ch3","type":"single","stem":"意大利军事理论家（　）等人提出制空权理论,强调空中力量在现代战争中有决定性作用,主张建立并优先发展独立的空军。","options":["杜黑","鲁登道夫","富勒","利德尔·哈特"],"answer":0,"exp":"意大利军事理论家杜黑提出制空权理论，主张建立独立空军；鲁登道夫主总体战，富勒主机械化战争。"},{"id":"ch3-020","chapter":"ch3","type":"single","stem":"我国有史可查的最早的兵书是（　）。","options":["《孙子兵法》","《军志》","《吴子兵法》","《司马法》"],"answer":1,"exp":"《军志》是我国有史可查的最早兵书，早于《孙子兵法》，原书已佚，佚文散见于先秦典籍。"},{"id":"ch3-021","chapter":"ch3","type":"single","stem":"（　）时期，是中国古代军事思想的成熟期。","options":["西周","春秋战国","秦朝","唐朝"],"answer":1,"exp":"春秋战国社会大变革、战争频繁，兵家著述纷呈且《孙子兵法》问世，标志中国古代军事思想走向成熟。"},{"id":"ch3-022","chapter":"ch3","type":"single","stem":"（　）的全胜思想是中国古代军事思想中的重要战略战术原则，极具中国特色。","options":["知己知彼，百战不殆","兵者，诡道也","不战而屈人之兵","致人而不致于人"],"answer":2,"exp":"不战而屈人之兵主张以谋略使敌屈服而不必交战，是全胜思想的典型表述，知己知彼等则属知胜原则。"},{"id":"ch3-023","chapter":"ch3","type":"single","stem":"（　）的创立，是人类军事思想发展史上一次划时代的伟大革命。","options":["奴隶主阶级军事理论","封建地主阶级军事理论","资产阶级军事理论","马克思主义军事理论"],"answer":3,"exp":"马克思、恩格斯创立马克思主义军事理论，以唯物史观揭示战争本质与规律，是军事思想史上的划时代革命。"},{"id":"ch3-024","chapter":"ch3","type":"single","stem":"美国（　）提出，谁控制了海洋谁就能控制世界，为此必须大力发展海上力量。","options":["杜黑","马汉","利德尔·哈特","鲁登道夫"],"answer":1,"exp":"美国马汉提出海权论，认为控制海洋即可控制世界，须大力发展海上力量；杜黑主制空权，富勒主机械化战争。"},{"id":"ch3-025","chapter":"ch3","type":"single","stem":"德国军事家鲁登道夫提出（　）,强调国家生活的各个方面在平时就要服从战争准备的需要,主张动员国家一切力量、使用一切手段进行战争。","options":["机械化战争理论","制空权理论","总体战理论","间接路线战略理论"],"answer":2,"exp":"鲁登道夫提出总体战理论，主张平时即按战争需要动员国家一切力量与手段，区别于制空权和机械化战争理论。"},{"id":"ch3-026","chapter":"ch3","type":"single","stem":"英国军事理论家（　）等人提出机械化战争论。","options":["富勒","鲁登道夫","利德尔·哈特","杜黑"],"answer":0,"exp":"英国富勒等人提出机械化战争论，强调坦克与机械化部队的决定作用；鲁登道夫主总体战，杜黑主制空权。"},{"id":"ch3-027","chapter":"ch3","type":"single","stem":"《左传·僖公二十八年》中“师直为壮,曲为老”说的是（　）问题。","options":["战争起因","战争性质","战争与政治的关系","战争与经济的关系"],"answer":1,"exp":"师直为壮、曲为老意为正义之师士气旺盛、非正义之师士气衰落，说的是战争性质对士气的影响。"},{"id":"ch3-028","chapter":"ch3","type":"single","stem":"《淮南子·兵略训》中“兵之胜败,本在于政”思想,强调了（　）。","options":["战争起因","战争性质","战争与政治的关系","战争与经济的关系"],"answer":2,"exp":"兵之胜败、本在于政强调政治是战争胜负的根本，说明战争与政治的关系，与战争起因、性质问题不同。"},{"id":"ch3-029","chapter":"ch3","type":"single","stem":"（　）思想强调先塑造制胜优势,再与敌交战。","options":["全胜","致人","先胜","任势"],"answer":2,"exp":"先胜指先创造不被敌人战胜的条件、形成制胜态势再寻求交战，即先为不可胜以待敌之可胜。"},{"id":"ch3-030","chapter":"ch3","type":"single","stem":"（　）就是运用军事力量,因势施谋,借势成事,最终达到高效益地取胜目的。","options":["奇正","致人","虚实","任势"],"answer":3,"exp":"任势指善于造势、借势，因势施谋以较小代价高效取胜，与奇正、虚实、致人同属用兵范畴但侧重不同。"},{"id":"ch3-031","chapter":"ch3","type":"single","stem":"（　）最早提出了“避实而击虚”的思想,经历代兵家的继承发扬,成为古代兵学的重要内容之一。","options":["孙子","吴子","墨子","戚继光"],"answer":0,"exp":"避实而击虚最早由孙子提出，主张避开敌人强点、攻击其虚弱环节，后成为古代兵学的重要原则。"},{"id":"ch3-032","chapter":"ch3","type":"single","stem":"（　）就是战斗力，一支强大的军队必须有科学理论作指导。","options":["科学的军事理论","严格的军事训练","先进的武器装备","严明的纪律作风"],"answer":0,"exp":"科学的军事理论本身即是战斗力，能为军队建设与作战提供指导，故说强大军队必须有科学理论作指导。","note":"原填空题改造"},{"id":"ch3-033","chapter":"ch3","type":"single","stem":"北宋朝廷将《孙子兵法》《吴子兵法》《司马法》《六韬》《尉缭子》《三略》和《李卫公问对》7部兵书汇编为（　），并官定为武学教材，标志着中国古代军事思想体系的完善。","options":["《武经七书》","《孙子兵法》","《武经总要》","《三十六计》"],"answer":0,"exp":"北宋将《孙子》《吴子》等七部兵书汇编为《武经七书》并定为武学教材，标志古代军事思想体系完善。","note":"原填空题改造"},{"id":"ch3-034","chapter":"ch3","type":"single","stem":"先进的（　），是战争的重要制胜因素。","options":["武器装备","战略战术","军事思想","军事技术"],"answer":2,"exp":"先进的军事思想能为战争提供科学指导，是重要制胜因素；武器装备、战略战术、军事技术均不能替代其作用。","note":"原填空题改造"},{"id":"ch3-035","chapter":"ch3","type":"single","stem":"我国有史可查的最早的兵书（　）大约出现于西周，距今已有3000多年。","options":["《孙子兵法》","《军志》","《司马法》","《六韬》"],"answer":1,"exp":"《军志》大约出现于西周，是我国有史可查最早的兵书，距今三千余年，而非春秋末期的《孙子兵法》。","note":"原填空题改造"},{"id":"ch3-036","chapter":"ch3","type":"single","stem":"早在先秦时期，兵家就把（　）作为思考战争问题的逻辑起点。","options":["止戈为武","以战止战","不战而屈人之兵","知彼知己"],"answer":0,"exp":"止戈为武意为武力的根本目的在于止息干戈，先秦兵家以此作为思考战争问题的逻辑起点。","note":"原填空题改造"},{"id":"ch3-037","chapter":"ch3","type":"single","stem":"孙子提出的（　）的战争指导规律，就普适于政治、外交、经济乃至体育竞赛等多个领域。","options":["兵贵胜，不贵久","出其不意，攻其不备","知彼知己，百战不殆","致人而不致于人"],"answer":2,"exp":"知彼知己、百战不殆揭示了解信息与作决策的普遍规律，故可推广于政治、外交、经济乃至体育竞赛等领域。","note":"原填空题改造"},{"id":"ch3-038","chapter":"ch3","type":"single","stem":"军事思想具有（　）等基本特征。","options":["科学性、革命性、实践性","实践性、继承性、创新性","阶级性、民族性、时代性","阶级性、实践性、时代性、继承性和超前性"],"answer":3,"exp":"军事思想的基本特征包括阶级性、实践性、时代性、继承性和超前性，其余选项均遗漏或误列了特征。","note":"原填空题改造"},{"id":"ch3-039","chapter":"ch3","type":"single","stem":"（　）的问世，标志着外国近代资产阶级军事思想体系的基本确立。","options":["《海权论》和《制空权》","《孙子兵法》和《战争论》","《战争论》和《战争艺术概论》","《战争艺术概论》和《机械化战争论》"],"answer":2,"exp":"克劳塞维茨《战争论》与若米尼《战争艺术概论》的问世，标志外国近代资产阶级军事思想体系基本确立。","note":"原填空题改造"},{"id":"ch3-040","chapter":"ch3","type":"single","stem":"胡锦涛关于（　）历史使命的新概括，反映了中华民族伟大复兴征程的客观要求。","options":["\"三个确保\"","\"四个战略支撑\"","\"三步走\"","\"三个提供、一个发挥\""],"answer":3,"exp":"胡锦涛将我军历史使命概括为三个提供、一个发挥，反映了中华民族伟大复兴对军队职能的客观要求。","note":"原填空题改造"},{"id":"ch3-041","chapter":"ch3","type":"single","stem":"杜黑系统地提出了（　）理论，深刻影响了世界现代军事思想的发展及战争实践。","options":["制海权","信息战","制陆权","制空权"],"answer":3,"exp":"杜黑系统提出制空权理论，认为空中力量具有决定性作用并主张建立独立空军，深刻影响现代军事思想。","note":"原填空题改造"},{"id":"ch3-042","chapter":"ch3","type":"single","stem":"孙子提出的（　）的全胜思想是中国古代军事思想中的重要战略战术原则，极具中国特色。","options":["不战而屈人之兵","以战止战","先胜后战","上兵伐谋"],"answer":0,"exp":"不战而屈人之兵是孙子全胜思想的集中表述，上兵伐谋则是实现全胜的途径之一，二者层次不同。","note":"原填空题改造"},{"id":"ch3-043","chapter":"ch3","type":"single","stem":"《孙子兵法》提出了（　）的千古名言，意思是能控制、调动敌人而不被敌人所控制和调动，讲的是关于战争的主动权问题。","options":["致人而不致于人","避实而击虚","兵者，诡道也","知彼知己，百战不殆"],"answer":0,"exp":"致人而不致于人说能调动敌人而不被敌人调动，讲的是战争主动权，与避实击虚侧重用兵方向不同。","note":"原填空题改造"},{"id":"ch3-044","chapter":"ch3","type":"single","stem":"（　）是明代著名军事家、抗倭名将戚继光在东南沿海平倭战争期间练兵和治军经验的总结，有十八卷本和十四卷本传世。","options":["《武备志》","《武经七书》","《纪效新书》","《练兵实纪》"],"answer":2,"exp":"《纪效新书》总结戚继光在东南沿海抗倭时的练兵治军经验；《练兵实纪》是他后来镇守蓟北所著，《武备志》为茅元仪所编，注意区分。","note":"原填空题改造"},{"id":"ch3-045","chapter":"ch3","type":"single","stem":"塑造制胜条件，古人认为可以从（　）三个方面入手。","options":["道、天、地","知、积形、庙算","兵、食、信","谋、交、兵"],"answer":1,"exp":"知指掌握敌我情况，积形指积累有利态势与实力，庙算指战前谋划，三者都是塑造制胜条件的途径，与道天地将法这五事不同。","note":"原填空题改造"},{"id":"ch3-046","chapter":"ch3","type":"single","stem":"《孙子兵法》提出了（　）五个战争取胜因素。","options":["智、信、仁、勇、严","道、天、地、将、法","天、地、人、时、势","兵、食、信、谋、势"],"answer":1,"exp":"孙子以道、天、地、将、法为五事：道为政治民心，天为天时，地为地利，将为将帅，法为编制法规；智信仁勇严则是将帅五德。","note":"原填空题改造"},{"id":"ch3-047","chapter":"ch3","type":"single","stem":"《孙子兵法》提出了（　）五项将帅素质指标。","options":["道、天、地、将、法","德、才、识、学、体","智、信、仁、勇、严","忠、勇、智、严、信"],"answer":2,"exp":"智、信、仁、勇、严是孙子提出的将帅五项素质，即智谋、赏罚有信、爱兵、勇敢、严明；道天地将法是战争取胜因素，切勿对调。","note":"原填空题改造"},{"id":"ch3-048","chapter":"ch3","type":"single","stem":"克劳塞维茨的（　）是外国军事思想的杰出代表，被誉为西方的《孙子兵法》。","options":["《战争论》","《海权论》","《制空权》","《战争艺术概论》"],"answer":0,"exp":"克劳塞维茨《战争论》系统论述战争本质与作战原则，被誉为西方《孙子兵法》；《海权论》属马汉，《制空权》属杜黑。","note":"原填空题改造"},{"id":"ch3-049","chapter":"ch3","type":"single","stem":"（　）的诞生，是人类军事思想发展史上一次划时代的伟大革命。","options":["毛泽东军事思想","机械化战争理论","马克思主义军事理论","《战争论》"],"answer":2,"exp":"马克思主义军事理论以唯物史观和辩证法研究战争，揭示战争本质与规律，是人类军事思想史上划时代的革命，此前理论未达到这一高度。","note":"原填空题改造"},{"id":"ch3-050","chapter":"ch3","type":"single","stem":"林则徐、魏源等有识之士提出的（　）主张，标志着变革传统军事思想的开端。","options":["师夷长技以制夷","中学为体、西学为用","自强求富","变法维新"],"answer":0,"exp":"林则徐、魏源提出师夷长技以制夷，主张学西方技术以御侵略；中学为体西学为用属洋务派，自强求富是洋务口号，变法维新属维新派。","note":"原填空题改造"},{"id":"ch3-051","chapter":"ch3","type":"single","stem":"美国的（　）提出，谁控制了海洋谁就能控制世界，为此必须大力发展海上力量。","options":["马汉","杜黑","富勒","米切尔"],"answer":0,"exp":"马汉提出海权论，认为控制海洋就能控制世界，必须大力发展海上力量；杜黑主张制空权，富勒倡导机械化战争，米切尔强调空中力量。","note":"原填空题改造"},{"id":"ch3-052","chapter":"ch3","type":"single","stem":"（　），这是毛泽东关于战争与政治关系的基本观点。","options":["战争是流血的政治","战争是政治的继续","战争是力量的较量","战争是经济的竞赛"],"answer":0,"exp":"毛泽东指出战争是流血的政治，政治是不流血的战争，强调战争从属于政治；战争是政治的继续本为克劳塞维茨命题，毛泽东加以改造。","note":"原填空题改造"},{"id":"ch3-053","chapter":"ch3","type":"single","stem":"（　）是军事发展中最活跃最具革命性的因素。","options":["武器装备","军事思想","军事人才","科技"],"answer":3,"exp":"科技是军事发展中最活跃、最具革命性的因素，武器装备、军事思想等变革最终由科技进步推动，武器装备只是科技的物化成果。","note":"原填空题改造"},{"id":"ch3-054","chapter":"ch3","type":"single","stem":"（　），这是毛泽东关于战争与经济之间关系的重要观点。","options":["战争是流血的政治","战争是综合国力的对抗","战争是力量的较量","战争是经济的竞赛"],"answer":3,"exp":"毛泽东认为战争是经济的竞赛，经济是战争的基础，胜负离不开物质生产支撑；战争是流血的政治讲的是战争与政治的关系。","note":"原填空题改造"},{"id":"ch3-055","chapter":"ch3","type":"single","stem":"（　）是毛泽东军事思想的核心，是我们党必须遵循的战争指导路线。","options":["人民战争思想","灵活机动的战略战术","党对军队的绝对领导","积极防御"],"answer":0,"exp":"人民战争思想是毛泽东军事思想的核心，强调动员和依靠人民群众进行战争；党对军队绝对领导是建军原则，积极防御是战略方针。","note":"原填空题改造"},{"id":"ch3-056","chapter":"ch3","type":"single","stem":"党在新时代的强军目标是建设一支（　）的人民军队，把人民军队全面建成世界一流军队。","options":["听党指挥、能打胜仗、纪律严明","革命化、现代化、正规化","政治合格、军事过硬、作风优良、纪律严明","听党指挥、能打胜仗、作风优良"],"answer":3,"exp":"新时代强军目标是建设听党指挥、能打胜仗、作风优良的人民军队；政治合格、军事过硬等五句话是江泽民时期的总要求，不可混用。","note":"原填空题改造"},{"id":"ch3-057","chapter":"ch3","type":"single","stem":"习近平强军思想是（　）的重要组成部分。","options":["中国特色社会主义理论体系","新时代党的建设总要求","马克思主义军事理论","习近平新时代中国特色社会主义思想"],"answer":3,"exp":"习近平强军思想是习近平新时代中国特色社会主义思想的重要组成部分，是党的军事指导理论最新成果，而非其他理论体系的组成部分。","note":"原填空题改造"},{"id":"ch3-058","chapter":"ch3","type":"multi","stem":"习近平强军思想蕴含的当代中国马克思主义军事观和方法论主要包括（　）。","options":["坚持政治引领","坚持以武止戈","坚持积极进取","坚持统筹兼顾","坚持敢打必胜"],"answer":[0,1,2,3,4],"exp":"习近平强军思想蕴含当代中国马克思主义军事观和方法论，体现为坚持政治引领、以武止戈、积极进取、统筹兼顾、敢打必胜，五项均属其内容。"},{"id":"ch3-059","chapter":"ch3","type":"multi","stem":"“安不忘战”思想源远流长，早在《周易·系辞》中就有（　）的论述。","options":["安而不忘危","存而不忘亡","治而不忘乱","成而不忘败"],"answer":[0,1,2],"exp":"《周易·系辞》讲安而不忘危、存而不忘亡、治而不忘乱，强调居安思危；成而不忘败并非原文表述，属设置的干扰项。"},{"id":"ch3-060","chapter":"ch3","type":"multi","stem":"对《孙子兵法》的地位评价正确的有（　）。","options":["被推崇为“兵学圣典”，在世界军事史上有突出地位","流传广泛，影响深远，在全世界久负盛名","是马克思主义军事科学重要理论的重要来源","是我国古代武学必读的武经七书之一"],"answer":[0,1,3],"exp":"《孙子兵法》被誉为兵学圣典，流传广泛、影响深远，且为武经七书之一；说它是马克思主义军事科学的重要来源则不成立，二者性质不同。"},{"id":"ch3-061","chapter":"ch3","type":"multi","stem":"胡锦涛着眼解决我军现代化水平与打赢信息化条件下局部战争的要求不相适应、军事能力与履行我军新历史使命的要求不相适应的主要矛盾，提出了（　）的战略思想。","options":["以推进国防和军队建设科学发展为主题","以经济建设为中心","以加快转变战斗力生成模式为主线","以信息化为主导"],"answer":[0,2],"exp":"胡锦涛提出以推进国防和军队建设科学发展为主题、以加快转变战斗力生成模式为主线；以经济建设为中心是国家工作大局，不属该战略思想。"},{"id":"ch3-062","chapter":"ch3","type":"multi","stem":"军事思想是关于军事领域基本问题的理性认识，通常包括（　）等。","options":["战争观","军事问题认识论和方法论","战争指导思想","国防和军队建设思想"],"answer":[0,1,2,3],"exp":"军事思想是对军事领域基本问题的理性认识，包括战争观、军事问题认识论和方法论、战争指导思想、国防和军队建设思想，四项均在其列。"},{"id":"ch3-063","chapter":"ch3","type":"multi","stem":"明确推进强军事业必须坚持（　），坚持边斗争、边备战、边建设,更加注重聚焦实战、创新驱动、体系建设、集约高效、军民融合, 加强军事治理,推动高质量发展,全面提高革命化现代化正规化水平。","options":["政治建军","改革强军","科技强军","人才强军","依法治军"],"answer":[0,1,2,3,4],"exp":"推进强军事业必须坚持政治建军、改革强军、科技强军、人才强军、依法治军，五者共同构成新时代强军事业的基本遵循。"},{"id":"ch3-064","chapter":"ch3","type":"multi","stem":"党的十八大以来,我国深化国防和军队改革,建立了（　）的新格局,迈出了构建中国特色军事力量体系的历史性步伐。","options":["军委管总","联指主战","战区主战","军种主建"],"answer":[0,2,3],"exp":"深化国防和军队改革建立军委管总、战区主战、军种主建的新格局；联指主战不是规范表述，联合作战指挥由军委联指承担。"},{"id":"ch3-065","chapter":"ch3","type":"multi","stem":"《孙子兵法》认为战争取胜因素主要包括（　）。","options":["道","天","地","将","法"],"answer":[0,1,2,3,4],"exp":"孙子认为战争取胜因素为道、天、地、将、法五事，分别对应政治民心、天时、地利、将帅和编制法规，本题五项全选。"},{"id":"ch3-066","chapter":"ch3","type":"multi","stem":"按阶级属性，军事思想可分为（　）等。","options":["奴隶主阶级军事思想","封建地主阶级军事思想","资产阶级军事思想","无产阶级军事思想"],"answer":[0,1,2,3],"exp":"按阶级属性划分，军事思想可分为奴隶主阶级、封建地主阶级、资产阶级和无产阶级军事思想，四种形态均属此类，故全选。"},{"id":"ch3-067","chapter":"ch3","type":"multi","stem":"毛泽东军事思想的主要内容包括（　）。","options":["战争观与方法论","人民军队思想","人民战争思想","人民战争的战略战术思想","国防建设思想"],"answer":[0,1,2,3,4],"exp":"毛泽东军事思想包括战争观与方法论、人民军队思想、人民战争思想、人民战争的战略战术思想和国防建设思想，五项构成完整体系。"},{"id":"ch3-068","chapter":"ch3","type":"multi","stem":"国防和军队现代化主要包括（　）。","options":["军事理论现代化","军队组织形态现代化","军事人员现代化","武器装备现代化"],"answer":[0,1,2,3],"exp":"国防和军队现代化包括军事理论、军队组织形态、军事人员和武器装备四个方面的现代化，四者相互支撑，缺一不可。"},{"id":"ch3-069","chapter":"ch3","type":"multi","stem":"到2035年实现国防和军队现代化的主要任务是（　）。","options":["机械化高度发达","信息化基本实现","智能化取得重大进展","武器装备现代化","基于网络信息体系的联合作战能力、全域作战能力全面提高"],"answer":[0,1,2,3,4],"exp":"到2035年要基本实现国防和军队现代化，任务含机械化高度发达、信息化基本实现、智能化取得重大进展、武器装备现代化和联合作战与全域作战能力全面提高。"},{"id":"ch3-070","chapter":"ch3","type":"judge","stem":"上兵伐谋，其次伐交，说的是要善于综合运用政治、经济、外交等非战争手段克敌制胜。","options":["正确","错误"],"answer":0,"exp":"上兵伐谋、其次伐交出自《孙子兵法》，主张以谋略和外交等非战争手段使敌屈服，伐兵攻城为下策，故题干表述正确。"},{"id":"ch3-071","chapter":"ch3","type":"judge","stem":"军事思想来源于军事实践,同时又对军事实践具有指导作用。","options":["正确","错误"],"answer":0,"exp":"军事思想来源于军事实践，又反过来指导军事实践，二者是理论与实践的统一，题干准确揭示了这一辩证关系。"},{"id":"ch3-072","chapter":"ch3","type":"judge","stem":"在战争与政治的关系问题上，古人认识到战争对于政治的从属性，认为战争是本质，政治是现象。","options":["正确","错误"],"answer":1,"exp":"题干预倒了关系：政治是本质，战争是政治的表现和继续，战争从属于政治而非政治从属于战争，故该表述错误。"},{"id":"ch3-073","chapter":"ch3","type":"judge","stem":"拿破仑的军事思想，成功地指导了英国的资产阶级革命战争。","options":["正确","错误"],"answer":1,"exp":"拿破仑是法国统帅，其军事思想指导的是法国资产阶级革命战争，与英国无关，题干张冠李戴，故错误。"},{"id":"ch3-074","chapter":"ch3","type":"judge","stem":"毛泽东军事思想是马列主义普遍原理与中国革命战争和国防建设实际相结合的产物。","options":["正确","错误"],"answer":0,"exp":"毛泽东军事思想是马列主义普遍原理与中国革命战争、国防建设实际相结合的产物，是中国特色军事理论，题干表述正确。"},{"id":"ch3-075","chapter":"ch3","type":"judge","stem":"战争是阶级社会的特有现象，这是毛泽东在全面考察古今中外战争史的基础上，对战争起源和战争根源问题所作的回答。","options":["正确","错误"],"answer":0,"exp":"战争是阶级社会特有的历史现象，随私有制和阶级产生而出现，也将随其消亡而消亡，这是毛泽东对战争起源和根源的科学回答。"},{"id":"ch3-076","chapter":"ch3","type":"judge","stem":"党对军队绝对领导是人民军队建军之本、强军之魂。","options":["正确","错误"],"answer":0,"exp":"党对军队绝对领导是人民军队的建军之本、强军之魂，决定军队性质和方向，是根本原则和制度，题干表述正确。"},{"id":"ch3-077","chapter":"ch3","type":"judge","stem":"在战争性质问题上，古人很早就将战争区分为正义和非正义两种不同的性质。","options":["正确","错误"],"answer":0,"exp":"古人很早就把战争分为正义与非正义两类，如义兵与不义之兵，并以是否合乎道义作为评判标准，题干表述正确。"},{"id":"ch3-078","chapter":"ch3","type":"judge","stem":"拜登政府把“亚太再平衡”战略调整为“印太战略”，将中国定位为美国的“战略竞争对手”。","options":["正确","错误"],"answer":1,"exp":"把亚太再平衡调整为印太战略、将中国定位为战略竞争对手，是特朗普政府时期的事，并非拜登政府，题干主体错误。"},{"id":"ch3-079","chapter":"ch3","type":"judge","stem":"习近平强军思想核心要求是实现党在新时代的强军目标、把人民军队全面建成世界一流军队。","options":["正确","错误"],"answer":0,"exp":"习近平强军思想的核心要求是实现党在新时代的强军目标、把人民军队全面建成世界一流军队，题干概括准确。"},{"id":"ch3-080","chapter":"ch3","type":"judge","stem":"全胜思想将不经战斗就使敌人屈服视为用兵的最高境界,强调绝对的“全”。","options":["正确","错误"],"answer":1,"exp":"全胜思想追求不战而屈人之兵，但全是相对的、有条件的，并不绝对排斥交战，说强调绝对的全属曲解，故错误。"},{"id":"ch3-081","chapter":"ch3","type":"judge","stem":"坚持党指挥枪、建设自己的人民军队,是党在血与火的斗争中得出的颠扑不破的真理。","options":["正确","错误"],"answer":0,"exp":"党指挥枪、建设自己的人民军队，是党在血与火的斗争中得出的颠扑不破的真理，题干表述与这一论断完全一致。"},{"id":"ch3-082","chapter":"ch3","type":"judge","stem":"私有财产和私有制的出现是战争得以产生的决定性因素。","options":["正确","错误"],"answer":0,"exp":"私有财产和私有制的出现是战争产生的决定性因素，战争随私有制产生而产生，题干表述符合马克思主义战争起源观。"},{"id":"ch3-083","chapter":"ch3","type":"judge","stem":"美军规定在军种作战条令与联合作战条令发生冲突时,要求以军种作战条令为准。","options":["正确","错误"],"answer":1,"exp":"美军规定联合作战条令高于军种条令，二者冲突时以联合作战条令为准，题干说以军种条令为准正好相反。"},{"id":"ch4-001","chapter":"ch4","type":"single","stem":"（　）是指主要使用依赖人的体能效应发挥杀伤作用的兵器及相应作战方法进行的战争。","options":["冷兵器战争","热兵器战争","机械化战争","信息化战争"],"answer":0,"exp":"冷兵器战争主要使用依赖人的体能发挥杀伤作用的兵器，如刀枪弓箭；热兵器靠火药，机械化战争靠动力平台，信息化战争靠信息网络。"},{"id":"ch4-002","chapter":"ch4","type":"single","stem":"（　）的作用域虽不是实在的物理空间,却涉及其他各个空间,对其他空间制权产生重要影响,能将智能优势转化为作战胜势。","options":["制陆权","制智权","制空权","制海权"],"answer":1,"exp":"制智权的作用域不在实在物理空间，却渗透并影响陆海空等其他空间，能把智能优势转化为作战胜势，是智能化战争的关键制权。"},{"id":"ch4-003","chapter":"ch4","type":"single","stem":"2003年发生的（　）战争，成为世界新军事革命转向深入发展阶段的一大标志。","options":["海湾战争","科索沃战争","阿富汗战争","伊拉克战争"],"answer":3,"exp":"2003年伊拉克战争大量运用信息化装备和精确打击，成为世界新军事革命转向深入发展阶段的标志；海湾战争则是其起步阶段的标志。"},{"id":"ch4-004","chapter":"ch4","type":"single","stem":"2005年，美国海军中将詹姆斯·马蒂斯和军事学者弗兰克·霍夫曼就在美国《海军杂志》上撰文，提出（　）理论。","options":["马赛克战争","“联合全域指挥与控制”作战","网络空间作战","混合战争"],"answer":3,"exp":"2005年马蒂斯与霍夫曼撰文提出混合战争理论，强调常规战争与非常规作战、信息舆论等手段混合运用；马赛克战争是其后出现的概念。"},{"id":"ch4-005","chapter":"ch4","type":"single","stem":"科索沃战争是北约在战区外指挥的规模较大的局部战争，以（　）为主要交战方式。","options":["近距离非接触精确作战","远距离非接触精确作战","近距离非线性精确作战","远距离非线性精确作战"],"answer":1,"exp":"科索沃战争由北约在战区外指挥，主要靠空中力量实施远距离非接触精确打击，故为远距离非接触精确作战，而非近距离或非线性作战。"},{"id":"ch4-006","chapter":"ch4","type":"single","stem":"在战争制胜问题上,（　）始终是决定因素。","options":["武器","人","政治","科技","经济"],"answer":1,"exp":"战争制胜问题上人始终是决定因素，武器装备虽重要却由人掌握运用，政治、经济、科技也要通过人才能转化为战斗力。"},{"id":"ch4-007","chapter":"ch4","type":"single","stem":"20世纪90年代初爆发的（　）是机械化战争向信息化战争过渡的一个重要转折点,在信息化战争进程中具有里程碑意义。","options":["海湾战争","科索沃战争","阿富汗战争","伊拉克战争"],"answer":0,"exp":"20世纪90年代初的海湾战争展示精确制导武器和信息化指挥，是机械化战争向信息化战争过渡的转折点，具有里程碑意义。"},{"id":"ch4-008","chapter":"ch4","type":"single","stem":"（　）年,美国研制出世界上第一台电子计算机,它标志着人类社会生活面貌由此发生深刻的变化,拉开了数字计算机和数字化时代的帷幕。","options":["1945","1946","1947","1956"],"answer":1,"exp":"1946年美国研制出世界上第一台电子计算机，拉开数字化时代帷幕；1945年是二战结束之年，其余选项年代与计算机诞生不符。"},{"id":"ch4-009","chapter":"ch4","type":"single","stem":"13世纪中期中国创制的（　），是世界上最早自发运用射击原理的管形射击火器。","options":["滑膛枪","突火枪","燧发枪","火绳枪"],"answer":1,"exp":"13世纪中期中国创制的突火枪以火药燃气发射弹丸，是世界上最早自发运用射击原理的管形射击火器；火绳枪、燧发枪、滑膛枪都晚于它。"},{"id":"ch4-010","chapter":"ch4","type":"single","stem":"指导海湾战争的军事理论是（　）。","options":["空地一体作战","非对称、非接触作战","网络中心战","快速决定性作战"],"answer":0,"exp":"海湾战争以空地一体作战理论为指导，强调空中力量与地面机动密切协同；非对称非接触、网络中心战、快速决定性作战均属其后提出的理论。"},{"id":"ch4-011","chapter":"ch4","type":"single","stem":"指导科索沃战争的军事理论是（　）。","options":["空地一体作战","非对称、非接触作战","网络中心战","快速决定性作战"],"answer":1,"exp":"科索沃战争中北约凭借绝对空中优势实施远程精确打击，双方力量悬殊且脱离接触，正体现非对称、非接触作战的特点。"},{"id":"ch4-012","chapter":"ch4","type":"single","stem":"指导阿富汗战争的军事理论是（　）。","options":["空地一体作战","非对称、非接触作战","网络中心战","快速决定性作战"],"answer":2,"exp":"阿富汗战争中美军以信息网络把侦察、指挥与打击联为一体，实现发现即摧毁，体现的是网络中心战思想，故选网络中心战。"},{"id":"ch4-013","chapter":"ch4","type":"single","stem":"指导伊拉克战争的军事理论是（　）。","options":["空地一体作战","非对称、非接触作战","网络中心战","快速决定性作战"],"answer":3,"exp":"快速决定性作战强调以效果为中心，通过快速瘫痪敌方抵抗意志取胜；伊拉克战争中美军直取巴格达正是这一理论的实践。"},{"id":"ch4-014","chapter":"ch4","type":"single","stem":"机械化战争理论的核心是（　）。","options":["飞机制胜论","坦克制胜论","舰船制胜论","导弹制胜论"],"answer":1,"exp":"机械化战争理论以坦克等装甲战车为骨干，核心是坦克制胜论；飞机制胜论、舰船制胜论、导弹制胜论分属其他军种作战理论，不能混为核心。"},{"id":"ch4-015","chapter":"ch4","type":"single","stem":"以主战兵器作为划分战争形态的主要标准，将战争形态分为（　）。","options":["冷兵器战争、热兵器战争、核战争、信息化战争","常规战争、核战争、信息化战争、智能化战争","冷兵器战争、热兵器战争、机械化战争、信息化战争","古代战争、近代战争、现代战争、未来战争"],"answer":2,"exp":"以主战兵器为标准，战争形态依次为冷兵器战争、热兵器战争、机械化战争和信息化战争；选项中的核战争不属于这一划分序列。","note":"原填空题改造"},{"id":"ch4-016","chapter":"ch4","type":"single","stem":"冷兵器战争始于原始社会晚期，迄于公元10世纪，可分为（　）三个阶段。","options":["石器时代战争、青铜器时代战争、铁器时代战争","徒步战争、车战、骑兵战争","冷兵器初期、中期、晚期战争","原始社会战争、奴隶社会战争、封建社会战争"],"answer":0,"exp":"冷兵器战争按兵器材料分为石器时代战争、青铜器时代战争和铁器时代战争三个阶段；徒步、车战、骑兵战是按作战方式划分的，角度不同。","note":"原填空题改造"},{"id":"ch4-017","chapter":"ch4","type":"single","stem":"军事学术界普遍认为，新军事革命实质上是一场（　）军事革命。","options":["数字化","信息化","机械化","智能化"],"answer":1,"exp":"新军事革命实质是一场信息化军事革命，机械化是此前战争形态，数字化、智能化只是信息化进程中的技术阶段，都不能概括其性质。","note":"原填空题改造"},{"id":"ch4-018","chapter":"ch4","type":"single","stem":"美国社会预测学家（　）从人类社会文明演进发展的角度，将信息化战争称之为（　）。","options":["托夫勒；第三次浪潮战争","奈斯比特；信息战争","斯里普琴科；第六代战争","托夫勒；信息时代战争"],"answer":0,"exp":"托夫勒从文明演进角度把农业时代、工业时代、信息时代的战争依次称为第一、二、三次浪潮战争，故信息化战争又称第三次浪潮战争。","note":"原填空题改造"},{"id":"ch4-019","chapter":"ch4","type":"single","stem":"俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称之为（　）。","options":["第五代战争","第六代战争","非接触战争","信息战争"],"answer":1,"exp":"斯里普琴科按武器装备发展划分战争代际，把以精确制导武器为主的信息化战争称为第六代战争，第五代战争指核战争，不可混淆。","note":"原填空题改造"},{"id":"ch4-020","chapter":"ch4","type":"single","stem":"（　）是与信息化战争相适应的基本作战形式。","options":["立体作战","一体化联合作战","合同作战","协同作战"],"answer":1,"exp":"信息化战争中各军兵种依托网络共享信息、同步行动，一体化联合作战取代合同作战和协同作战，成为与之相适应的基本作战形式。","note":"原填空题改造"},{"id":"ch4-021","chapter":"ch4","type":"single","stem":"从海湾战争的空地一体作战，到科索沃战争的非对称、非接触作战，从阿富汗战争的网络中心战，到伊拉克战争的（　），用不同的军事理论指导了四场不同战争。","options":["空海一体战","全谱作战","精确闪击战","快速决定性作战"],"answer":3,"exp":"题干按时间顺序串联四场战争的理论：海湾战争对应空地一体作战，伊拉克战争则对应快速决定性作战，与其他三项形成一一对应。","note":"原填空题改造"},{"id":"ch4-022","chapter":"ch4","type":"single","stem":"（　）是第二次世界大战中苏德战场上的一次决定性战役，也是第二次世界大战的主要转折点。","options":["莫斯科战役","柏林战役","库尔斯克战役","斯大林格勒战役"],"answer":3,"exp":"斯大林格勒战役中苏军围歼德军重兵集团，使德军丧失战略主动权，成为二战主要转折点；莫斯科战役只是粉碎了德军闪击战。","note":"原填空题改造"},{"id":"ch4-023","chapter":"ch4","type":"single","stem":"当前，信息化战争正步入其发展的高级阶段，即具有（　）特征的信息化战争阶段。","options":["数字化","智能化","无人化","网络化"],"answer":1,"exp":"信息化战争正步入智能化阶段，即由信息主导转向智能主导；无人化、网络化只是智能化的技术表现，不是这一高级阶段的名称。","note":"原填空题改造"},{"id":"ch4-024","chapter":"ch4","type":"single","stem":"（　）年8月，美国在日本投下了两颗原子弹，宣告核时代的到来。","options":["1945","1944","1946","1949"],"answer":0,"exp":"1945年8月美国投下原子弹，宣告核时代到来；1944、1946、1949三个选项均与这一标志性事件的时间不符，故排除。","note":"原填空题改造"},{"id":"ch4-025","chapter":"ch4","type":"single","stem":"信息化战争中的体系较量主要体现在\"三大系统\"的对抗上，即（　）。","options":["通信系统、导航系统、打击系统","侦察系统、预警系统、指挥系统","战场认知系统、战场通信系统、指挥控制系统","情报系统、指挥系统、武器系统"],"answer":2,"exp":"三大系统指战场认知系统、战场通信系统和指挥控制系统，三者分别解决知、传、控的问题；情报、预警等提法割裂了这一体系结构。","note":"原填空题改造"},{"id":"ch4-026","chapter":"ch4","type":"single","stem":"\"信息化\"最终取代\"机械化\"的主导地位，战争将由（　）为中心转向以（　）为中心。","options":["平台；体系","武器；信息","体系；平台","军队；网络"],"answer":0,"exp":"信息化战争使作战重心由平台为中心转向体系为中心，胜负不再取决于单一武器平台，而取决于整个作战体系的效能。","note":"原填空题改造"},{"id":"ch4-027","chapter":"ch4","type":"single","stem":"信息化战争是人类社会由（　）步入（　）的产物。","options":["农业社会；工业社会","工业社会；信息社会","机械化社会；信息化社会","信息社会；智能社会"],"answer":1,"exp":"信息化战争是人类社会由工业社会步入信息社会的产物；农业社会对应冷兵器战争，信息社会之后的智能社会则催生智能化战争。","note":"原填空题改造"},{"id":"ch4-028","chapter":"ch4","type":"single","stem":"军事创新主要包括军事（　）创新。","options":["理论、技术、制度","技术、战术、制度","思想、组织、装备","理论、装备、体制"],"answer":0,"exp":"军事创新包括军事理论创新、军事技术创新和军事制度创新，三者相互牵引；装备、战术是其具体体现，不属于并列的顶层分类。","note":"原填空题改造"},{"id":"ch4-029","chapter":"ch4","type":"single","stem":"（　），准备打才可能不必打，越不能打越可能挨打，这就是战争与和平的辩证法。","options":["以战止战","能战方能止战","忘战必危","好战必亡"],"answer":1,"exp":"能战方能止战揭示了战争与和平的辩证法：具备打赢能力才能有效威慑、避免战争；忘战必危、好战必亡讲的是另外两层警示。","note":"原填空题改造"},{"id":"ch4-030","chapter":"ch4","type":"single","stem":"机械化战争围绕\"物质和能量对抗\"这一核心，沿（　）三大轴线对抗发展。","options":["机动力、突击力、防护力","火力、信息力、机动力","火力、机动力、突击力","火力、防护力、指挥力"],"answer":2,"exp":"机械化战争以物质和能量对抗为核心，沿火力、机动力、突击力三大轴线发展；信息力属于信息化战争的主导要素，不能混入。","note":"原填空题改造"},{"id":"ch4-031","chapter":"ch4","type":"single","stem":"信息化战争发展过程将经历由低级到高级的（　）三个阶段。","options":["数字化、信息化、智能化","网络化、数字化、智能化","机械化、信息化、智能化","数字化、网络化、智能化"],"answer":3,"exp":"信息化战争由低级到高级依次经历数字化、网络化、智能化三个阶段；机械化是此前战争形态，不在信息化战争内部的阶段序列中。","note":"原填空题改造"},{"id":"ch4-032","chapter":"ch4","type":"single","stem":"如果说机械化战争中武器系统的作战效能主要取决于武器装备的\"数量规模\"，在信息化战争中武器装备的作战效能则主要是由（　）决定的。","options":["火力强度","信息主导","防护能力","机动能力"],"answer":1,"exp":"信息化战争中武器装备的效能主要由信息主导决定，信息能倍增火力与机动的效果，单看火力、防护、机动已无法说明效能高低。","note":"原填空题改造"},{"id":"ch4-033","chapter":"ch4","type":"single","stem":"在长期的中国革命战争过程中，由于敌强我弱的客观实际，我军采取的基本作战形式是（　）。","options":["运动战、阵地战、游击战","阵地战、攻坚战、运动战","运动战、游击战、正规战","游击战、运动战、攻坚战"],"answer":0,"exp":"敌强我弱条件下，我军以运动战、阵地战、游击战三种形式相互配合；攻坚战只是阵地战的一种具体打法，不能与之并列为基本形式。","note":"原填空题改造"},{"id":"ch4-034","chapter":"ch4","type":"single","stem":"美军研发的（　）系统，使战场综合电子信息系统和所有武器系统实现了一体化。","options":["C3I","C4ISR","GIG","C4KISR"],"answer":3,"exp":"C4KISR在C4ISR基础上增加杀伤链环节，把指挥控制、侦察预警与武器系统联为一体；C3I和GIG都缺少武器一体化这一环。","note":"原填空题改造"},{"id":"ch4-035","chapter":"ch4","type":"single","stem":"（　）是融心理战、舆论战、信息战于一体的最高层级的非动能作战样式。","options":["电子战","心理战","网络战","认知战"],"answer":3,"exp":"认知战把心理战、舆论战、信息战的手段统合起来，直接作用于人的认知和意志，因而处于非动能作战的最高层级；电子战、网络战只是其技术支撑。","note":"原填空题改造"},{"id":"ch4-036","chapter":"ch4","type":"multi","stem":"太空战的作战样式主要包括（　）。","options":["导弹拦截战","卫星攻击战","天对地攻击战","太空作战平台攻防战"],"answer":[0,1,2,3],"exp":"太空战按作战对象分为导弹拦截战、卫星攻击战、天对地攻击战和太空作战平台攻防战，四项均属其作战样式，故全选。"},{"id":"ch4-037","chapter":"ch4","type":"multi","stem":"信息化战争中的网络战分为（　）。","options":["战略网络战","战役网络战","战术网络战","战场网络战"],"answer":[0,3],"exp":"教材把网络战分为战略网络战和战场网络战两大类；战役网络战、战术网络战是仿照传统层级设置的干扰项，不属这一分类。"},{"id":"ch4-038","chapter":"ch4","type":"multi","stem":"新军事革命的主要内容包括（　）。","options":["创新军事理论","升级武器装备","重塑军队组织形态","培养高素质新型军事人才","革新作战样式"],"answer":[0,1,2,3,4],"exp":"新军事革命是军事理论、武器装备、组织形态、人才培养和作战样式的全面变革，五者缺一不可，故五项全选。"},{"id":"ch4-039","chapter":"ch4","type":"multi","stem":"我们要把现代战争的制胜机理搞透,强化（　）的观念,发展具有我军特色的作战理论和作战思想。","options":["信息主导","体系支撑","精兵作战","联合制胜"],"answer":[0,1,2,3],"exp":"信息主导、体系支撑、精兵作战、联合制胜是认识现代战争制胜机理的四个基本观念，四者并列，均须强化，故全选。"},{"id":"ch4-040","chapter":"ch4","type":"multi","stem":"智能化战争的演变动因包括（　）。","options":["新一轮科技革命是推动智能化战争演变的物质基础","大国战略竞争是推动智能化战争演变的关键因素","军事理论创新是推动智能化战争演变的思想先导","近几场局部战争是智能化战争演变的检验平台"],"answer":[0,1,2,3],"exp":"智能化战争由科技革命提供物质基础、大国竞争施加关键牵引、理论创新充当思想先导、局部战争充当检验平台，四项构成完整动因，故全选。"},{"id":"ch4-041","chapter":"ch4","type":"multi","stem":"以主战兵器作为划分战争形态的主要标准，战争形态可分为（　）。","options":["冷兵器战争","热兵器战争","机械化战争","信息化战争"],"answer":[0,1,2,3],"exp":"按主战兵器划分，战争形态为冷兵器战争、热兵器战争、机械化战争和信息化战争四类，四个选项同属这一序列，故全选。"},{"id":"ch4-042","chapter":"ch4","type":"multi","stem":"信息化战争中的体系较量主要体现在（　）的对抗上。","options":["战场认知系统","战场通信系统","指挥控制系统","综合保障系统"],"answer":[0,1,2],"exp":"体系较量指战场认知系统、战场通信系统和指挥控制系统的对抗；综合保障系统属后勤保障范畴，与三者作战功能不同，故不选。"},{"id":"ch4-043","chapter":"ch4","type":"multi","stem":"机械化战争围绕“物质和能量对抗”这一核心，沿（　）等几大轴线展开。","options":["火力","信息力","机动力","突击力"],"answer":[0,2,3],"exp":"机械化战争的轴线是火力、机动力和突击力，三者都是物质能量的比拼；信息力是信息化战争的主导要素，不在此列，故排除。"},{"id":"ch4-044","chapter":"ch4","type":"multi","stem":"信息化战争发展过程将经历由低级到高级的（　）等阶段。","options":["信息化","数字化","网络化","智能化"],"answer":[1,2,3],"exp":"信息化战争自身经历数字化、网络化、智能化三个阶段；信息化是对这一战争形态的总称，不能与自己的发展阶段并列，故不选。"},{"id":"ch4-045","chapter":"ch4","type":"multi","stem":"在长期的中国革命战争过程中，由于敌强我弱的客观实际，我军采取的基本作战形式有（　）。","options":["游击战","运动战","总体战","阵地战"],"answer":[0,1,3],"exp":"游击战、运动战、阵地战是我军在敌强我弱条件下并用的三种基本作战形式；总体战指国家全部力量投入的战争，不属于作战形式。"},{"id":"ch4-046","chapter":"ch4","type":"judge","stem":"铜器时代的到来标志着冷兵器进入了成熟阶段。","options":["正确","错误"],"answer":1,"exp":"冷兵器成熟于铁器时代，铁制兵器坚硬锋利、大量装备军队；铜器时代只是由石器向金属兵器的过渡阶段，故题干说法错误。"},{"id":"ch4-047","chapter":"ch4","type":"judge","stem":"俄罗斯著名军事理论家斯里普琴科从战争所使用的武器装备发展的角度，将信息化战争称为“第五代战争”。","options":["正确","错误"],"answer":1,"exp":"斯里普琴科把信息化战争称为第六代战争，第五代战争指核战争；题干把代际序号说错，故错误。"},{"id":"ch4-048","chapter":"ch4","type":"judge","stem":"一场军事革命的完成，是以军队组织结构调整的最终实现为标志。","options":["正确","错误"],"answer":0,"exp":"军事革命从技术装备突破开始，经作战方式变革，最终以军队组织结构的调整重塑完成，组织形态落地才算革命完成，故正确。"},{"id":"ch4-049","chapter":"ch4","type":"judge","stem":"在现代科技发展到信息时代的今天，战争仍然是国家和社会集团为达到政治、经济目的，使用暴力与非暴力手段迫使敌方服从己方意志的军事对抗行为。","options":["正确","错误"],"answer":0,"exp":"信息化条件下战争手段和样式虽变，但战争仍是国家和社会集团为达到政治、经济目的而进行的暴力对抗，题干符合战争本质，正确。"},{"id":"ch4-050","chapter":"ch4","type":"judge","stem":"当今世界，政治和战争的关系呈现很多新的时代特点，但无论怎么变，马克思主义关于“战争是政治的继续”的基本观点始终成立。","options":["正确","错误"],"answer":0,"exp":"战争是政治的继续是马克思主义战争观的基本观点，现代战争政治目的更隐蔽、手段更多样，但战争服从政治的本质未变，故正确。"},{"id":"ch4-051","chapter":"ch4","type":"judge","stem":"德国首先创制了将火力、装甲防护能力和机动能力结合为一体的坦克，使战车以全新的面貌出现于战场。","options":["正确","错误"],"answer":1,"exp":"坦克并非德国首创，而是由英国首先创制并投入战场，题干把首创国说成德国，张冠李戴，故错误。"},{"id":"ch4-052","chapter":"ch4","type":"judge","stem":"一般来说，在一场全面军事革命中，最先发生变化的是军事技术和武器装备，最后完成革命的是军事组织体制。","options":["正确","错误"],"answer":0,"exp":"军事革命通常先从军事技术和武器装备突破，进而引起作战方式变革，最后以军事组织体制调整完成，题干顺序正确。"},{"id":"ch4-053","chapter":"ch4","type":"judge","stem":"导弹拦截战是太空战的一种作战样式。","options":["正确","错误"],"answer":0,"exp":"导弹拦截战在大气层外或太空实施，与卫星攻击战、天对地攻击战并列，属太空战的作战样式之一，故正确。"},{"id":"ch4-054","chapter":"ch4","type":"judge","stem":"机械化战争是以体系为中心，信息化战争则是以平台为中心。","options":["正确","错误"],"answer":1,"exp":"题干把两者说反了：机械化战争以平台为中心，信息化战争以体系为中心，故错误。"},{"id":"ch4-055","chapter":"ch4","type":"judge","stem":"战争目的的有限性以及战争的范围和使用手段的可控性是现代战争的重要特征。","options":["正确","错误"],"answer":0,"exp":"现代战争多服务于有限政治目的，交战范围和手段使用受到控制，战争目的有限、范围与手段可控是其重要特征，故正确。"},{"id":"ch4-056","chapter":"ch4","type":"judge","stem":"在信息化战争中，信息优势取代火力、机动力成为衡量双方力量优劣的首要标志。","options":["正确","错误"],"answer":0,"exp":"信息化战争中信息优势取代火力、机动力，成为衡量双方力量优劣的首要标志，火力机动仍起作用但退居次要，故正确。"},{"id":"ch4-057","chapter":"ch4","type":"judge","stem":"联合作战是信息化战争的基本作战形式。","options":["正确","错误"],"answer":1,"exp":"信息化战争的基本作战形式是一体化联合作战，只讲联合作战缺少一体化这一本质要求，表述不准确，故错误。"},{"id":"ch4-058","chapter":"ch4","type":"judge","stem":"人类最早的战争可以追溯到原始社会早期。","options":["正确","错误"],"answer":1,"exp":"战争随私有制和阶级的产生而出现，最早可追溯到原始社会晚期；原始社会早期尚无阶级和国家，故题干错误。"},{"id":"ch4-059","chapter":"ch4","type":"judge","stem":"霸权主义和强权政治仍然是现代战争产生的主要根源。","options":["正确","错误"],"answer":0,"exp":"霸权主义和强权政治仍是现代战争产生的主要根源，冷战后多数局部战争由此引发，题干判断正确。"},{"id":"ch4-060","chapter":"ch4","type":"judge","stem":"无论是信息化战争抑或智能化战争,暴力性本质依然未变,战争依然是用暴力消灭敌人的极端方式。","options":["正确","错误"],"answer":0,"exp":"信息化、智能化战争形态虽新，但战争以暴力迫使敌方服从己方意志的本质没有改变，题干表述正确。"},{"id":"ch4-061","chapter":"ch4","type":"judge","stem":"火力和机动力是机械化战争制胜的主导要素,“制陆权”“制海权”“制空权”成为机械化战争制权争夺的核心。","options":["正确","错误"],"answer":0,"exp":"机械化战争中火力与机动力决定战场主动权，制陆权、制海权、制空权由此成为制权争夺的核心，题干表述正确。"},{"id":"ch4-062","chapter":"ch4","type":"judge","stem":"无人化作战并不是无人作战,也无法完全替代有人作战,它仍离不开人的参与,只是人参与作战的方式发生了改变。","options":["正确","错误"],"answer":0,"exp":"无人化作战只是平台无人，侦察判断、决策授权和任务规划仍由人完成，人仅改变参与方式，故不能等同于无人作战。"},{"id":"ch5-001","chapter":"ch5","type":"single","stem":"（　）是现代海军水面舰艇中排水量最大，作战能力最强，素有“海上巨无霸”之称。","options":["航空母舰","驱逐舰","潜艇","护卫舰"],"answer":0,"exp":"航空母舰可搭载大量舰载机，兼具制空、制海和对陆打击能力，排水量与作战能力均居水面舰艇之首，故称海上巨无霸。"},{"id":"ch5-002","chapter":"ch5","type":"single","stem":"美陆军的M系列的坦克装甲车,俄罗斯的T系列坦克等都是（　）的地面主战装备。","options":["标准化","通用化","体系化","系列化"],"answer":3,"exp":"M系列、T系列都是在同一基本型上衍生出多种型号，形成完整型号谱系，体现的是系列化；标准化重统一规格，通用化重部件互换。"},{"id":"ch5-003","chapter":"ch5","type":"single","stem":"（　）期间,航空母舰广泛运用。","options":["第一次世界大战","第二次世界大战","海湾战争","伊拉克战争"],"answer":1,"exp":"第二次世界大战中航母在太平洋战场取代战列舰成为海战主力，得到广泛运用；一战时航母尚处试验阶段，故不选第一次世界大战。"},{"id":"ch5-004","chapter":"ch5","type":"single","stem":"一般认为直接命中概率达（　）以上的制导武器才能称为精确制导武器。","options":["40%","50%","60%","70%"],"answer":1,"exp":"军事上通常以直接命中概率达到50%以上作为精确制导武器的门槛，低于这一标准便与普通弹药差别不大，故选50%。"},{"id":"ch5-005","chapter":"ch5","type":"single","stem":"（　）是美国国防部的第11个联合作战司令部。","options":["印太司令部","网络司令部","特种作战司令部","太空司令部"],"answer":3,"exp":"太空司令部专司太空作战，是国防部按序列排定的第11个联合作战司令部，与印太、网络、特种作战等司令部的职能领域不同。"},{"id":"ch5-006","chapter":"ch5","type":"single","stem":"（　）成为信息化装备全面走上战争舞台的标志。","options":["海湾战争","利比亚战争","伊拉克战争","叙利亚战争"],"answer":0,"exp":"海湾战争中预警机、电子战飞机和精确制导武器大量使用，体系化信息支撑特征明显，被视为信息化装备全面登上战争舞台的标志。"},{"id":"ch5-007","chapter":"ch5","type":"single","stem":"（　）年，第一艘超级战列舰“无畏”号的下水,开创了“巨舰大炮”时代。","options":["1904","1905","1906","1907"],"answer":1,"exp":"“无畏”号于1905年下水，统一装备全重型火炮并采用蒸汽轮机，火力与航速远超同期战列舰，由此开创“巨舰大炮”时代。"},{"id":"ch5-008","chapter":"ch5","type":"single","stem":"（　）年10月4日，苏联把世界上第一颗人造地球卫星送入地球近地轨道。","options":["1957","1958","1959","1968"],"answer":0,"exp":"苏联于1957年10月4日把第一颗人造地球卫星送入近地轨道，人类由此进入航天时代，故对应年份为1957年。"},{"id":"ch5-009","chapter":"ch5","type":"single","stem":"（　）年8月，美国间谍卫星“发现者”13号回收成功，标志着人类开始利用太空进行军事活动。","options":["1959","1960","1961","1962"],"answer":1,"exp":"1960年8月美国“发现者”13号间谍卫星回收成功，使太空侦察从一次使用走向回收复用，标志人类开始利用太空进行军事活动。"},{"id":"ch5-010","chapter":"ch5","type":"single","stem":"化学武器大规模使用始于（　）。","options":["第一次世界大战","第二次世界大战","美侵朝战争","美侵越战争"],"answer":0,"exp":"第一次世界大战中交战双方大量施放氯气、芥子气等化学毒剂，造成大规模伤亡，化学武器由此开始大规模使用。"},{"id":"ch5-011","chapter":"ch5","type":"single","stem":"（　）初期，雷达投入作战使用，成为防空探测和火炮控制的有力武器，是当时电子战的重要装备。","options":["第一次世界大战","第二次世界大战","越南战争","日俄战争"],"answer":1,"exp":"第二次世界大战初期雷达投入作战使用，承担防空预警和火炮控制任务，成为当时电子战的重要装备，故选第二次世界大战。"},{"id":"ch5-012","chapter":"ch5","type":"single","stem":"2020年9月, （　）爆发，无人机在冲突中扮演了重要角色，正在重新定义现代战场。","options":["俄乌冲突","巴以冲突","纳卡冲突","印巴冲突"],"answer":2,"exp":"2020年9月纳卡冲突中无人机大量参战并取得显著战果，被视为无人机重新定义现代战场的标志性事件，故为纳卡冲突。"},{"id":"ch5-013","chapter":"ch5","type":"single","stem":"飞机第一次投入战争是在1911年的（　）中。","options":["第一次世界大战","第二次世界大战","意土战争","日俄战争"],"answer":2,"exp":"1911年意土战争中意大利首次把飞机用于侦察和投弹，开飞机参战之先河，此后飞机才逐步大量用于战争。"},{"id":"ch5-014","chapter":"ch5","type":"single","stem":"电磁轨道炮属于（　）。","options":["新概念能量武器","新概念信息武器","新概念生化武器","新概念环境武器"],"answer":0,"exp":"电磁轨道炮靠电磁力加速弹丸，以高速动能毁伤目标，属于新概念能量武器；它不靠信息、生化或环境效应制胜，故排除其余三项。"},{"id":"ch5-015","chapter":"ch5","type":"single","stem":"精确制导武器得到大规模使用是在（　）中。","options":["海湾战争","利比亚战争","伊拉克战争","叙利亚战争"],"answer":0,"exp":"海湾战争中精确制导武器使用量空前、打击效果显著，成为精确制导武器大规模使用的标志，也被视为信息化战争的开端。"},{"id":"ch5-016","chapter":"ch5","type":"single","stem":"第一次世界大战期间，（　）大量运用，海上作战向水下发展。","options":["航空母舰","潜艇","驱逐舰","护卫舰"],"answer":1,"exp":"第一次世界大战中潜艇大量运用，无限制潜艇战使海上作战向水下延伸，故题干所指装备为潜艇，而非航母、驱逐舰或护卫舰。"},{"id":"ch5-017","chapter":"ch5","type":"single","stem":"（　）是综合电子信息系统的核心。","options":["预警探测系统","情报侦察系统","电子对抗系统","指挥控制系统"],"answer":3,"exp":"综合电子信息系统以指挥控制系统为核心，预警探测、情报侦察和电子对抗系统都要围绕指挥控制发挥作用，故其为核心。"},{"id":"ch5-018","chapter":"ch5","type":"single","stem":"（　）是指工作原理、毁伤机理和作战运用方式与传统武器有显著不同的各类高技术武器的统称。","options":["精确制导武器","新概念武器","核武器","生物武器"],"answer":1,"exp":"新概念武器强调工作原理、毁伤机理和作战运用方式与传统武器显著不同；精确制导武器仍属常规弹药，核武器和生物武器另有归类。"},{"id":"ch5-019","chapter":"ch5","type":"single","stem":"在（　）中，无人机首次正式被派往战场执行任务。","options":["第一次世界大战","第二次世界大战","越南战争","海湾战争"],"answer":2,"exp":"越南战争中无人机首次正式被派往战场执行侦察等任务，此后才逐步发展出侦察打击一体化的无人机作战运用。"},{"id":"ch5-020","chapter":"ch5","type":"single","stem":"（　）期间,无线电台大量装备部队,以电子战装备为代表的信息化装备初现端倪。","options":["第一次世界大战","第二次世界大战","意土战争","日俄战争"],"answer":0,"exp":"第一次世界大战期间无线电台大量装备部队，电子战装备初现端倪，标志信息化装备开始萌芽，故选第一次世界大战。"},{"id":"ch5-021","chapter":"ch5","type":"single","stem":"（　）期间，战斗机器人开始进入战场。","options":["海湾战争","伊拉克战争","科索沃战争","叙利亚战争"],"answer":3,"exp":"叙利亚战争中战斗机器人开始进入战场，承担侦察、排爆和火力支援等任务，标志地面无人作战力量走向实战化。"},{"id":"ch5-022","chapter":"ch5","type":"single","stem":"C4KISR系统里的“S”是指（　）。","options":["计算机","监视","通信","侦察"],"answer":1,"exp":"C4KISR中S对应英文Surveillance，意为监视；C为指挥、控制、通信、计算机，K为杀伤，I为情报，R为侦察，故S是监视。"},{"id":"ch5-023","chapter":"ch5","type":"single","stem":"登陆作战舰艇属于（　）。","options":["水面大型作战平台","水面作战平台","水下作战平台","两栖突击作战平台"],"answer":3,"exp":"登陆作战舰艇专门输送登陆兵和装备抢滩上陆，具有两栖突击功能，应归入两栖突击作战平台，而非一般水面或水下作战平台。"},{"id":"ch5-024","chapter":"ch5","type":"single","stem":"新型装甲作战平台(NGP)装上不同的武器,就可以使之成为主战坦克、步兵战车或防空系统，体现了陆上信息化作战平台的（　）。","options":["标准化","通用化","体系化","系列化"],"answer":1,"exp":"同一新型装甲平台换装不同武器即可成为主战坦克、步兵战车或防空系统，体现一平台多用途的通用化，而非标准化或系列化。"},{"id":"ch5-025","chapter":"ch5","type":"single","stem":"（　）是军队现代化的重要标志，是国家安全和民族复兴的重要支撑。","options":["编制体制","军事理论","军事人才","武器装备"],"answer":3,"exp":"武器装备是军队现代化的重要标志，是国家安全和民族复兴的重要支撑，其水平直接反映军队现代化程度，故选武器装备。","note":"原填空题改造"},{"id":"ch5-026","chapter":"ch5","type":"single","stem":"（　）是我国完全自主研制的新型万吨级驱逐舰。","options":["055型驱逐舰","054A型护卫舰","052C型驱逐舰","052D型驱逐舰"],"answer":0,"exp":"055型是我国完全自主研制的万吨级驱逐舰；052C、052D吨位较小，054A是护卫舰，均不符合万吨级这一限定。","note":"原填空题改造"},{"id":"ch5-027","chapter":"ch5","type":"single","stem":"（　）是世界上第一种完全隐身的现役战略轰炸机。","options":["F-117","B-1B","B-2","F-22"],"answer":2,"exp":"B-2是现役唯一完全隐身的战略轰炸机；F-117属隐身攻击机，B-1B不具备完全隐身能力，F-22是隐身战斗机而非轰炸机。","note":"原填空题改造"},{"id
