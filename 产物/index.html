":"ch5-028","chapter":"ch5","type":"single","stem":"2011年爆发的（　），新的信息化装备被广泛应用，战斗机器人开始进入战场。","options":["叙利亚战争","伊拉克战争","阿富汗战争","利比亚战争"],"answer":0,"exp":"2011年爆发的叙利亚战争中，新的信息化装备被广泛应用，战斗机器人开始进入战场，故对应战争为叙利亚战争。","note":"原填空题改造"},{"id":"ch5-029","chapter":"ch5","type":"single","stem":"自从1983年美国研制出了全球第一款隐形飞机F-117以来，美军就开始垄断隐身航空工业，直到中国（　）问世，打破了这一格局。","options":["歼-10","歼-31","歼-16","歼-20"],"answer":3,"exp":"歼-20是我国自主研制的隐身战斗机，其问世打破美军对隐身航空工业的垄断；歼-10、歼-16均为非隐身机型，故选歼-20。","note":"原填空题改造"},{"id":"ch5-030","chapter":"ch5","type":"single","stem":"潜艇按动力分为（　）潜艇。","options":["常规动力和核动力","常规动力和AIP动力","攻击型和战略型","核动力和柴电动力"],"answer":0,"exp":"潜艇按动力分为常规动力潜艇和核动力潜艇；攻击型与战略型是按作战任务划分，AIP只是常规动力的改进技术，不是并列类别。","note":"原填空题改造"},{"id":"ch5-031","chapter":"ch5","type":"single","stem":"（　）是我国第一艘电磁弹射型航空母舰。","options":["\"福建号\"航空母舰","\"山东号\"航空母舰","\"辽宁号\"航空母舰","\"海南号\"两栖攻击舰"],"answer":0,"exp":"福建号是我国第一艘采用电磁弹射的航空母舰；辽宁号、山东号均为滑跃起飞，海南号是两栖攻击舰而非航母，故选福建号。","note":"原填空题改造"},{"id":"ch5-032","chapter":"ch5","type":"single","stem":"（　）是美军第三代核动力航空母舰，是目前全世界最大的航空母舰。","options":["\"福特\"级航空母舰","\"企业\"号航空母舰","\"小鹰\"级航空母舰","\"尼米兹\"级航空母舰"],"answer":0,"exp":"福特级是美军第三代核动力航母，采用电磁弹射并放大舰体，是目前世界上最大的航空母舰；尼米兹级为第二代，企业号更早。","note":"原填空题改造"},{"id":"ch5-033","chapter":"ch5","type":"single","stem":"陆上突击作战平台是指（　）。","options":["步兵战车","自行火炮","主战坦克","装甲输送车"],"answer":2,"exp":"主战坦克集火力、机动力和防护力于一体，直接承担地面突击任务，是陆上突击作战平台；步兵战车、装甲输送车以输送为主。","note":"原填空题改造"},{"id":"ch5-034","chapter":"ch5","type":"single","stem":"（　），是目前世界上唯一覆盖各种类型弹道导弹的陆基弹道导弹系列。","options":["民兵系列导弹","长剑系列导弹","东风系列导弹","白杨系列导弹"],"answer":2,"exp":"东风系列涵盖近程、中程、远程和洲际各类型弹道导弹，型号谱系完整，是目前世界上唯一覆盖各种类型弹道导弹的陆基系列。","note":"原填空题改造"},{"id":"ch5-035","chapter":"ch5","type":"single","stem":"C4KISR系统即（　）系统的简称。","options":["指挥、控制、通信、协同、杀伤、情报、侦察","指挥、控制、计算机、杀伤、情报、监视、侦察","指挥、控制、通信、计算机、情报、监视、侦察","指挥、控制、通信、计算机、杀伤、情报、监视侦察"],"answer":3,"exp":"C4KISR即指挥、控制、通信、计算机、杀伤、情报、监视、侦察的简称，C4指前四项，K为杀伤，ISR为情报、监视、侦察。","note":"原填空题改造"},{"id":"ch5-036","chapter":"ch5","type":"single","stem":"\"战斧\"巡航导弹在航行中采用（　），或采用惯性制导加GPS制导，可以自动调整高度和速度进行攻击。","options":["惯性制导加地形匹配制导和景象匹配","惯性制导加激光制导","地形匹配制导加雷达制导","惯性制导加卫星导航"],"answer":0,"exp":"战斧巡航导弹以惯性制导为基准，用地形匹配修正航迹，末端用景象匹配提高精度，故其制导方式为惯性制导加地形匹配和景象匹配。","note":"原填空题改造"},{"id":"ch5-037","chapter":"ch5","type":"single","stem":"（　）是中国研发的新一代主战坦克，是中国人民解放军陆军地面突击力量的新一代装甲装备，是陆军未来战场的核心力量。","options":["100坦克","99A式坦克","96B式坦克","15式轻型坦克"],"answer":0,"exp":"100坦克是我国研发的新一代主战坦克，是陆军未来战场的核心力量；99A、96B属现役三代坦克，15式为轻型坦克。","note":"原填空题改造"},{"id":"ch5-038","chapter":"ch5","type":"multi","stem":"陆军平台的隐身波段应该覆盖（　）波段。","options":["声","雷达","红外","可见光"],"answer":[0,1,2,3],"exp":"陆军平台隐身需同时覆盖声、雷达、红外和可见光波段，只抑制某一波段仍会被其他探测手段发现，故四个选项全选。"},{"id":"ch5-039","chapter":"ch5","type":"multi","stem":"载人航天器主要包括（　）。","options":["载人飞船","空间站","航天飞机","空天飞机"],"answer":[0,1,2,3],"exp":"载人航天器指能载人飞行或长期驻留的航天器，包括载人飞船、空间站、航天飞机和空天飞机，四类均属载人航天器。"},{"id":"ch5-040","chapter":"ch5","type":"multi","stem":"信息化装备按搭载平台的不同,可分为（　）。","options":["陆上信息化装备","海上信息化装备","空中信息化装备","太空信息化装备"],"answer":[0,1,2,3],"exp":"信息化装备按搭载平台不同，分为陆上、海上、空中和太空信息化装备，四个选项分别对应四类平台，故全部选入。"},{"id":"ch5-041","chapter":"ch5","type":"multi","stem":"电子对抗系统按运载平台主要区分为（　）。","options":["地面电子战系统","舰载电子战系统","机载电子战系统","星载电子战系统"],"answer":[0,1,2,3],"exp":"电子对抗系统按运载平台区分为地面、舰载、机载和星载电子战系统，分别依托陆地、舰艇、飞机和卫星平台遂行电子对抗。"},{"id":"ch5-042","chapter":"ch5","type":"multi","stem":"现代坦克战斗力的衡量指标主要包括（　）。","options":["火力","机动力","防护力","信息力"],"answer":[0,1,2,3],"exp":"现代坦克战斗力由火力、机动力、防护力和信息力共同衡量，信息力是信息化条件下新增的衡量要素，四项均应选。"},{"id":"ch5-043","chapter":"ch5","type":"multi","stem":"“战斧”巡航导弹在航行中采用的制导方式主要包括（　）。","options":["惯性制导","地形匹配制导","景象匹配","GPS制导"],"answer":[0,1,2,3],"exp":"战斧巡航导弹以惯性制导为基准，用地形匹配修正航迹，末段用景象匹配提高精度，也可加装GPS制导，四种方式均被采用。"},{"id":"ch5-044","chapter":"ch5","type":"multi","stem":"信息化装备按杀伤效果的不同,可分（　）。","options":["信息化防御装备","非杀伤性信息化装备","软杀伤性信息化装备","硬杀伤性信息化装备"],"answer":[1,2,3],"exp":"信息化装备按杀伤效果分为非杀伤性、软杀伤性和硬杀伤性三类；信息化防御装备是按用途划分，与题干分类标准不符，故不选。"},{"id":"ch5-045","chapter":"ch5","type":"multi","stem":"信息化装备对现代作战的影响体现在（　）等几个方面。","options":["侦察监视多维立体化","指挥控制快捷高效化","打击方式高速精确化","防护手段全维综合化","力量体系无人智能化"],"answer":[0,1,2,3,4],"exp":"信息化装备使侦察监视多维立体、指挥控制快捷高效、打击高速精确、防护全维综合、力量体系无人智能化，五个选项均属其影响。"},{"id":"ch5-046","chapter":"ch5","type":"multi","stem":"信息化装备的发展趋势体现在（　）等几个方面。","options":["体系化","高速化","隐身化","无人化","智能化"],"answer":[0,1,2,3,4],"exp":"信息化装备正朝体系化、高速化、隐身化、无人化和智能化方向发展，五个选项概括了其主要趋势，故全部选入。"},{"id":"ch5-047","chapter":"ch5","type":"multi","stem":"太空信息化作战平台的主要类型有（　）。","options":["军用卫星","载人航天器","天基武器系统","高超声速导弹"],"answer":[0,1,2],"exp":"太空信息化作战平台包括军用卫星、载人航天器和天基武器系统；高超声速导弹主要在大气层内飞行，不属天基平台，故排除。"},{"id":"ch5-048","chapter":"ch5","type":"judge","stem":"自20世纪80年代以来发生的局部战争，战争持续的时间与精确制导武器的投入量成正比。","options":["正确","错误"],"answer":1,"exp":"精确制导武器投入越多，作战节奏越快、战争持续时间通常越短，二者并非成正比，故题干表述错误。"},{"id":"ch5-049","chapter":"ch5","type":"judge","stem":"军队信息化建设的重点之一是发展信息化武器装备，构建能够打赢信息化战争的信息化武器装备体系。","options":["正确","错误"],"answer":0,"exp":"信息化武器装备体系是军队信息化建设的物质技术基础，需与信息化人才、指挥信息系统建设同步推进，故该表述正确。"},{"id":"ch5-050","chapter":"ch5","type":"judge","stem":"美国人于1917年发明了自行火炮。","options":["正确","错误"],"answer":1,"exp":"自行火炮由火炮与车辆底盘结合而成，其首创者并非美国，题干在发明国别上张冠李戴，故判断为错误。"},{"id":"ch5-051","chapter":"ch5","type":"judge","stem":"作战平台的大型化和重量化是陆上装备的重要发展趋势之一。","options":["正确","错误"],"answer":1,"exp":"陆上作战平台正朝轻量化、小型化、隐身化和高机动方向发展，大型化、重量化与之相反，故错误。"},{"id":"ch5-052","chapter":"ch5","type":"judge","stem":"第一次世界大战时期，人类战争史上第一次使用也是唯一一次使用核武器。","options":["正确","错误"],"answer":1,"exp":"核武器的唯一一次实战使用发生在第二次世界大战末期，题干误作第一次世界大战，时间混淆导致错误。"},{"id":"ch5-053","chapter":"ch5","type":"judge","stem":"潜艇最大的特点是隐蔽性好，这是其他任何兵器无法比拟的。","options":["正确","错误"],"answer":0,"exp":"潜艇可长时间潜航于水下，隐蔽性是其相对水面舰艇和其他兵器的突出优势，故该表述正确。"},{"id":"ch5-054","chapter":"ch5","type":"judge","stem":"次声波是频率在20赫兹以下的波，人类的耳朵可以听到。","options":["正确","错误"],"answer":1,"exp":"次声波频率低于20赫兹，超出人耳听觉范围，人根本无法听到，题干后半句说反，故错误。"},{"id":"ch5-055","chapter":"ch5","type":"judge","stem":"20世纪80年代以来,陆上作战平台进入了信息化时期。","options":["正确","错误"],"answer":0,"exp":"20世纪80年代以来，信息技术广泛物化于坦克、战车等陆上平台，使其迈入信息化时期，故正确。"},{"id":"ch5-056","chapter":"ch5","type":"judge","stem":"美军在总结伊拉克战争的经验时认为，伊拉克战争是人类历史上第一次太空战争。","options":["正确","错误"],"answer":1,"exp":"伊拉克战争中航天力量只起支援保障作用，尚未开辟独立太空战场，称之为第一次太空战争不准确，故错误。"},{"id":"ch5-057","chapter":"ch5","type":"judge","stem":"装在运载体上的设备单独能产生导航信息，称为他备式导航系统。","options":["正确","错误"],"answer":1,"exp":"依靠运载体外部设备提供导航信息的是他备式导航；能单独产生导航信息的属自备式，题干定义颠倒，故错误。"},{"id":"zh-001","chapter":"zh","type":"single","stem":"毛泽东军事思想的核心是：（　）","options":["人民军队思想","人民战争思想","国防建设思想"],"answer":1,"exp":"在毛泽东军事思想体系中，人民战争思想居于核心地位，人民军队思想与国防建设思想都围绕并服务于它，故选此项。"},{"id":"zh-002","chapter":"zh","type":"single","stem":"标志着信息化战争基本形成的是（　）。","options":["海湾战争","科索沃战争","阿富汗战争","伊拉克战争"],"answer":3,"exp":"伊拉克战争中美军基本实现侦察、指挥、打击一体化，被公认为信息化战争基本形成的标志，此前几场战争属过渡形态。"},{"id":"zh-003","chapter":"zh","type":"single","stem":"国防教育的核心是（　）","options":["国防素质教育","爱国主义教育","国防思想教育","国防观念教育"],"answer":1,"exp":"国防教育以爱国主义为核心内容，国防观念、国防素质和国防思想教育都围绕爱国主义展开，故选爱国主义教育。"},{"id":"zh-004","chapter":"zh","type":"single","stem":"中国拥有960万平方公里的陆地疆土，按《联合国海洋法》的规定，还拥有（　）万平方公里的“海洋国土”。","options":["200","250","300","350"],"answer":2,"exp":"按题干所引海洋法规定，我国可主张管辖的海域约300万平方公里，200、250、350万均与通行数据不符。"},{"id":"zh-005","chapter":"zh","type":"single","stem":"中国古代军事思想成熟的标志是（　）","options":["《武经七书》的问世","《孙子兵法》的诞生","《三十六计》的出现"],"answer":1,"exp":"《孙子兵法》构建了较完整的军事理论体系，是中国古代军事思想成熟的标志；《武经七书》系后世汇编，《三十六计》成书更晚。"},{"id":"zh-006","chapter":"zh","type":"single","stem":"“空军制胜论”是由谁提出来的：（　）","options":["马汉","杜黑","富勒"],"answer":1,"exp":"杜黑提出空军制胜论，主张夺取制空权即可决定战争胜负；马汉是海权论者，富勒主张坦克制胜，故排除。"},{"id":"zh-007","chapter":"zh","type":"single","stem":"原子弹的爆炸威力不能超过几十万吨，其原因是：（　）","options":["临界体积的限制","运载工具的限制","制造技术的限制"],"answer":0,"exp":"原子弹靠核装料瞬间链式反应释放能量，装料量受临界体积限制不能无限增加，因而威力有上限，选临界体积。"},{"id":"zh-008","chapter":"zh","type":"single","stem":"杀伤范围广，伤害途径多，持续时间长、具有传染性的武器是（　）","options":["核武器","化学武器","生物武器"],"answer":2,"exp":"生物武器以致病微生物杀伤人畜，具有范围广、途径多、持续久和传染性强的特点；核与化学武器一般不具备传染性。"},{"id":"zh-009","chapter":"zh","type":"single","stem":"新中国国防战略方针经历了四次重大调整，1993年以来确定的战略方针是（　）","options":["积极防御、防敌突袭","应付和打赢局部战争","立足于早打、大打、打核战争","应付和打赢高技术条件下的局部战争"],"answer":3,"exp":"1993年起我国国防战略方针确定为应付和打赢高技术条件下的局部战争，与此前应付一般局部战争的提法相区别。"},{"id":"zh-010","chapter":"zh","type":"single","stem":"“坦克制胜论”是由谁提出来的：（　）","options":["马汉","杜黑","富勒"],"answer":2,"exp":"富勒提出坦克制胜论，强调坦克集群突击的决定作用；马汉主海权、杜黑主空军制胜，故本题选富勒。"},{"id":"zh-011","chapter":"zh","type":"single","stem":"军事领域兴起的“新军事变革”始于（　）","options":["20世纪80年代初","20世纪90年代初","21世纪初"],"answer":1,"exp":"新军事变革以信息技术为核心，公认起始于20世纪90年代初；80年代仅为萌芽，21世纪已进入深入发展阶段。"},{"id":"zh-012","chapter":"zh","type":"single","stem":"我国古代国防理论中的国防建设思想是（　）","options":["富国强兵，寓兵于农","爱国教战，崇尚武德","“以民为体”，“居安思危”"],"answer":0,"exp":"古代国防建设思想主张富国强兵、寓兵于农，把国防建设寓于经济与民众之中；另两项属于国防教育思想范畴。"},{"id":"zh-013","chapter":"zh","type":"single","stem":"解放战争时期，毛泽东创造的北平方式是（　）","options":["和平解决","武力解决","暂时让步"],"answer":0,"exp":"北平方式是兵临城下迫使守军接受改编、和平解放城市，区别于天津的武力方式和绥远的暂时让步方式。"},{"id":"zh-014","chapter":"zh","type":"single","stem":"NMD是（　）的缩写。","options":["国家导弹防御系统","战区导弹防御系统","全球定位系统","安全防卫系统"],"answer":0,"exp":"NMD是国家导弹防御系统的英文缩写，TMD才是战区导弹防御系统，GPS为全球定位系统，注意字母对应。"},{"id":"zh-015","chapter":"zh","type":"single","stem":"诱发局部战争的导火索是：（　）","options":["霸权主义","经济、自然资源的归属和领土边界争端","国家政局动乱"],"answer":1,"exp":"局部战争多由资源归属、领土边界争端等现实利益冲突直接引发；霸权主义是深层根源，不是直接导火索。"},{"id":"zh-016","chapter":"zh","type":"single","stem":"我军政治工作的三大原则是（　）","options":["政治民主、经济民主、军事民主","坚定正确的政治方向、灵活机动的战略战术、艰苦朴素的工作作风","官兵一致、军民一致、瓦解敌军"],"answer":2,"exp":"政治工作三大原则为官兵一致、军民一致、瓦解敌军；政治、经济、军事三大民主属另一概念，不可混淆。"},{"id":"zh-017","chapter":"zh","type":"single","stem":"通常把直接命中概率超过（　）的制导武器称为精确制导武器。","options":["30%","40%","50%","70%"],"answer":2,"exp":"精确制导武器通常以直接命中概率超过50%作为界定标准，30%、40%偏低，70%要求更高，故应选50%。"},{"id":"zh-018","chapter":"zh","type":"single","stem":"射程超过（　）的导弹称为洲际导弹。","options":["1000公里","3000公里","7000公里","8000公里"],"answer":3,"exp":"按通行射程划分，洲际导弹射程须超过8000公里；1000公里为近程，3000公里为中程，7000公里仍未达标。"},{"id":"zh-019","chapter":"zh","type":"single","stem":"中国的国防类型是（　）。","options":["联盟型","中立型","自卫型","扩张型"],"answer":2,"exp":"我国国防坚持防御性立场，不搞扩张、不称霸，属自卫型国防；联盟型、中立型、扩张型均不符合我国实际。"},{"id":"zh-020","chapter":"zh","type":"single","stem":"专属经济区是领海以外并邻接领海的一个区域,其宽度从测算领海宽度的基线量起,不应超过（　）海里。","options":["200","12","24","300"],"answer":0,"exp":"专属经济区自领海基线量起不超过200海里；12海里为领海宽度，24海里为毗连区，各海域界限须区分清楚。"},{"id":"zh-021","chapter":"zh","type":"single","stem":"首次将网络战用于实战的是（　）","options":["海湾战争","科索沃战争","阿富汗战争","伊拉克战争"],"answer":0,"exp":"海湾战争中美军首次大规模运用计算机网络实施指挥控制与信息对抗，被视为网络战登上实战舞台的开端。"},{"id":"zh-022","chapter":"zh","type":"multi","stem":"下列关于南海正确的说法有（　）","options":["南海是中国管辖面积最大的海","南海是我国同东南亚各国交往的重要纽带","南海是我国能源及原材料进口的重要战略通道","南沙群岛是南海诸岛中岛礁最多的一个群岛"],"answer":[0,1,2,3],"exp":"南海是我国管辖面积最大的海，既是与东南亚交往的纽带，也是能源原材料进口的战略通道，南沙群岛岛礁最多，四项皆对。"},{"id":"zh-023","chapter":"zh","type":"judge","stem":"战争与政治的关系是：战争产生政治，战争从属于政治。","options":["正确","错误"],"answer":1,"exp":"战争从属于政治、是政治的继续，政治产生战争而非战争产生政治，题干把因果关系统统颠倒，故错误。"},{"id":"zh-024","chapter":"zh","type":"judge","stem":"《兵役法》第45条规定，高等院校的学生在就学期间，必须接受基本军事训练。","options":["正确","错误"],"answer":0,"exp":"《兵役法》明确高等院校学生在就学期间必须接受基本军事训练，这是大学生履行兵役义务的形式之一，故正确。"},{"id":"zh-025","chapter":"zh","type":"judge","stem":"武器是战争决定的因素，人是重要的因素。","options":["正确","错误"],"answer":1,"exp":"战争胜负中人是决定因素、武器是重要因素，题干将两者地位互换，与毛泽东军事思想原意相悖，故错误。"},{"id":"zh-026","chapter":"zh","type":"judge","stem":"毛泽东军事思想的核心是人民战争思想。","options":["正确","错误"],"answer":0,"exp":"人民战争思想在毛泽东军事思想中处于核心地位，人民军队建设、战略战术原则均以其为灵魂，故表述正确。"},{"id":"zh-027","chapter":"zh","type":"judge","stem":"人类战争的发展经过了冷兵器战争、热兵器战争和信息化战争。","options":["正确","错误"],"answer":1,"exp":"战争形态演进为冷兵器战争、热兵器战争、机械化战争再到信息化战争，题干漏掉机械化战争阶段，故错误。"},{"id":"zh-028","chapter":"zh","type":"judge","stem":"国防是随着国家的产生而产生的。","options":["正确","错误"],"answer":0,"exp":"国防是伴随国家产生而出现的历史范畴，有国家就有国防，题干表述符合国防的基本属性，故正确。"},{"id":"zh-029","chapter":"zh","type":"judge","stem":"所谓国防，是指国家为防备和抵抗外来侵略，制止武装颠覆，保卫国家主权、统一、领土完整和安全所进行的军事活动。","options":["正确","错误"],"answer":1,"exp":"国防除军事活动外，还包括与军事有关的政治、经济、外交、科技、教育等活动，题干仅限军事，缩小了内涵。"},{"id":"zh-030","chapter":"zh","type":"judge","stem":"美国是扩张型国防国家，而我国是中立型国防的国家。","options":["正确","错误"],"answer":1,"exp":"美国属扩张型国防不假，但我国是自卫型国防而非中立型，后半句判断有误，故整句错误。"},{"id":"zh-031","chapter":"zh","type":"judge","stem":"无产阶级战争观和军事问题方法论是毛泽东军事思想的核心。","options":["正确","错误"],"answer":1,"exp":"无产阶级战争观和军事问题方法论是毛泽东军事思想的理论基础，其核心应为人民战争思想，故错误。"},{"id":"zh-032","chapter":"zh","type":"judge","stem":"凡是依靠和动员广大群众进行的战争就是人民战争。","options":["正确","错误"],"answer":1,"exp":"人民战争除动员和依靠群众外，还须有先进阶级政党领导、正义战争性质和正确战略战术，仅看群众参与不够。"},{"id":"zh-033","chapter":"zh","type":"judge","stem":"我国国防是以反对侵略、维护世界和平、保卫国家的安全与发展为根本宗旨。","options":["正确","错误"],"answer":0,"exp":"我国国防以反对侵略、维护世界和平、保卫国家安全与发展为根本宗旨，鲜明体现自卫型国防性质，故正确。"},{"id":"zh-034","chapter":"zh","type":"judge","stem":"国防动员是一种特定的军事实践活动，它不属于战争动员的范畴。","options":["正确","错误"],"answer":1,"exp":"国防动员是战争动员的重要组成部分，属于战争动员范畴，题干称其不属于，割裂了二者关系，故错误。"},{"id":"zh-035","chapter":"zh","type":"judge","stem":"在钓鱼岛上设置海空监侦设备，可增大我海空侦察预警范围，严密掌握美军、日军在琉球群岛及附近海空域活动情况，并可有效封锁琉球群岛诸水道，对美、日前沿基地构成现实威胁。","options":["正确","错误"],"answer":0,"exp":"钓鱼岛地处第一岛链关键位置，设海空监侦设备可前出扩大预警范围并威胁相关水道，故该表述成立。"},{"id":"zh-036","chapter":"zh","type":"judge","stem":"通常大学生入伍几种形式有：作为志愿兵应征入伍；按军官待遇入伍和作为士官应征入伍。","options":["正确","错误"],"answer":1,"exp":"大学生入伍主要有应征服义务兵役、直招士官、考军校或提干等途径，题干所列形式与实际政策不符，故错误。"},{"id":"zh-037","chapter":"zh","type":"judge","stem":"1993年以前我们主要是应付和打赢“现代技术特别是高技术条件下的局部战争”。","options":["正确","错误"],"answer":1,"exp":"1993年以前我国国防战略方针是应付和打赢一般局部战争，高技术条件下的限定是1993年调整后才加入的。"},{"id":"zh-038","chapter":"zh","type":"judge","stem":"国防后备力量主要包括预备役部队、民兵和其他服预备役的人员，以及经过军训的大、中学校的学生。","options":["正确","错误"],"answer":0,"exp":"国防后备力量涵盖预备役部队、民兵和其他服预备役人员，受过军训的大中学生亦在其中，故表述正确。"},{"id":"zh-039","chapter":"zh","type":"judge","stem":"克劳塞维茨（德国）的《战争论》，成为资产阶级军事思想成熟的主要标志。","options":["正确","错误"],"answer":0,"exp":"克劳塞维茨《战争论》系统揭示战争本质与战争和政治的关系，标志资产阶级军事思想走向成熟，故正确。"},{"id":"zh-040","chapter":"zh","type":"judge","stem":"毛泽东军事思想就是毛泽东的军事思想。","options":["正确","错误"],"answer":1,"exp":"毛泽东军事思想是中国共产党集体智慧的结晶，并非毛泽东个人思想的总和，题干缩小了主体范围，故错误。"},{"id":"zh-041","chapter":"zh","type":"judge","stem":"人民军队三大原则是官兵一致、军民一致、优待俘虏。","options":["正确","错误"],"answer":1,"exp":"三大原则的第三条是瓦解敌军，优待俘虏只是瓦解敌军的具体政策之一，题干偷换概念，故判断错误。"},{"id":"zh-042","chapter":"zh","type":"judge","stem":"毛泽东人民战争的基本思想：兵民是胜利之本，战争的伟力之最深厚的根源存在于民众之中。","options":["正确","错误"],"answer":0,"exp":"该论断概括了人民战争的核心：战争的力量源泉存在于民众之中，依靠和动员群众才能夺取胜利，故题干正确。"},{"id":"zh-043","chapter":"zh","type":"judge","stem":"解放战争中毛泽东创造解决敌人的三种方式是：天津方式，华北方式和绥远方式。","options":["正确","错误"],"answer":1,"exp":"三种方式指天津方式、北平方式和绥远方式，题干用“华北方式”替代“北平方式”，所指对象不符，故错误。"},{"id":"zh-044","chapter":"zh","type":"judge","stem":"军事力量是衡量国家国防力量强弱的惟一标准。","options":["正确","错误"],"answer":1,"exp":"国防力量是综合国力的体现，还包括政治、经济、科技、外交和精神等因素，军事力量只是其中重要一项，不是惟一标准。"},{"id":"zh-045","chapter":"zh","type":"judge","stem":"火箭军是中国人民解放军陆基战略导弹部队的代称，是中央军委直接掌握使用的战略部队。","options":["正确","错误"],"answer":0,"exp":"火箭军直属中央军委，是掌握陆基战略导弹等核常力量、直接用于战略打击的部队，题干对其定位的表述正确。"},{"id":"zh-046","chapter":"zh","type":"judge","stem":"从古以来，没有不带政治性质的战争。","options":["正确","错误"],"answer":0,"exp":"战争是政治的继续，任何战争都为一定政治目的服务，不存在脱离政治性质的战争，故题干判断正确。"},{"id":"zh-047","chapter":"zh","type":"judge","stem":"根据国家相关政策，当年年满17周岁，未满18岁的男性高中（含中专、职高、技校）毕业生，本人自愿的也可以参加兵役登记。","options":["正确","错误"],"answer":0,"exp":"兵役登记以年满十八周岁的男性公民为主体，当年满十七周岁未满十八周岁且本人自愿的高中毕业生可提前登记，故正确。"},{"id":"zh-048","chapter":"zh","type":"judge","stem":"东风系列导弹，是目前世界上唯一覆盖各种类型弹道导弹的陆基弹道导弹系列。","options":["正确","错误"],"answer":0,"exp":"东风系列均为陆基发射，涵盖近程、中程、远程和洲际等类型，核常兼备，是覆盖类型最全的陆基弹道导弹系列，故正确。"},{"id":"zh-049","chapter":"zh","type":"single","stem":"党在新形势下的强军目标是建设一支（　）的人民军队。","options":["政治合格、军事过硬、作风优良、纪律严明","革命化、现代化、正规化","听党指挥、能打胜仗、纪律严明","听党指挥、能打胜仗、作风优良"],"answer":3,"exp":"强军目标是听党指挥、能打胜仗、作风优良；革命化、现代化、正规化是军队建设总目标，两者表述不同，不能混淆。","note":"原填空题改造"},{"id":"zh-050","chapter":"zh","type":"single","stem":"中国人民解放军现役部队由陆军、海军、空军、火箭军以及（　）组成。","options":["战略支援部队和联勤保障部队","陆军航空兵、空降兵和海军陆战队","军事航天部队、网络空间部队和战略支援部队","军事航天部队、网络空间部队、信息支援部队和联勤保障部队"],"answer":3,"exp":"现行体制为四大军种加四大兵种，即军事航天部队、网络空间部队、信息支援部队和联勤保障部队，战略支援部队已不再单列。","note":"原填空题改造"},{"id":"zh-051","chapter":"zh","type":"single","stem":"《中华人民共和国兵役法》第4条规定，中华人民共和国的武装力量由（　）组成。","options":["中国人民解放军、中国人民武装警察部队和民兵","现役部队、预备役部队和民兵","陆军、海军、空军、火箭军","中国人民解放军、中国人民武装警察部队和预备役部队"],"answer":0,"exp":"兵役法规定武装力量由中国人民解放军、中国人民武装警察部队和民兵构成；预备役部队属解放军序列，不能与民兵并列。","note":"原填空题改造"},{"id":"zh-052","chapter":"zh","type":"single","stem":"我国政府解决台湾问题的方针是（　）。","options":["和平统一、武力解决","一个国家、两种制度、放弃使用武力","一国两制、维持现状","一国两制、和平统一，但决不承诺放弃使用武力"],"answer":3,"exp":"对台方针是“和平统一、一国两制”，同时决不承诺放弃使用武力，这一手针对的是外部干涉和分裂势力，而非台湾同胞。","note":"原填空题改造"},{"id":"zh-053","chapter":"zh","type":"single","stem":"我国领土最南端在南海的南沙群岛中的（　）。","options":["黄岩岛","永暑礁","太平岛","曾母暗沙"],"answer":3,"exp":"我国领土最南端是南沙群岛的曾母暗沙，黄岩岛、永暑礁、太平岛均位于其北，不能作为最南端点，故选曾母暗沙。","note":"原填空题改造"},{"id":"zh-054","chapter":"zh","type":"single","stem":"孙子兵法中提出的战争最高境界是（　）。","options":["攻其无备，出其不意","不战而屈人之兵","以正合，以奇胜","知己知彼，百战不殆"],"answer":1,"exp":"孙子主张“上兵伐谋”，以谋略使敌屈服而保全双方，故“不战而屈人之兵”高于“以正合，以奇胜”等具体战法。","note":"原填空题改造"},{"id":"zh-055","chapter":"zh","type":"single","stem":"人民战争的两个基本属性是（　）。","options":["战争的群众性和战争的正义性","战争的残酷性和战争的持久性","战争的局部性和战争的全局性","战争的进攻性和战争的防御性"],"answer":0,"exp":"人民战争以广大民众为主体、以正义战争为前提，群众性和正义性是其两个基本属性，其余选项并非其固有属性。","note":"原填空题改造"},{"id":"zh-056","chapter":"zh","type":"single","stem":"2013年11月23日，中国政府宣布划设（　）。","options":["中华人民共和国黄海防空识别区","中华人民共和国台湾海峡防空识别区","中华人民共和国南海防空识别区","中华人民共和国东海防空识别区"],"answer":3,"exp":"我国划设的是东海防空识别区，属为防范空中威胁而设的预警识别空域，并非禁飞区，也不等于专属经济区。","note":"原填空题改造"},{"id":"zh-057","chapter":"zh","type":"single","stem":"十二届全国人大常委会第七次会议决定，将12月13日设立为（　）。","options":["国家安全教育日","南京大屠杀死难者国家公祭日","中国人民抗日战争胜利纪念日","烈士纪念日"],"answer":1,"exp":"该日纪念南京大屠杀死难同胞，设立的是国家公祭日；国家安全教育日、抗战胜利纪念日、烈士纪念日各有不同日期，不可混淆。","note":"原填空题改造"},{"id":"zh-058","chapter":"zh","type":"single","stem":"（　）是我军区别于其他任何军队的本质特征。","options":["政治工作制度","党对军队的绝对领导","全心全意为人民服务","高度的组织纪律性"],"answer":1,"exp":"党对军队的绝对领导是我军的军魂，是区别于其他任何军队的本质特征；全心全意为人民服务是宗旨，政治工作制度是保证。","note":"原填空题改造"},{"id":"zh-059","chapter":"zh","type":"single","stem":"我国边界线总长4万多公里，其中陆地边界线长约（　）万公里。","options":["4","2.2","1.8","3"],"answer":1,"exp":"我国陆地边界约2.2万公里，海岸线约1.8万公里，两者合计才是4万多公里，故不能把边界总长当作陆地边界长度。","note":"原填空题改造"},{"id":"zh-060","chapter":"zh","type":"single","stem":"2005年3月14日，第十届全国人民代表大会第三次会议通过（　），为解决台湾问题提供了法律依据。","options":["《国防法》","《国家安全法》","《兵役法》","《反分裂国家法》"],"answer":3,"exp":"该法以宪法为依据，明确一个中国原则、反对“台独”分裂和促进统一的法律措施，为处理台湾问题提供了法律依据。","note":"原填空题改造"},{"id":"zh-061","chapter":"zh","type":"single","stem":"当今世界面临的两大根本问题是（　）。","options":["和平与发展","战争与革命","霸权主义与恐怖主义","合作与竞争"],"answer":0,"exp":"和平与发展是当今世界的两大根本问题即时代主题；霸权主义、恐怖主义是威胁和平的因素，本身不是根本问题。","note":"原填空题改造"},{"id":"zh-062","chapter":"zh","type":"single","stem":"1961年4月12日，前苏联宇航员（　）乘坐\"东方\"号宇宙飞船进入太空，成为世界上进入太空的第一人。","options":["季托夫","加加林","阿姆斯特朗","格列奇科"],"answer":1,"exp":"加加林乘“东方”号飞船首次进入太空；季托夫是其后进入太空的宇航员，阿姆斯特朗是美国登月第一人，均与题干不符。","note":"原填空题改造"},{"id":"zh-063","chapter":"zh","type":"single","stem":"我国宇航员杨利伟乘坐\"神舟\"号载人飞船进入太空，使我国成为世界上第（　）个实现载人航天的国家。","options":["三","二","四","五"],"answer":0,"exp":"杨利伟乘“神舟”号飞船进入太空，使我国成为世界上第三个自主实现载人航天的国家，此前仅有少数国家掌握该技术。","note":"原填空题改造"},{"id":"zh-064","chapter":"zh","type":"single","stem":"《联合国海洋法公约》规定，领海的最大宽度为（　）海里。","options":["12","300","200","24"],"answer":0,"exp":"公约规定领海宽度从基线量起不超过12海里；24海里为毗连区、200海里为专属经济区，三者性质不同，不能混淆。","note":"原填空题改造"},{"id":"zh-065","chapter":"zh","type":"single","stem":"现在世界上公认的战争法有（　）。","options":["《海牙公约》《不扩散核武器条约》和《日内瓦公约》","《联合国宪章》《海牙公约》和《日内瓦议定书》","《日内瓦公约》《维也纳外交关系公约》和《海牙公约》","《海牙公约》《日内瓦议定书》和《日内瓦公约》"],"answer":3,"exp":"战争法主要由海牙公约体系和日内瓦公约体系构成，前者规范作战手段与方法，后者保护战争受难者，另含日内瓦议定书。","note":"原填空题改造"},{"id":"zh-066","chapter":"zh","type":"single","stem":"1951年的（　）把日本所窃取的钓鱼岛等岛屿归在由美国托管的琉球管辖区内，中国政府坚决不予承认。","options":["《开罗宣言》","《雅尔塔协定》","《旧金山和约》","《波茨坦公告》"],"answer":2,"exp":"1951年《旧金山和约》把钓鱼岛等岛屿划入美国托管的琉球辖区，中国政府始终不予承认，故其不能作为归属依据。","note":"原填空题改造"},{"id":"zt-001","chapter":"zt","type":"judge","stem":"台湾问题事关国家主权和领土完整，是中国国家核心利益所在。","options":["正确","错误"],"answer":0,"exp":"台湾是中国领土不可分割的一部分，涉台问题直接关系国家主权与领土完整，因而属于核心利益，不容外部干涉，故正确。"},{"id":"zt-002","chapter":"zt","type":"judge","stem":"无人作战平台已成为世界各国争相研制的\"热点\"兵器，成为信息化武器装备发展的一个方向。","options":["正确","错误"],"answer":0,"exp":"无人作战平台能减少人员伤亡、降低使用成本，已成为各国竞相研制的热点兵器和信息化装备的发展方向，故正确。"},{"id":"zt-003","chapter":"zt","type":"judge","stem":"战争实践证明，在具备一定的客观物质基础之上，军事思想正确与否决定战争胜负。","options":["正确","错误"],"answer":0,"exp":"战争胜负取决于客观物质条件与主观指导，在具备一定物质基础后，军事思想正确与否对胜负起决定作用，故正确。"},{"id":"zt-004","chapter":"zt","type":"judge","stem":"当今世界，意识形态领域看不见硝烟的战争无处不在，政治领域没有枪炮的较量一直未停。","options":["正确","错误"],"answer":0,"exp":"意识形态和政治领域的较量虽无硝烟枪炮，却始终存在并关系国家安危，题干以“看不见硝烟的战争”作比，判断正确。"},{"id":"zt-005","chapter":"zt","type":"judge","stem":"国防政策有其鲜明的阶级性，不同的国家有不同的国防政策。","options":["正确","错误"],"answer":0,"exp":"国防政策由国家的社会制度和根本利益决定，具有鲜明的阶级性，不同国家的国防政策自然不同，故题干正确。"},{"id":"zt-006","chapter":"zt","type":"judge","stem":"美国是扩张型国家，而我国是中立型国防的国家。","options":["正确","错误"],"answer":1,"exp":"我国奉行防御性国防政策，属自卫型而非中立型；美国才是扩张型国家，题干把我国定为中立型，故错误。"},{"id":"zt-007","chapter":"zt","type":"judge","stem":"根据国家相关政策，当年年满17周岁，未满18岁的男性高中（含中专、职高、技校）毕业生，本人自愿的也可以参加兵役登记。","options":["正确","错误"],"answer":0,"exp":"当年年满十七周岁、未满十八周岁的男性高中毕业生，本人自愿可以参加兵役登记，这属于提前登记的政策安排，故正确。"},{"id":"zt-008","chapter":"zt","type":"judge","stem":"信息化战争是伴随着计算机的产生而产生，伴随着计算机的发展而不断发展的。","options":["正确","错误"],"answer":0,"exp":"信息化战争以信息技术特别是计算机技术为物质基础，随计算机的产生而产生、发展而发展，故题干判断正确。"},{"id":"zt-009","chapter":"zt","type":"judge","stem":"国防动员是一种特定的军事实践活动，它不属于战争动员的范畴。","options":["正确","错误"],"answer":1,"exp":"国防动员本质上是战争动员，是战争动员在国防领域的展开，两者并非互不相属，故题干说“不属于”是错误的。"},{"id":"zt-010","chapter":"zt","type":"judge","stem":"我们将来要打的信息化战争，也一定是人民战争基础上的信息化战争。","options":["正确","错误"],"answer":0,"exp":"未来信息化战争仍要依靠人民群众的支援和参与，人民战争思想并未过时，故应是人民战争基础上的信息化战争。"},{"id":"zt-011","chapter":"zt","type":"single","stem":"（　）的制定是新中国成立以来我国国防领域最重要的立法活动。","options":["《中华人民共和国兵役法》","《中华人民共和国国防法》","《中华人民共和国国防动员法》","《中华人民共和国国防教育法》"],"answer":1,"exp":"《国防法》是国防领域的基本法律，其制定被视为新中国成立以来国防领域最重要的立法活动，其余几部属专门法律。"},{"id":"zt-012","chapter":"zt","type":"single","stem":"化学武器大规模使用始于（　）。","options":["第一次世界大战","第二次世界大战","美侵朝战争","美侵越战争"],"answer":0,"exp":"化学武器在第一次世界大战中首次大规模用于战场，造成大量伤亡，此后才逐步形成禁止化学武器的国际规则。"},{"id":"zt-013","chapter":"zt","type":"single","stem":"我军政治工作的三大原则是（　）。","options":["政治民主、经济民主、军事民主","坚定正确的政治方向、灵活机动的战略战术、艰苦朴素的工作作风","官兵一致、军民一致、瓦解敌军"],"answer":2,"exp":"官兵一致、军民一致、瓦解敌军是我军政治工作三大原则；政治民主、经济民主、军事民主是三大民主，二者不可混淆。"},{"id":"zt-014","chapter":"zt","type":"single","stem":"中国古代军事思想成熟的标志是（　）。","options":["《武经七书》的问世","《孙子兵法》的诞生","《三十六计》的出现"],"answer":1,"exp":"《孙子兵法》系统提出重战、慎战、全胜等思想，标志中国古代军事思想成熟；《武经七书》是后世汇编，晚于孙子。"},{"id":"zt-015","chapter":"zt","type":"single","stem":"（　）是毛泽东军事思想的核心内容。","options":["人民战争思想","积极防御","运动战","游击战"],"answer":0,"exp":"人民战争思想是毛泽东军事思想的核心，积极防御是战略方针，运动战、游击战是作战形式，都不能与其并列为“核心”。"},{"id":"zt-016","chapter":"zt","type":"single","stem":"（　）成为信息化装备全面走上战争舞台的标志。","options":["海湾战争","利比亚战争","伊拉克战争","叙利亚战争"],"answer":0,"exp":"海湾战争大量使用精确制导武器和电子战手段，被视为信息化装备全面走上战争舞台的标志，故不选其他几场战争。"},{"id":"zt-017","chapter":"zt","type":"single","stem":"射程超过（　）公里的导弹称为洲际导弹。","options":["1000","3000","7000","8000"],"answer":3,"exp":"按射程划分，射程超过8000公里的导弹称洲际导弹；1000公里左右为近程、3000公里左右为中程，7000公里未达标准。"},{"id":"zt-018","chapter":"zt","type":"single","stem":"诱发局部战争的导火索是（　）。","options":["霸权主义","经济、自然资源的归属和领土边界争端","国家政局动乱"],"answer":1,"exp":"局部战争多由资源归属、领土边界争端等现实利益矛盾直接引发；霸权主义是深层根源，二者层次不同，故不选前者。"},{"id":"zt-019","chapter":"zt","type":"multi","stem":"战争的特点主要有（　）。","options":["政治性","暴力性","有限性","可控性"],"answer":[0,1],"exp":"战争本质上是政治的继续，并以暴力手段达成目的，政治性和暴力性是其基本特点；有限性、可控性只适用于特定战争。"},{"id":"zt-020","chapter":"zt","type":"multi","stem":"第五代超声速战斗机的代表机型有（　）。","options":["F-22","歼-20","苏-57","B-2"],"answer":[0,1,2],"exp":"第五代战斗机具备隐身、超声速巡航等特征，代表机型有F-22、歼-20和苏-57；B-2是隐身战略轰炸机，不属战斗机。"},{"id":"zt-021","chapter":"zt","type":"single","stem":"（　）是中国自行研制的全球卫星导航定位与通信系统，是继美国的GPS和俄罗斯的GLONASS之后第三个成熟的卫星导航定位系统。","options":["伽利略卫星导航系统","天链中继卫星系统","格洛纳斯卫星导航系统","北斗卫星导航系统"],"answer":3,"exp":"北斗是我国自主研制的全球卫星导航定位与通信系统，是继美国GPS、俄罗斯GLONASS之后第三个成熟的同类系统；天链属中继卫星。","note":"原填空题改造"},{"id":"zt-022","chapter":"zt","type":"single","stem":"目前，我军现役部队主要由四大军种和四大兵种组成，其中军种包括陆军、海军、空军和（　）。","options":["火箭军","联勤保障部队","军事航天部队","战略支援部队"],"answer":0,"exp":"我军四大军种为陆军、海军、空军和火箭军；联勤保障部队及军事航天、网络空间、信息支援部队均属兵种，故不选。","note":"原填空题改造"},{"id":"zt-023","chapter":"zt","type":"single","stem":"2013年11月，我国宣布在东海划设（　）。","options":["东海禁飞区","东海专属经济区","东海防空识别区","东海警戒区"],"answer":2,"exp":"我国划设的是东海防空识别区，用于对进入该空域的航空器识别查证；禁飞区、专属经济区、警戒区含义各别，不能替代。","note":"原填空题改造"},{"id":"zt-024","chapter":"zt","type":"single","stem":"随着\"信息化\"最终取代\"机械化\"的主导地位，战争将由平台为中心转向以（　）为中心。","options":["体系","信息","网络","数据"],"answer":0,"exp":"信息化战争以体系对抗为基本形态，作战重心由平台中心转向体系中心；信息、网络、数据是支撑要素，而非重心所在。","note":"原填空题改造"},{"id":"zt-025","chapter":"zt","type":"single","stem":"孙子兵法的最高境界是（　）。","options":["不战而屈人之兵","兵贵胜，不贵久","攻其无备，出其不意","知己知彼，百战不殆"],"answer":0,"exp":"“不战而屈人之兵”讲以谋略和威慑使敌屈服，实现“全胜”，是孙子推崇的最高用兵境界，其余选项属具体作战原则。","note":"原填空题改造"},{"id":"ch1-108","chapter":"ch1","type":"single","stem":"我们要实现中华民族伟大复兴，必须坚持（　）的统一，努力建设（　）。","options":["经济建设和国防建设、建设世界一流军队","富国和强军、巩固国防和强大军队","军民融合和科技强军、巩固国防和强大军队","富国和强军、实现国防和军队现代化"],"answer":1,"exp":"教材表述为坚持富国和强军相统一，建设巩固国防和强大军队。经济建设与国防建设协调、建设世界一流军队等提法虽常见，但不是本题的固定搭配。","note":"原填空题改造"},{"id":"ch1-109","chapter":"ch1","type":"single","stem":"中国人民解放军诞生于1927年8月1日。初创时期，称（　）；1928年5月以后，陆续改称（　）；抗日战争时期，主力红军和南方八省红军游击队分别改编为（　）和（　）；解放战争时期，统一改称中国人民解放军。","options":["中国工农红军、中国工农革命军、八路军、新四军","中国工农革命军、中国工农红军、八路军、东北抗日联军","中国工农革命军、中国工农红军、新四军、八路军","中国工农革命军、中国工农红军、八路军、新四军"],"answer":3,"exp":"1927年建军时称中国工农革命军，1928年5月后改称中国工农红军；抗战中主力红军改编为八路军，南方八省游击队改编为新四军，故顺序不能颠倒。","note":"原填空题改造"},{"id":"ch1-110","chapter":"ch1","type":"single","stem":"（　）是国防活动的重要内容之一，是准备和实施战争的重要措施，直接关系到国家安危、民族存亡和战争进程与结局。","options":["国防立法","国防教育","国防动员","国防科技工业"],"answer":2,"exp":"国防动员是把国防潜力转化为国防实力、准备和实施战争的重要措施；国防教育、国防立法、国防科技工业虽同属国防活动，但不直接对应这一表述。","note":"原填空题改造"},{"id":"ch1-111","chapter":"ch1","type":"single","stem":"（　）是中国共产党军事战略思想的基本点。","options":["持久战战略思想","联合作战战略思想","人民战争战略思想","积极防御战略思想"],"answer":3,"exp":"积极防御战略思想是中国共产党军事战略思想的基本点；人民战争思想是根本，持久战是特定条件下的方针，联合作战是作战形式。","note":"原填空题改造"},{"id":"ch1-112","chapter":"ch1","type":"single","stem":"中国武装力量受（　）领导。","options":["全国人民代表大会","国务院","中国共产党","中国人民政治协商会议"],"answer":2,"exp":"党对军队绝对领导是我军的根本原则，中国武装力量受中国共产党领导；国务院、全国人大、政协都不是武装力量的领导主体。","note":"原填空题改造"},{"id":"ch1-113","chapter":"ch1","type":"single","stem":"中国武装力量属于（　）。","options":["政府","全体公民","国家","人民"],"answer":3,"exp":"宪法规定中华人民共和国武装力量属于人民，这体现人民军队的根本性质；国家、政府、全体公民的表述都不准确。","note":"原填空题改造"},{"id":"ch1-114","chapter":"ch1","type":"single","stem":"（　）、（　）是中华人民共和国每一个公民的神圣职责。","options":["保卫祖国、抵抗侵略","保卫祖国、维护统一","巩固国防、抵抗侵略","建设国防、维护和平"],"answer":0,"exp":"宪法第五十五条规定，保卫祖国、抵抗侵略是中华人民共和国每一个公民的神圣职责，两个空的表述与顺序都是固定的。","note":"原填空题改造"},{"id":"ch1-115","chapter":"ch1","type":"single","stem":"防空警报可分为：（　）、（　）和（　）三种。","options":["预先警报、空袭警报、紧急警报","预先警报、战斗警报、解除警报","预警警报、空袭警报、解除警报","预先警报、空袭警报、解除警报"],"answer":3,"exp":"我国防空警报按敌情发展分为预先警报、空袭警报和解除警报三种，分别对应敌机可能来袭、临空和威胁解除。紧急警报、战斗警报、预警警报都不是规范的三类划分。","note":"原填空题改造"},{"id":"ch1-116","chapter":"ch1","type":"single","stem":"中国人民解放军由现役部队和（　）部队组成。其中现役部队由陆军、海军、空军、（　）、（　）和（　）组成。","options":["预备役、火箭军、战略支援部队、武警部队","预备役、第二炮兵、战略支援部队、中央军委联勤保障部队","民兵、火箭军、战略支援部队、中央军委联勤保障部队","预备役、火箭军、战略支援部队、中央军委联勤保障部队"],"answer":3,"exp":"我军由现役部队和预备役部队组成，现役部队含陆、海、空、火箭军、战略支援部队和中央军委联勤保障部队。武警、民兵不在现役序列，第二炮兵已改编为火箭军。","note":"原填空题改造"},{"id":"ch1-117","chapter":"ch1","type":"single","stem":"美国的武装力量由（　）、（　）和（　）三部分组成。","options":["现役部队、海岸警卫队、文职人员","现役部队、后备役部队、文职人员","陆军、海军、空军","现役部队、国民警卫队、文职人员"],"answer":1,"exp":"美国武装力量由现役部队、后备役部队和文职人员三部分组成，这是其文民治军体制的体现。海岸警卫队、国民警卫队属另行列编力量，陆海空军只是现役军种。","note":"原填空题改造"},{"id":"ch1-118","chapter":"ch1","type":"single","stem":"日本有（　）、（　）和（　）三个军种，目前总兵力（　）。","options":["陆上自卫队、海上自卫队、航空自卫队、22.7万","陆上自卫队、海上自卫队、航空自卫队、24.7万","陆上自卫队、海上自卫队、航空自卫队、28.7万","陆上自卫队、海上自卫队、航空自卫队、26.7万"],"answer":1,"exp":"日本自卫队分陆上、海上、航空三个军种，现役总兵力约24.7万人。其余选项军种正确但兵力数字偏离实际规模，日本受宪法与预算约束，兵力长期维持在这一量级。","note":"原填空题改造"},{"id":"ch1-119","chapter":"ch1","type":"single","stem":"国防教育是指国家为巩固和加强国防而对公民进行的（　）。其教育的核心是（　）。","options":["普及性教育、爱国主义","普及性教育、革命英雄主义","经常性教育、爱国主义","普及性教育、国防观念"],"answer":0,"exp":"国防教育是国家对公民进行的普及性教育，面向全体社会成员；其核心是爱国主义，用以凝聚国防意志。革命英雄主义、国防观念是教育内容之一，但都不是核心。","note":"原填空题改造"},{"id":"ch1-120","chapter":"ch1","type":"single","stem":"2014年2月27日，十二届全国人大常委会第七次会议经表决通过，决定将9月3日确定为（　），将12月13日设立为（　）。","options":["中国人民抗日战争胜利纪念日、南京大屠杀纪念日","中国人民抗日战争胜利纪念日、台湾光复纪念日","中国人民抗日战争胜利纪念日、全民国防教育日","中国人民抗日战争胜利纪念日、烈士纪念日"],"answer":0,"exp":"全国人大常委会将9月3日确定为中国人民抗日战争胜利纪念日，12月13日设立为南京大屠杀纪念日。烈士纪念日、台湾光复纪念日、全民国防教育日均另有其日。","note":"原填空题改造"},{"id":"ch1-121","chapter":"ch1","type":"single","stem":"国防基本类型有四种：扩张型、自卫型、（　）和（　）。","options":["中立型、联盟型","中立型、依附型","独立型、联盟型","中立型、集团型"],"answer":0,"exp":"国防按性质分为扩张型、自卫型、中立型和联盟型四种，划分依据是国防政策的目标与结盟状态。依附型、独立型、集团型都不是教材采用的标准类型名称。","note":"原填空题改造"},{"id":"ch1-122","chapter":"ch1","type":"single","stem":"国防精神主要内容有爱国主义精神、民族尚武精神和革命英雄主义精神，它具有（　）和（　）两大特征。","options":["储备、防御","储备、进攻","凝聚、防御","激励、防御"],"answer":0,"exp":"国防精神平时蓄积于民众之中、战时转化为战斗力，具有储备特征；其作用指向抵御外侮，具有防御特征。进攻、凝聚、激励都不是与国防精神对应的规范表述。","note":"原填空题改造"},{"id":"ch1-123","chapter":"ch1","type":"single","stem":"我国实行（　）、（　）的兵役制度。","options":["义务兵与士官相结合、民兵与预备役相结合","志愿兵和合同兵相结合、民兵与预备役相结合","义务兵和志愿兵相结合、现役与预备役相结合","义务兵和志愿兵相结合、民兵与预备役相结合"],"answer":3,"exp":"我国兵役制度是义务兵与志愿兵相结合、民兵与预备役相结合的“两个结合”。现役与预备役相结合、义务兵与士官相结合等提法混淆了制度层次，不是规范表述。","note":"原填空题改造"},{"id":"ch1-124","chapter":"ch1","type":"single","stem":"坚持（　）是中国人民解放军的根本原则；（　）是人民解放军的唯一宗旨。","options":["中国共产党的绝对领导权、全心全意为人民谋利益","中国共产党的集体领导、全心全意为人民服务","中国共产党的绝对领导权、捍卫国家领土完整","中国共产党的绝对领导权、全心全意为人民服务"],"answer":3,"exp":"党对军队的绝对领导是我军根本原则，全心全意为人民服务是唯一宗旨，二者由我军性质决定。集体领导、谋利益、捍卫领土完整等表述或改换概念，或降低宗旨层次。","note":"原填空题改造"},{"id":"ch1-125","chapter":"ch1","type":"single","stem":"（　）是国家生存和发展的安全保障。","options":["国防","经济","科技","外交"],"answer":0,"exp":"国防是国家为防备和抵抗侵略、保卫主权和领土完整而进行的军事活动，是国家生存发展的安全保障；外交、经济、科技虽关系国家利益，但不承担这一保障职能。","note":"原填空题改造"},{"id":"ch1-126","chapter":"ch1","type":"single","stem":"宪法规定，（　）、（　）是中华人民共和国每一个公民的神圣职责。","options":["参军参战、支援前线","保卫祖国、抵抗侵略","保卫祖国、建设祖国","抵抗侵略、维护和平"],"answer":1,"exp":"宪法规定保卫祖国、抵抗侵略是每个公民的神圣职责；建设祖国、维护和平、参军参战等虽见于其他表述，但不是宪法对该职责的原文界定。","note":"原填空题改造"},{"id":"ch1-127","chapter":"ch1","type":"single","stem":"新军事革命的本质与核心是实现军队和武器装备的（　）。","options":["信息化","数字化","机械化","智能化"],"answer":0,"exp":"新军事革命的本质与核心是实现军队和武器装备的信息化，以信息技术主导战斗力生成；机械化是此前形态，智能化是后续方向，数字化只是技术表现。","note":"原填空题改造"},{"id":"ch1-128","chapter":"ch1","type":"single","stem":"国防精神的主要内容有（　）精神、（　）精神和（　）精神。","options":["爱国主义、民族尚武、国际主义","爱国主义、艰苦奋斗、革命英雄主义","集体主义、民族尚武、革命英雄主义","爱国主义、民族尚武、革命英雄主义"],"answer":3,"exp":"国防精神主要包括爱国主义精神、民族尚武精神和革命英雄主义精神；国际主义、集体主义、艰苦奋斗虽是倡导品质，但不属国防精神三项主要内容。","note":"原填空题改造"},{"id":"ch1-129","chapter":"ch1","type":"single","stem":"我国原七大军区主要有北京、沈阳、济南、南京军区、兰州、广州和成都，其中南京军区包含的五省一市主要是（　）、（　）、（　）、（　）、（　）和上海市。","options":["江苏、浙江、安徽、山东、福建","辽宁、吉林、黑龙江、山东、河北","江苏、浙江、安徽、江西、福建","湖北、湖南、广东、广西、海南"],"answer":2,"exp":"原南京军区辖江苏、浙江、安徽、江西、福建五省和上海市；山东属济南军区，两湖两广海南属广州军区，东北三省与河北属沈阳军区。","note":"原填空题改造"},{"id":"ch1-130","chapter":"ch1","type":"single","stem":"国防精神主要内容有（　）精神、（　）精神和（　）精神，它具有（　）和（　）两大特征。","options":["爱国主义、艰苦奋斗、革命英雄主义、储备、防卫","爱国主义、民族尚武、革命英雄主义、储备、防卫","爱国主义、民族尚武、革命英雄主义、储备、防御","爱国主义、民族尚武、国际主义、储备、防卫"],"answer":1,"exp":"国防精神的主要内容是爱国主义、民族尚武和革命英雄主义精神，其特征为储备性和防卫性；防御、国际主义、艰苦奋斗与教材两项特征和三项内容不符。","note":"原填空题改造"},{"id":"ch1-131","chapter":"ch1","type":"single","stem":"中国人民解放军海军由（　）、水面舰艇部队、（　）、海军岸防兵部队和海军陆战队等兵种组成。","options":["鱼雷艇部队、海军航空兵部队","潜艇部队、海军雷达部队","潜艇部队、海军航空兵部队","潜艇部队、海军轰炸机部队"],"answer":2,"exp":"海军由潜艇部队、水面舰艇部队、海军航空兵部队、岸防兵部队和陆战队等兵种组成；轰炸机部队、鱼雷艇部队、雷达部队或已撤销，或只是兵种内的部分力量。","note":"原填空题改造"},{"id":"ch1-132","chapter":"ch1","type":"single","stem":"我国实行（　）与（　）相结合、（　）与（　）相结合的兵役制度。","options":["义务兵、志愿兵、民兵、预备役","义务兵、合同兵、民兵、预备役","志愿兵、士官、民兵、预备役","义务兵、志愿兵、民兵、常备军"],"answer":0,"exp":"我国实行义务兵与志愿兵相结合、民兵与预备役相结合的兵役制度；合同兵、士官、常备军等表述不符合兵役法的规范提法。","note":"原填空题改造"},{"id":"ch1-133","chapter":"ch1","type":"single","stem":"防空袭的方法主要有（　）、（　）和（　）。","options":["疏散防护、消除空袭后果、对空射击","伪装欺骗、机动转移、对空射击","隐蔽防护、疏散防护、伪装欺骗","消除空袭后果、隐蔽防护、疏散防护"],"answer":3,"exp":"防空袭通常采取消除空袭后果、隐蔽防护和疏散防护三种方法；伪装欺骗、机动转移、对空射击是具体战术动作，不属于这一分类。","note":"原填空题改造"},{"id":"ch1-134","chapter":"ch1","type":"single","stem":"我国近代史上中国人民反抗帝国主义侵略的五次战争是：（　）、（　）、（　）、（　）、（　）。","options":["鸦片战争、第二次鸦片战争、中法战争、中日甲午战争、抗击八国联军","第二次鸦片战争、中法战争、中日甲午战争、抗击八国联军、收复新疆","鸦片战争、中法战争、中日甲午战争、抗击八国联军、抗日战争","鸦片战争、第二次鸦片战争、中法战争、中日甲午战争、抗日战争"],"answer":0,"exp":"近代中国人民反抗帝国主义侵略的五次战争依次是鸦片战争、第二次鸦片战争、中法战争、中日甲午战争和抗击八国联军；抗日战争、收复新疆不在其列。","note":"原填空题改造"},{"id":"ch1-135","chapter":"ch1","type":"single","stem":"在2015年9月3日举行的纪念中国人民抗日战争暨世界反法西斯战争胜利70周年纪念大会上，中国国家主席习近平宣布：中国将裁军（　）万。这是中国继2003年裁军（　）万后再次作出的裁军决定，也是中国国家领导人首次在阅兵场合宣布裁军。","options":["30、20","30、15","20、30","50、20"],"answer":0,"exp":"2015年纪念抗战胜利70周年阅兵时宣布裁军30万，2003年裁军20万，故两空依次为30、20；数字颠倒或换成其他数额均与史实不符。","note":"原填空题改造"},{"id":"ch1-136","chapter":"ch1","type":"single","stem":"按照军委管总、战区主战、军种主建的总原则，我军的军兵种包括（　）、战略支援部队和（　）。","options":["陆军、海军、空军、火箭军、预备役部队","陆军、海军、空军、火箭军、联勤保障部队","陆军、海军、空军、炮兵、联勤保障部队","陆军、海军、空军、第二炮兵、联勤保障部队"],"answer":1,"exp":"我军军兵种包括陆军、海军、空军、火箭军、战略支援部队和联勤保障部队；炮兵、第二炮兵是旧称谓，预备役部队不属现役军兵种序列。","note":"原填空题改造"},{"id":"ch1-137","chapter":"ch1","type":"single","stem":"（　）是国防强大的基础。","options":["政治开明","军事科技发展","军队人才培养","经济发展"],"answer":3,"exp":"国防的强大最终取决于经济实力，经济发展为军队建设、武器装备和战争消耗提供物质基础，政治开明、科技发展和人才培养都建立在经济基础之上。"},{"id":"ch1-138","chapter":"ch1","type":"single","stem":"中日甲午战争结束后，清政府被迫与日本签订了（　）。","options":["《天津条约》","《辛丑条约》","《马关条约》","《北京条约》"],"answer":2,"exp":"甲午战败后清政府于1895年被迫签订《马关条约》，割让台湾、澎湖并赔款二亿两；《天津条约》《北京条约》签于第二次鸦片战争，《辛丑条约》签于1901年。"},{"id":"ch1-139","chapter":"ch1","type":"single","stem":"（　）是中国共产党最早建立和领导的武装力量，是人民解放军的基础。","options":["陆军","海军","空军","火箭军"],"answer":0,"exp":"1927年南昌起义后党领导的人民军队以陆军为主体起步，陆军先于海军、空军、火箭军建立，是党最早缔造和领导的武装力量，也是解放军的基础。"},{"id":"ch1-140","chapter":"ch1","type":"single","stem":"我国古代军队最早可以追溯到（　）朝时期。","options":["夏","商","周","秦"],"answer":0,"exp":"夏朝已出现常备武装和车兵，是我国古代军队的最早形态，商、周在夏朝基础上发展完善，秦代军制更晚，故最早可追溯到夏朝。"},{"id":"ch1-141","chapter":"ch1","type":"single","stem":"美军在全球设有（　）个区域型的战区司令部，（　）个功能型的职能司令部。","options":["6 5","5 6","7 4","4 7"],"answer":0,"exp":"美军现设6个地区性战区司令部和5个职能性司令部，前者按地理区域划分，后者按战略、特种作战、运输、网络、太空等职能划分。"},{"id":"ch1-142","chapter":"ch1","type":"single","stem":"听党指挥是（　），决定军队建设的政治方向。","options":["核心","保证","灵魂","关键"],"answer":2,"exp":"听党指挥是强军之魂，解决的是军队听谁指挥、为谁服务的根本政治方向问题，故称灵魂；能打胜仗是核心，作风优良是保证。"},{"id":"ch1-143","chapter":"ch1","type":"single","stem":"能打胜仗是（　），反映军队的根本职能和军队建设的根本指向。","options":["核心","保证","灵魂","关键"],"answer":0,"exp":"能打胜仗是强军之要，聚焦军队根本职能和战斗力标准，是军队建设的核心指向；听党指挥为灵魂，作风优良为保证。"},{"id":"ch1-144","chapter":"ch1","type":"single","stem":"党的十九大报告明确提出，确保到二〇二〇年我军基本实现机械化，信息化建设取得重大进展，力争到（　）年基本实现国防和军队现代化。","options":["二〇二五","二〇三五","二〇四五","二〇五〇"],"answer":1,"exp":"党的十九大报告提出国防和军队现代化三步走目标，2020年基本实现机械化，2035年基本实现国防和军队现代化，本世纪中叶建成世界一流军队。"},{"id":"ch1-145","chapter":"ch1","type":"single","stem":"原南京军区包含五省一市，以下不属于原南京军区的省（市）有（　）。","options":["山东","江西","安徽","福建"],"answer":0,"exp":"原南京军区辖江苏、浙江、安徽、福建、江西五省和上海一市，山东当时属济南军区，故不属于原南京军区的是山东。"},{"id":"ch1-146","chapter":"ch1","type":"single","stem":"（　）是国防巩固的根本。","options":["经济发展","人民幸福","政治昌明","国家统一和民族团结"],"answer":2,"exp":"经济发展是国防强大的基础，政治昌明是国防巩固的根本，国家统一和民族团结是国防坚强的关键，故此题应选政治昌明。"},{"id":"ch1-147","chapter":"ch1","type":"single","stem":"军队现代化是指（　）。","options":["军事理论现代化","军队组织形态现代化","军事人员现代化","武器装备现代化"],"answer":1,"exp":"军队现代化涵盖军事理论、组织形态、军事人员和武器装备四个方面，其中组织形态现代化是制度性标志，决定军队的编成结构与运行方式，故选此项。"},{"id":"ch1-148","chapter":"ch1","type":"single","stem":"（　）是人民军队性质和宗旨不变的根本保证。","options":["中国共产党的绝对领导","紧密联系群众","党支部建在连上","坚持政治工作民主制"],"answer":0,"exp":"党对军队的绝对领导是我军的建军之本、强军之魂，只有坚持党的领导，才能保持人民军队的性质和全心全意为人民服务的宗旨不变。"},{"id":"ch1-149","chapter":"ch1","type":"multi","stem":"中国军队坚持（　）的安全观。","options":["共同","综合","合作","可持续"],"answer":[0,1,2,3],"exp":"中国倡导共同、综合、合作、可持续的安全观，四者分别对应安全主体、安全领域、实现路径和长远目标，构成完整体系，故四项全选。"},{"id":"ch1-150","chapter":"ch1","type":"multi","stem":"大学生作为义务兵应征入伍享有以下优惠政策（　）","options":["优先报名应征","优先体检政考","优先审批定兵","优先分配去向"],"answer":[1,2],"exp":"优先体检政考、优先审批定兵是大学生应征入伍的专项优待；报名应征是全体应征青年的共同程序，去向由部队按需确定，不属于专项优惠，故选B、C。"},{"id":"ch1-151","chapter":"ch1","type":"judge","stem":"我国国防领导体制的一个基本特征，就是强调中国共产党在国防领导中的决定性地位和作用。","options":["正确","错误"],"answer":0,"exp":"我国国防领导体制坚持党对军队的绝对领导，党中央、中央军委集中统一领导国防和军队建设，中国共产党的领导地位和作用是决定性、根本性的，故判对。"},{"id":"ch1-152","chapter":"ch1","type":"judge","stem":"2004年，制定新形势下军事战略方针，将军事斗争准备基点放到打赢信息化局部战争上，以海上方向军事斗争为战略重心。","options":["正确","错误"],"answer":1,"exp":"错在名称与动作：1993年确立新时期军事战略方针，2004年是充实完善，基点放到打赢信息化条件下的局部战争，说2004年制定新形势下方针不准确。"},{"id":"ch1-153","chapter":"ch1","type":"judge","stem":"民兵是进行人民战争的战略力量。","options":["正确","错误"],"answer":0,"exp":"民兵是我国武装力量的重要组成部分，人数多、分布广，既可配合军队作战又能独立遂行任务，是进行人民战争的重要战略力量，故判对。"},{"id":"ch1-154","chapter":"ch1","type":"judge","stem":"中国人民解放军预备役部队由党中央、中央军委集中统一领导。","options":["正确","错误"],"answer":0,"exp":"2020年起预备役部队全面纳入军队领导指挥体系，由党中央、中央军委集中统一领导，这是党管武装的重要体现，故该判断正确。"},{"id":"ch1-155","chapter":"ch1","type":"judge","stem":"兵役法就是国家关于公民参加军事组织并承担军事任务的法律。","options":["正确","错误"],"answer":1,"exp":"错。兵役法是国家关于公民参加武装组织、承担军事任务或接受军事训练的法律，题干漏掉接受军事训练等内容，定义不完整。"},{"id":"ch1-156","chapter":"ch1","type":"judge","stem":"信息化武器装备将成为军队作战能力的关键因素。","options":["正确","错误"],"answer":0,"exp":"武器装备是军队战斗力的物质基础，信息化武器装备能大幅提升侦察、指挥、打击和保障效能，因而成为衡量军队作战能力的关键因素。"},{"id":"ch1-157","chapter":"ch1","type":"judge","stem":"国防教育具有全民性、长期性和综合性等特点。","options":["正确","错误"],"answer":0,"exp":"国防教育面向全体公民，须经常持久地开展，并涉及军事、政治、经济、科技、法律等多方面内容，因而具有全民性、长期性和综合性。"},{"id":"ch1-158","chapter":"ch1","type":"judge","stem":"根据《国防法》的规定，公民有对国防建设提出建议的权利。","options":["正确","错误"],"answer":0,"exp":"国防法规定公民享有对国防建设提出建议的权利，也有对危害国防的行为进行制止、检举的权利，体现国防事业的全民参与，表述正确。"},{"id":"ch1-159","chapter":"ch1","type":"judge","stem":"公民在国防活动中经济损失不在国家赔偿范围内。","options":["正确","错误"],"answer":1,"exp":"国防法规定公民和组织因国防建设、军事活动遭受经济损失的，国家依法给予补偿，合法权益受法律保护，故不在赔偿范围的说法错误。"},{"id":"ch1-160","chapter":"ch1","type":"judge","stem":"国防法规是调整国防和武装力量建设领域各种社会关系的法律规范的总和，是国家法律体系的重要组成部分，是加强国防和武装力量建设的基本依据。","options":["正确","错误"],"answer":0,"exp":"国防法规调整国防和武装力量建设领域的各种社会关系，是国家法律体系的组成部分，为加强国防和军队建设提供基本法律依据，表述正确。"},{"id":"ch1-161","chapter":"ch1","type":"judge","stem":"火箭军是中央军委直接掌握使用的战略部队，是中国实施战略威慑的核心力量。","options":["正确","错误"],"answer":0,"exp":"火箭军由中央军委直接掌握使用，担负常规导弹和核导弹作战任务，是国家战略威慑的核心力量，也是维护国家安全的重要基石，表述正确。"},{"id":"ch2-001","chapter":"ch2","type":"single","stem":"（　）是国泰民安的基本保障，也是安邦治国的头等大事。","options":["经济发展","国防建设","国家安全","社会稳定"],"answer":2,"exp":"国家安全是国泰民安的基本保障，也是安邦治国的头等大事；经济发展、社会稳定、国防建设虽然重要，但定位不同。","note":"原填空题改造"},{"id":"ch2-002","chapter":"ch2","type":"single","stem":"当前我国国家安全（　）比历史上任何时候都要丰富，（　）比历史上任何时候都要宽广，（　）比历史上任何时候都要复杂，必须坚持总体国家安全观，走中国特色国家安全道路。","options":["内容、范围、内外因素","内涵、外延、内外形势","内涵、外延、内外因素","内涵、外延、内外环境"],"answer":2,"exp":"总体国家安全观强调国家安全内涵比历史上任何时候都要丰富、外延都要宽广、内外因素都要复杂，三层表述依次对应，不能替换。","note":"原填空题改造"},{"id":"ch2-003","chapter":"ch2","type":"single","stem":"2013年11月，党的十八届三中全会决定，设立（　），完善国家安全体制和国家安全战略，确保国家安全。","options":["国家安全委员会","国家国防动员委员会","中央外事工作委员会","中央政法委员会"],"answer":0,"exp":"十八届三中全会决定设立国家安全委员会，以完善国家安全体制和国家安全战略；政法委员会、国防动员委员会、外事工作委员会均为其他职能机构。","note":"原填空题改造"},{"id":"ch2-004","chapter":"ch2","type":"single","stem":"2014年4月15日，习近平总书记在中央国家安全委员会第一次全体会议上强调，要准确把握国家安全形势变化新特点新趋势，坚持（　），走出一条（　）。","options":["新安全观、中国特色国家安全道路","总体国家安全观、和平发展道路","总体国家安全观、中国特色国家安全道路","总体国家安全观、中国特色强军之路"],"answer":2,"exp":"习近平总书记要求坚持总体国家安全观，走出一条中国特色国家安全道路；新安全观、和平发展道路、强军之路都不是这一完整表述。","note":"原填空题改造"},{"id":"ch2-005","chapter":"ch2","type":"single","stem":"2015年7月1日，全国人大常委会审议通过《国家安全法》，明确规定每年（　）月（　）日为全民国家安全教育日。","options":["9、18","4、15","3、15","5、12"],"answer":1,"exp":"《国家安全法》规定每年4月15日为全民国家安全教育日；3月15日是消费者权益日，5月12日是防灾减灾日，9月18日多用于防空警报试鸣。","note":"原填空题改造"},{"id":"ch2-006","chapter":"ch2","type":"single","stem":"现代意义上的“国家安全”概念，最早出现于美国专栏作家沃尔特·李普曼1943年出版的《（　）》一书中。","options":["冷战","公众哲学","舆论","美国对外政策"],"answer":3,"exp":"李普曼1943年在《美国对外政策》一书中提出国家安全概念；《舆论》《冷战》《公众哲学》也是他的著作，但年代与主题不符。","note":"原填空题改造"},{"id":"ch2-007","chapter":"ch2","type":"single","stem":"（　）是做好国安工作的根本原则。","options":["坚持党对国家安全工作的指导","坚持以人民安全为宗旨","坚持统筹发展和安全","坚持国家利益至上"],"answer":0,"exp":"坚持党对国家安全工作的指导是做好国安工作的根本原则；国家利益至上是最高的准则，人民安全是宗旨，统筹发展和安全是重要方法。","note":"原填空题改造"},{"id":"ch2-008","chapter":"ch2","type":"single","stem":"（　）是维护国家安全必须坚持的最高准则。","options":["人民利益至上","民族利益至上","集体利益至上","国家利益至上"],"answer":3,"exp":"维护国家安全必须以国家利益为最高准则，即国家利益至上；人民、民族、集体利益需要统筹，但都不构成这一最高准则的表述。","note":"原填空题改造"},{"id":"ch2-009","chapter":"ch2","type":"single","stem":"国家利益一般按（　）、（　）和（　）进行分类，以此作为维护国家安全的重要依据。","options":["核心利益、一般利益、重要利益","根本利益、重要利益、一般利益","重要利益、核心利益、一般利益","核心利益、重要利益、一般利益"],"answer":3,"exp":"国家利益通常按重要程度分为核心利益、重要利益和一般利益三类，由重到轻排列，是维护国家安全的重要依据。","note":"原填空题改造"},{"id":"ch2-010","chapter":"ch2","type":"single","stem":"进入新时代，我们要把（　）作为维护国家安全的战略重点。","options":["维护国家主权和领土完整","防范化解重大安全风险","维护战略机遇期稳定","维护周边和平稳定"],"answer":2,"exp":"进入新时代，维护战略机遇期稳定被作为维护国家安全的战略重点；主权领土完整、周边稳定、风险防范都是重要任务，但定位不同。","note":"原填空题改造"},{"id":"ch2-011","chapter":"ch2","type":"single","stem":"2015年7月，全国人大修订颁布《（　）》，将总体国家安全观的原则要求以法律的形式加以明确和固定下来。","options":["网络安全法","国家安全法","反间谍法","国防法"],"answer":1,"exp":"2015年7月全国人大修订颁布《国家安全法》，把总体国家安全观的原则要求法律化；反间谍法、国防法、网络安全法的立法时间与主旨不同。","note":"原填空题改造"},{"id":"ch2-012","chapter":"ch2","type":"single","stem":"（　）是社会历史的创造者，是推动社会变革的决定力量，也是国家安全的根基所在。","options":["英雄人物","杰出领袖","社会精英","人民群众"],"answer":3,"exp":"人民群众是社会历史的创造者、推动社会变革的决定力量，也是国家安全的根基；英雄、精英、领袖的作用都离不开人民群众。","note":"原填空题改造"},{"id":"ch2-013","chapter":"ch2","type":"single","stem":"（　）是指国家主权、政权、政治制度、意识形态等方面免受各种威胁和危害的状态，是国家安全的重心和根本，事关党和国家的长治久安、前途命运。","options":["经济安全","军事安全","文化安全","政治安全"],"answer":3,"exp":"政治安全指国家主权、政权、政治制度和意识形态免受威胁，是国家安全的重心和根本；经济、军事、文化安全各有侧重，不居于这一地位。","note":"原填空题改造"},{"id":"ch2-014","chapter":"ch2","type":"single","stem":"对我国而言，政治安全最为核心的内容是（　）的巩固和（　）的稳定。","options":["党的执政地位、国家政治制度","党的领导地位、国家政治秩序","党的执政地位、国家政治秩序","党的执政基础、社会政治秩序"],"answer":2,"exp":"政治安全最核心的是党的执政地位的巩固和国家政治秩序的稳定，二者分别对应执政主体与政治运行秩序，其余搭配不准确。","note":"原填空题改造"},{"id":"ch2-015","chapter":"ch2","type":"single","stem":"“四种考验”是指（　）考验、（　）考验、（　）考验、（　）考验等。","options":["执政、改革开放、市场经济、外部环境","改革开放、执政、市场经济、外部环境","执政、改革开放、外部环境、市场经济","执政、市场经济、改革开放、外部环境"],"answer":0,"exp":"四种考验的固定表述是执政考验、改革开放考验、市场经济考验、外部环境考验，顺序体现从党内到国内再到国际的层次。","note":"原填空题改造"},{"id":"ch2-016","chapter":"ch2","type":"single","stem":"（　）的实质是外部势力通过各种手段在有关国家进行各领域渗透、培植政治反对派并鼓励其利用社会矛盾推翻现政权的一种政治颠覆活动。","options":["民主输出","和平演变","颜色革命","街头政治"],"answer":2,"exp":"颜色革命指外部势力渗透、培植政治反对派并借社会矛盾推翻现政权；和平演变是冷战时期的长期战略，民主输出侧重制度移植，街头政治只是手段。","note":"原填空题改造"},{"id":"ch2-017","chapter":"ch2","type":"single","stem":"随着空间技术的不断发展，（　）已成为国际战略竞争的制高点。","options":["海洋","极地","太空","网络空间"],"answer":2,"exp":"随着空间技术的发展，太空成为国际战略竞争的制高点；海洋、网络空间、极地同为战略空间，但题干限定的是空间技术领域。","note":"原填空题改造"},{"id":"ch2-018","chapter":"ch2","type":"single","stem":"南海共有（　）、（　）、（　）、（　）等四个群岛。","options":["西沙群岛、东沙群岛、中沙群岛、澎湖列岛","西沙群岛、东沙群岛、南沙群岛、琉球群岛","西沙群岛、中沙群岛、南沙群岛、纳土纳群岛","西沙群岛、东沙群岛、中沙群岛、南沙群岛"],"answer":3,"exp":"南海四大群岛是西沙、东沙、中沙、南沙；澎湖列岛位于台湾海峡，琉球群岛属东海，纳土纳群岛属印度尼西亚，均非南海四群岛。","note":"原填空题改造"},{"id":"ch2-019","chapter":"ch2","type":"single","stem":"我国在有关南海问题上一贯坚持（　）、（　）、（　）原则，主张有关争议的当事方通过双边直接对话，协商解决问题。","options":["主权属我、和平协商、共同开发","搁置争议、共同开发、航行自由","主权属我、搁置争议、多边解决","主权属我、搁置争议、共同开发"],"answer":3,"exp":"我国在南海问题上坚持主权属我、搁置争议、共同开发，主张当事方通过双边直接对话解决争议；多边解决等提法不符合这一原则。","note":"原填空题改造"},{"id":"ch2-020","chapter":"ch2","type":"single","stem":"以“藏独”和“东突”为代表的（　）、（　）和（　）等三股恶势力打着所谓“民族自决”和“宗教自由”的招牌，频繁活动，严重威胁我国安全与地区稳定。","options":["民族分裂势力、暴力恐怖势力、宗教极端势力","民族分离势力、暴力恐怖势力、宗教极端势力","民族分裂势力、宗教极端势力、暴力恐怖势力","民族分裂势力、暴力恐怖势力、极端民族势力"],"answer":0,"exp":"三股恶势力指民族分裂势力、暴力恐怖势力、宗教极端势力；原答案中的“民主分裂势力”系扫描识别有误，应为“民族分裂势力”。","note":"原填空题改造"},{"id":"ch2-021","chapter":"ch2","type":"single","stem":"特朗普新的（　）实际上延续了美国安全战略的传统以及奥巴马时期（　）的精髓，是（　）和（　）的继续。","options":["印太战略、再平衡、冷战思维、零和博弈","印太战略、再平衡、强权政治、零和博弈","亚太战略、再平衡、冷战思维、零和博弈","印太战略、再平衡、冷战思维、霸权主义"],"answer":0,"exp":"特朗普的印太战略延续美国安全战略传统，承接奥巴马时期亚太再平衡的精髓，本质是冷战思维和零和博弈的继续。","note":"原填空题改造"},{"id":"ch2-022","chapter":"ch2","type":"single","stem":"2017年初以来，美国新一届特朗普政府在（　）口号下，实行单边主义、保护主义和霸权主义，扰乱了全球秩序。","options":["美国优先","全球领导","民主改造","重返亚太"],"answer":0,"exp":"2017年以来特朗普政府打着美国优先旗号推行单边主义、保护主义和霸权主义；重返亚太是奥巴马时期提法，全球领导、民主改造语境不同。","note":"原填空题改造"},{"id":"ch2-023","chapter":"ch2","type":"single","stem":"（　）在全球范围的回潮势头明显，导致各种全球性挑战凸显、治理需求倍增。","options":["保护主义思潮","单边主义思潮","民粹思潮","逆全球化思潮"],"answer":2,"exp":"题干描述的是民粹思潮全球回潮带来的治理困境；逆全球化、保护主义、单边主义是相伴而生的政策表现，不是这一思潮本身。","note":"原填空题改造"},{"id":"ch2-024","chapter":"ch2","type":"single","stem":"2018年5月9日，普京第（　）次当选俄罗斯总统，继续实施维护俄罗斯国家利益的（　）战略。","options":["三、现实遏制","四、现实威慑","四、现实遏制","四、积极防御"],"answer":2,"exp":"普京2018年5月第四次当选俄罗斯总统，继续实施维护俄国家利益的现实遏制战略；三次、积极防御、现实威慑均与史实或俄战略表述不符。","note":"原填空题改造"},{"id":"ch2-025","chapter":"ch2","type":"single","stem":"安倍政府推动“新安保法案”的实施，意味着日本（　）的安保政策发生重大变化，也使日本主动卷入战争的可能性增加。","options":["解禁集体自卫","修改和平宪法","扩充军备规模","放弃专守防卫"],"answer":0,"exp":"新安保法案的核心是解禁集体自卫权，使日本可在盟友受攻击时出兵海外，安保政策随之重大转变。修改和平宪法、扩充军备等并非该法案的直接内容。","note":"原填空题改造"},{"id":"ch2-026","chapter":"ch2","type":"single","stem":"（　）、（　）、（　）是印度国家战略长期追求的总目标。","options":["称霸南亚、控制印度洋、争当世界一流强国","称霸南亚、控制太平洋、争当世界一流强国","称霸东南亚、控制印度洋、争当地区军事强国","控制印度洋、称霸东亚、争当世界一流强国"],"answer":0,"exp":"印度长期把称霸南亚、控制印度洋、争当世界一流强国作为国家战略总目标，三者由近及远、层层递进。其余选项各改动其中一项，与印度官方战略表述不符。","note":"原填空题改造"},{"id":"ch2-027","chapter":"ch2","type":"single","stem":"我国领土最北端在黑龙江省（　）以北的黑龙江主航道的中心线上；我国领土最南端在南海的南沙群岛中的（　）；我国领土最东端在（　）与（　）主航道中心线的相交处；我国领土最西端在新疆的（　）上。","options":["漠河、西沙群岛、黑龙江、乌苏里江、帕米尔高原","漠河、曾母暗沙、松花江、乌苏里江、帕米尔高原","漠河、曾母暗沙、黑龙江、乌苏里江、帕米尔高原","黑河、曾母暗沙、黑龙江、乌苏里江、帕米尔高原"],"answer":2,"exp":"我国最北端在漠河以北黑龙江主航道中心线，最南端为曾母暗沙，最东端是黑龙江与乌苏里江主航道相交处，最西端在帕米尔高原。黑河、西沙群岛、松花江均不符四至。","note":"原填空题改造"},{"id":"ch2-028","chapter":"ch2","type":"single","stem":"国家主权主要包括国家的独立权、（　）、平等权和自卫权。","options":["统治权","管辖权","外交权","领土权"],"answer":1,"exp":"国家主权包括独立权、管辖权、平等权和自卫权四项基本权利，管辖权指国家对领土内人和事的管辖。统治权、领土权、外交权都不是与前三项并列的主权权能表述。","note":"原填空题改造"},{"id":"ch2-029","chapter":"ch2","type":"single","stem":"我国边界线总长4万多公里，其中陆地边界线长（　）公里，海岸边界线总长度超过（　）公里；我国陆地面积为960万平方公里，海洋面积为（　）平方公里。","options":["2.2万、3.2万、300万","2.2万、1.8万、360万","2.2万、1.8万、300万","1.8万、2.2万、300万"],"answer":2,"exp":"我国陆地边界约2.2万公里，大陆海岸线约1.8万公里，主张管辖海域面积约300万平方公里。其余选项或颠倒陆海边界数字，或夸大海洋面积，均与实际不符。","note":"原填空题改造"},{"id":"ch2-030","chapter":"ch2","type":"single","stem":"国际安全面临四个方面的威胁：领土争端和资源争夺；（　）；跨国性问题和（　）。","options":["民族矛盾和宗教纷争、恐怖主义活动","意识形态对抗、恐怖主义活动","民族矛盾和宗教纷争、霸权主义威胁","民族矛盾和宗教纷争、军备竞赛活动"],"answer":0,"exp":"国际安全四大威胁是领土争端和资源争夺、民族矛盾和宗教纷争、跨国性问题、恐怖主义活动。霸权主义、意识形态对抗、军备竞赛虽也属安全挑战，但不在这一四分法之内。","note":"原填空题改造"},{"id":"ch2-031","chapter":"ch2","type":"single","stem":"2016年3月29日，日本正式开始实施（　）的新安保法案。","options":["解禁集体自卫权","修改和平宪法","扩大自卫队规模","强化日美同盟"],"answer":0,"exp":"该法案核心是解禁集体自卫权，使日本可有限行使集体自卫权；修改和平宪法、扩大自卫队规模、强化日美同盟只是相关动向，不是法案的实质内容。","note":"原填空题改造"},{"id":"ch2-032","chapter":"ch2","type":"single","stem":"（　）是影响国家安全的基本因素之一，也是制定国家安全战略的重要依据。","options":["军事力量","国际形势","地缘环境","综合国力"],"answer":2,"exp":"地缘环境指国家所处地理位置及周边条件，直接关系威胁判断和战略制定，是影响国家安全的基本因素；综合国力、军事力量、国际形势不特指这一地理条件。","note":"原填空题改造"},{"id":"ch2-033","chapter":"ch2","type":"single","stem":"（　），是做好国家安全工作的根本原则。","options":["坚持以人民安全为宗旨","坚持统筹发展和安全","坚持党对国家安全工作的领导","坚持总体国家安全观"],"answer":2,"exp":"党的领导是国家安全工作的根本原则，由党的执政地位决定；总体国家安全观是根本遵循，以人民安全为宗旨、统筹发展和安全是重要要求，均非题干所指根本原则。","note":"原填空题改造"},{"id":"ch2-034","chapter":"ch2","type":"single","stem":"美国新一届拜登政府在（　）口号下，继续实行单边主义、保护主义和霸权主义，扰乱了全球秩序。","options":["印太战略","美国回来了","美国优先","民主国家联盟"],"answer":2,"exp":"题干所指口号是美国优先，其单边主义、保护主义和霸权主义做法延续了霸权逻辑；美国回来了、印太战略、民主国家联盟是拜登政府其他外交表述。","note":"原填空题改造"},{"id":"ch2-035","chapter":"ch2","type":"single","stem":"新冠肺炎疫情发生后，习近平提出要把（　）纳入国家安全体系。","options":["公共卫生安全","生物安全","食品安全","生态安全"],"answer":1,"exp":"新冠肺炎疫情发生后，习近平提出把生物安全纳入国家安全体系，明确其是国家安全重要组成部分；公共卫生、生态、食品安全不属该表述的原文内容。","note":"原填空题改造"},{"id":"ch2-036","chapter":"ch2","type":"single","stem":"2014年2月27日，十二届全国人大常委会第七次会议经表决通过，决定将（　）确定为中国人民抗日战争胜利纪念日，将（　）设立为南京大屠杀死难者国家公祭日。","options":["9月3日、12月13日","9月3日、9月18日","9月2日、12月12日","8月15日、12月13日"],"answer":0,"exp":"全国人大常委会决定以9月3日为抗战胜利纪念日、12月13日为南京大屠杀死难者国家公祭日；8月15日是日本宣布投降日，9月18日是九一八事变日。","note":"原填空题改造"},{"id":"ch2-037","chapter":"ch2","type":"single","stem":"新安全观的核心主要有（　）、（　）、（　）和（　）。","options":["互信、互利、平等、协商","互信、互利、平等、协作","对话、互利、平等、协作","互信、互助、平等、协作"],"answer":1,"exp":"中国倡导的新安全观核心是互信、互利、平等、协作，强调通过对话合作实现共同安全；协商、互助、对话等词虽相近，但不属新安全观四要素。","note":"原填空题改造"},{"id":"ch2-038","chapter":"ch2","type":"single","stem":"国家主权主要包括国家的（　）、（　）、（　）和（　）。","options":["独立权、管辖权、平等权、交战权","独立权、管辖权、平等权、自卫权","主权、管辖权、平等权、自卫权","独立权、治理权、平等权、自卫权"],"answer":1,"exp":"国家主权主要包括独立权、管辖权、平等权和自卫权；交战权、治理权或属主权派生的具体权利，或不是主权四项基本内容的规范表述。","note":"原填空题改造"},{"id":"ch2-039","chapter":"ch2","type":"single","stem":"我国边界线总长（　），其中陆地边界线长（　），海岸边界线总长度超过（　）；我国陆地面积为（　），海洋面积为（　）。","options":["4万多公里、2.2万公里、1.8万公里、960万平方公里、300万平方公里","4万多公里、2.2万公里、1.8万公里、960万平方公里、470万平方公里","5万多公里、2.2万公里、1.8万公里、960万平方公里、300万平方公里","4万多公里、2.2万公里、3.2万公里、960万平方公里、300万平方公里"],"answer":0,"exp":"我国边界线总长约4万多公里，陆地边界约2.2万公里，海岸线超过1.8万公里，陆地面积960万平方公里，海洋面积300万平方公里；其余选项数字有误。","note":"原填空题改造"},{"id":"ch2-040","chapter":"ch2","type":"single","stem":"自1949年中华人民共和国成立以来，我军曾先后进行的自卫反击战有：（　）；1969年中苏边界珍宝岛自卫反击战；1974年西沙自卫反击战；1979年中越边境自卫还击战。","options":["1965年援越抗美作战","1958年炮击金门作战","1962年中印边界自卫反击战","1950年抗美援朝战争"],"answer":2,"exp":"新中国成立后首次自卫反击战是1962年中印边界自卫反击战，与1969年珍宝岛、1974年西沙、1979年中越战事并列；抗美援朝、援越抗美不属此类。","note":"原填空题改造"},{"id":"ch2-041","chapter":"ch2","type":"single","stem":"《中华人民共和国（　）和（　）法》规定，我国的（　）为领海以外依陆地领土的全部（　），扩展到大陆外边缘的海底区域的海床和底土。","options":["专属经济区、大陆架、大陆架、自然延伸","领海、大陆架、大陆架、自然延伸","专属经济区、大陆架、毗连区、历史性权利","领海、毗连区、专属经济区、自然延伸"],"answer":0,"exp":"《专属经济区和大陆架法》规定，我国的大陆架为领海以外依陆地领土的全部自然延伸；领海、毗连区、历史性权利不是该条的定义用语。","note":"原填空题改造"},{"id":"ch2-042","chapter":"ch2","type":"single","stem":"我国大陆濒临的海洋自北而南为（　）、（　）、（　）、（　）四个海域。与我国隔海相望的是日本、菲律宾、文莱、马来西亚、印度尼西亚等国家。","options":["渤海、东海、黄海、南海","黄海、东海、渤海、南海","黄海、渤海、东海、南海","渤海、黄海、东海、南海"],"answer":3,"exp":"我国大陆濒临的海域自北而南依次是渤海、黄海、东海、南海；其余选项把黄海与渤海或东海、南海的先后顺序颠倒，不符合自北而南的排列。","note":"原填空题改造"},{"id":"ch2-043","chapter":"ch2","type":"single","stem":"1895年4月，通过《马关条约》，钓鱼岛被割让给日本，并更名为（　）。抗战胜利后，日本将钓鱼岛同冲绳一起让美军占领并托管。1971年6月17日，日美签订（　）时，把钓鱼岛列岛交给了日本。1996年7月14日，日本青年社在钓鱼岛新设置了灯塔，造成了对钓鱼岛的实际控制。","options":["“琉球群岛”、“日美行政协定”","“尖阁群岛”、“归还冲绳协定”","“尖阁列岛”、“旧金山和约”","“鱼钓岛”、“日美安全保障条约”"],"answer":1,"exp":"1895年《马关条约》后日本将钓鱼岛改称“尖阁群岛”，1971年日美签订“归还冲绳协定”时将其随冲绳交给日本；旧金山和约等与题干时间节点不符。","note":"原填空题改造"},{"id":"ch2-044","chapter":"ch2","type":"single","stem":"2012年7月24日，三沙市人民政府在西沙群岛永兴岛正式挂牌成立。三沙市下辖西沙群岛、南沙群岛、中沙群岛的岛礁及其海域，其岛屿面积13平方千米，海域面积（　）平方千米，是中国陆地面积最小、总面积最大、人口最少的城市。","options":["160多万","260多万","120多万","210多万"],"answer":3,"exp":"三沙市岛屿面积13平方千米，海域面积约210多万平方千米，是我国陆地面积最小、总面积最大的城市；其他数字与教材表述不符。","note":"原填空题改造"},{"id":"ch2-045","chapter":"ch2","type":"single","stem":"国家利益通常可分为（　）。","options":["重要利益、核心利益和一般利益","政治利益、经济利益和军事利益","生存利益、发展利益和安全利益","国家利益、集体利益和个人利益"],"answer":0,"exp":"教材把国家利益分为重要利益、核心利益和一般利益三类；政治、经济、军事利益按领域划分，生存、发展、安全利益按内容划分，均非题干分类。","note":"原填空题改造"},{"id":"ch2-046","chapter":"ch2","type":"single","stem":"2015年以来，日本全力推动“新安保法案”的实施，意味着日本（　）的安保政策发生重大变化，也使日本主动卷入战争的可能性增加。","options":["“专守防卫”","“集体自卫”","“积极和平主义”","“日美同盟”"],"answer":0,"exp":"新安保法案解禁集体自卫权、放宽武器使用限制，意味着日本长期坚持的“专守防卫”政策发生重大变化；积极和平主义、日美同盟不是被突破的政策名称。","note":"原填空题改造"},{"id":"ch2-047","chapter":"ch2","type":"single","stem":"对我国而言，政治安全最为核心的内容是（　）。","options":["社会主义意识形态安全和执政思想基础的稳固","国家政治制度、政权体系和法治秩序的稳固","中国共产党执政地位的巩固和国家政治秩序的稳定","国家主权独立、领土完整和海洋权益的维护"],"answer":2,"exp":"政治安全最核心的内容是中国共产党执政地位的巩固和国家政治秩序的稳定；主权领土、意识形态、政治制度等表述虽属政治安全，但不是“最核心”的完整表述。","note":"原填空题改造"},{"id":"ch2-048","chapter":"ch2","type":"single","stem":"“印太战略”实际上延续奥巴马时期（　）的精髓，是（　）的继续。","options":["“亚太再平衡”战略、冷战思维和霸权主义","“重返亚洲”战略、单边主义和强权政治","“亚太再平衡”战略、单边主义和强权政治","“印太再平衡”战略、冷战思维和霸权主义"],"answer":0,"exp":"“印太战略”延续了奥巴马时期“亚太再平衡”战略的精髓，实质是冷战思维和霸权主义的继续；单边主义、强权政治虽相关，但不是题干所指的思想根源。","note":"原填空题改造"},{"id":"ch2-049","chapter":"ch2","type":"single","stem":"（　）是维护国家安全的新型作战力量，是我军新质作战能力的重要增长点。","options":["战略支援部队","联勤保障部队","武装警察部队","火箭军"],"answer":0,"exp":"战略支援部队承担情报侦察、电子对抗、网络攻防和航天支援等任务，属新型作战力量，是军队新质作战能力的重要增长点，其余选项职能定位不同。"},{"id":"ch2-050","chapter":"ch2","type":"single","stem":"（　）是国家生存和发展的最基本条件。","options":["文化安全","生态安全","国土安全","网络安全"],"answer":2,"exp":"国土是国家主权、领土和人民赖以存在的空间载体，失去国土安全其他领域安全便无从谈起，所以它是国家生存和发展最基本的前提条件。"},{"id":"ch2-051","chapter":"ch2","type":"single","stem":"（　）在整个国家安全体系中发挥至关重要的支柱和保障作用，关系到国家的生死存亡和长治久安。","options":["社会安全","军事安全","资源安全","科技安全"],"answer":1,"exp":"军事安全直接关系国家主权和领土完整，为政治、经济、文化等各领域安全提供武力后盾，因此在国家安全体系中起至关重要的支柱和保障作用。"},{"id":"ch2-052","chapter":"ch2","type":"single","stem":"（　）在国家安全体系中居于最高层次和核心地位，是国家安全的根本，决定和影响着其他各领域的安全。","options":["社会安全","政治安全","军事安全","经济安全"],"answer":1,"exp":"政治安全的核心是政权安全和制度安全，它决定国家发展方向并统领其他领域安全，所以在国家安全体系中居于最高层次和核心地位。"},{"id":"ch2-053","chapter":"ch2","type":"single","stem":"（　）实施固本联邻的“现实遏制”战略。","options":["美国","俄罗斯","欧盟","日本"],"answer":1,"exp":"俄罗斯面对北约东扩提出固本联邻、以战略核力量为后盾的现实遏制战略，美国、欧盟、日本的战略提法与此不同，故选俄罗斯。"},{"id":"ch2-054","chapter":"ch2","type":"single","stem":"（　）正在进行由地区性军事大国向全球性军事大国的军事战略调整。","options":["伊朗","日本","朝鲜","印度"],"answer":3,"exp":"印度随经济实力增长持续推进军事战略调整，谋求由南亚地区性军事大国走向全球性军事大国，伊朗、朝鲜、日本均不具备这一战略定位。"},{"id":"ch2-055","chapter":"ch2","type":"single","stem":"我国有（　）的海岸线。","options":["2.2万千米","1.8万千米","2.8万千米","3.7万千米"],"answer":1,"exp":"我国大陆海岸线北起鸭绿江口、南至北仑河口，全长约1.8万千米，居世界前列，2.2万、2.8万、3.7万千米均与此不符。"},{"id":"ch2-056","chapter":"ch2","type":"single","stem":"与我们国家陆地上相接壤的国家有（　）。","options":["13个","14个","15个","16个"],"answer":1,"exp":"我国陆上邻国共14个，包括朝鲜、俄罗斯、蒙古以及中亚、南亚、东南亚诸国，13个、15个、16个均与实际数目不符。"},{"id":"ch2-057","chapter":"ch2","type":"single","stem":"我国与（　）个国家海上相邻或者相向。","options":["6","7","8","9"],"answer":2,"exp":"我国海上与朝鲜、韩国、日本、菲律宾、马来西亚、文莱、越南、印度尼西亚8国相邻或相向，因此是8个国家。"},{"id":"ch2-058","chapter":"ch2","type":"single","stem":"“天下虽安，忘战必危”出自（　）。","options":["《易·系辞下》","《司马法·仁本》","《国策·齐策六》","《孙子兵法》"],"answer":1,"exp":"此语出自《司马法·仁本》，意为天下虽然安定，忘记战备必然招致危险，强调居安思危、常备不懈，与《孙子兵法》等书的表述不同。"},{"id":"ch2-059","chapter":"ch2","type":"single","stem":"（　）是一种认识方法和实践观点，意味着直面风险挑战，坚持原则问题不动摇，立足最坏局面，同时保持策略的灵活性以争取最好结果。","options":["战略思维","辩证思维","创新思维","底线思维"],"answer":3,"exp":"底线思维强调从最坏处着眼、向最好处努力，守住不可突破的底线，题干所说立足最坏局面、争取最好结果正是其内涵，故选底线思维。"},{"id":"ch2-060","chapter":"ch2","type":"single","stem":"“要谋求自身安全，必须也让别人安全。要谋求自身过得好，也必须让别人过得好”强调的是（　）。","options":["既重视外部安全，又重视内部安全","既重视国土安全，又重视国民安全","既重视发展问题，又重视安全问题","既重视自身安全，又重视共同安全"],"answer":3,"exp":"这句话强调安全是相互的，一国不能以牺牲他国安全换取自身安全，体现既重视自身安全、又重视共同安全的新安全观。"},{"id":"ch2-062","chapter":"ch2","type":"multi","stem":"美国武装力量由（　）组成。","options":["现役部队","后备役部队","文职人员","武装警察部队"],"answer":[0,1,2],"exp":"美军武装力量由现役部队、后备役部队和文职人员三部分组成，国民警卫队归入后备役，武装警察部队不属美军建制，故不选第四项。"},{"id":"ch2-063","chapter":"ch2","type":"multi","stem":"新型领域的国家安全主要是指（　）。","options":["太空安全","深海安全","极地安全","核安全"],"answer":[0,1,2],"exp":"新型领域安全指太空、深海、极地等人类活动新拓展疆域的安全，核安全属传统安全范畴，故不选核安全。"},{"id":"ch2-064","chapter":"ch2","type":"multi","stem":"当前国际战略环境的主要特征有（　）","options":["局部战争呈现新特点","军事安全更加突出","世界新军事变革进程加快","非传统安全威胁日益突出"],"answer":[0,1,2,3],"exp":"当前国际战略环境总体和平但局部战争呈现新特点，军事安全地位更加突出，世界新军事变革加快，恐怖主义、疫情等非传统安全威胁上升，四者均属主要特征，故选ABCD。"},{"id":"ch2-065","chapter":"ch2","type":"judge","stem":"传统安全与非传统安全不仅有产生先后、表现形式不同的区分，也有轻重的区分。","options":["正确","错误"],"answer":1,"exp":"错。传统安全与非传统安全只有领域、成因和表现形式的差别，没有轻重之分，二者相互交织、相互转化，必须统筹应对，不能厚此薄彼。"},{"id":"ch2-066","chapter":"ch2","type":"judge","stem":"事关国家政权、主权和领土完整等核心利益，维护安全必须有保底手段，绝不退让。而一些重要程度相对较低的利益，可以通过谈判磋商的方式进行维护。","options":["正确","错误"],"answer":0,"exp":"涉及政权、主权、领土完整等核心利益必须坚守底线，以保底手段维护、绝不退让；重要程度较低的利益可通过谈判磋商解决，故判对。"},{"id":"ch2-067","chapter":"ch2","type":"judge","stem":"国家安全是一个动态概念，威胁国家安全的危险要素是随着时代发展而变化的，随着国际形势的发展变化。","options":["正确","错误"],"answer":0,"exp":"国家安全的内涵和威胁要素随时代和国际形势变化而不断调整，不存在一成不变的安全状态，必须动态审视、综合应对，故该判断正确。"},{"id":"ch2-068","chapter":"ch2","type":"judge","stem":"印度在作战对象上，由过去强调“淡巴重中”调整为“中巴并重”。","options":["正确","错误"],"answer":1,"exp":"错。印度过去长期把巴基斯坦作为主要作战对象，即重巴轻中，后来才调整为中巴并重；题干说由淡巴重中调整而来，把前后关系颠倒了。"},{"id":"ch2-069","chapter":"ch2","type":"judge","stem":"“一超多强”是当前乃至今后相当长时期内世界主要战略力量对比的总体态势和总体特征。","options":["正确","错误"],"answer":0,"exp":"当前世界战略力量对比呈现一超多强态势：美国综合实力仍居首位，中、俄、欧、日、印等力量中心并存，这一格局将延续较长时间，故判对。"},{"id":"ch2-070","chapter":"ch2","type":"judge","stem":"世界很多国家和地区因传统政治体制与主流政党解决经济与社会危机的能力明显削弱，为民粹主义的发展提供了机会。","options":["正确","错误"],"answer":0,"exp":"不少国家传统政治体制和主流政党应对经济与社会危机的能力下降，民众不满情绪上升，为民粹主义提供了土壤和机会，故该判断正确。"},{"id":"ch2-071","chapter":"ch2","type":"judge","stem":"事实证明，影响台海局势稳定的根源并未消除，“台独”分裂势力及其分裂活动仍然是两岸关系和平发展的最大威胁。","options":["正确","错误"],"answer":0,"exp":"台海局势紧张的根源在于台独分裂势力及其分裂活动，其仍是两岸关系和平发展的最大威胁，影响台海稳定的根源尚未消除，故判对。"},{"id":"ch2-072","chapter":"ch2","type":"judge","stem":"半岛核问题的根源，在于美国对朝鲜的长期施压导致朝方采取强烈的反弹举措，这是朝美对抗的产物。","options":["正确","错误"],"answer":0,"exp":"半岛核问题是朝美长期对抗的产物，美国对朝施压制裁使朝方以核武自保、强烈反弹，症结在朝美矛盾，故该判断正确。"},{"id":"ch2-073","chapter":"ch2","type":"judge","stem":"与我们国家陆地上相接壤的国家有 15 个。","options":["正确","错误"],"answer":1,"exp":"错。与我国陆地接壤的国家共14个，如朝鲜、俄罗斯、蒙古、印度、缅甸、越南等，不是15个，故该判断错误。"},{"id":"ch2-074","chapter":"ch2","type":"judge","stem":"新安全观的核心是互信、互利、合作与发展。","options":["正确","错误"],"answer":1,"exp":"错。中国倡导的新安全观核心是互信、互利、平等、协作，题干把平等、协作换成合作与发展，表述不准确，故错误。"},{"id":"ch2-075","chapter":"ch2","type":"judge","stem":"国家主权主要包括国家的独立权、管辖权、平等权、自决权。","options":["正确","错误"],"answer":1,"exp":"错。国家主权主要包括独立权、平等权、自卫权和管辖权，题干把自卫权误作自决权；自决权属于民族自决范畴，故判断错误。"},{"id":"ch2-076","chapter":"ch2","type":"judge","stem":"大国防观念，是指国家为确保本国的主权、安全及其国家整体利益不受侵犯而采取的政治、经济、军事、科技、外交、文化、教育等各种措施的总和。","options":["正确","错误"],"answer":0,"exp":"大国防观念突破单纯军事范畴，把国防看作政治、经济、军事、科技、外交、文化、教育等各领域措施的综合，依靠国家整体力量维护主权与安全。"},{"id":"ch2-077","chapter":"ch2","type":"judge","stem":"台军突出不对称优势，致力打造“小而精、小而强、小而巧的可怕战力”。","options":["正确","错误"],"answer":0,"exp":"台军兵力有限，强调不求规模而求效能，企图以不对称战力和所谓小而精、小而强、小而巧的建设目标提升威慑，这是其军事战略的公开表述。"},{"id":"ch2-078","chapter":"ch2","type":"judge","stem":"国防建设是指为国家安全利益需要，提高国防能力而进行的各方面的建设，是国家建设的重要组成部分。","options":["正确","错误"],"answer":0,"exp":"国防建设以满足国家安全利益需要、提高国防能力为目的，涵盖武装力量、国防科技工业、国防动员和国防教育等方面，是国家建设的重要组成部分。"},{"id":"ch2-079","chapter":"ch2","type":"judge","stem":"台湾现行军事战略为：“防卫固守、有效吓阻”。","options":["正确","错误"],"answer":0,"exp":"台湾当局现行军事战略的表述为防卫固守、有效吓阻，即强调固守防御，并企图以所谓吓阻手段拒止对方行动，题干表述与其提法一致。"},{"id":"ch2-080","chapter":"ch2","type":"judge","stem":"“印太战略”的实质就是要进一步加强对中国的地缘战略遏制和围堵，阻滞中国的崛起进程，维持美国在“印太地区”乃至全球的霸主地位。","options":["正确","错误"],"answer":0,"exp":"印太战略以所谓自由开放为名，拉拢盟友构建排他性安全网络，实质是加强对中国的地缘战略遏制和围堵，阻滞中国崛起，维护美国的霸主地位。"},{"id":"ch3-084","chapter":"ch3","type":"single","stem":"美国（　）撰写的《21世纪冲突：混合战争的兴起》一书，提出未来战争形式将是一种融合多种样式的“混合战争”。","options":["弗兰克·霍夫曼","约翰·米尔斯海默","塞缪尔·亨廷顿","阿尔文·托夫勒"],"answer":0,"exp":"该书作者是美国学者弗兰克·霍夫曼，他系统提出混合战争概念。米尔斯海默研究大国政治，亨廷顿讲文明冲突，托夫勒论战争形态，均非此书作者。","note":"原填空题改造"},{"id":"ch3-085","chapter":"ch3","type":"single","stem":"《孙子兵法》开篇就指出“（　）”。意思是说战争是国家的大事，关系到军民生死、国家存亡，是不可不认真研究的。","options":["兵者，诡道也。故能而示之不能，用而示之不用","兵者，国之大事，死生之地，存亡之道，不可不察也","知彼知己者，百战不殆；不知彼而知己，一胜一负","故上兵伐谋，其次伐交，其次伐兵，其下攻城"],"answer":1,"exp":"《孙子兵法·计篇》开篇即言“兵者，国之大事，死生之地，存亡之道，不可不察也”，强调慎重对待战争。其余三句讲诡道、伐谋、知彼知己，分别出自其他篇章。","note":"原填空题改造"},{"id":"ch3-086","chapter":"ch3","type":"single","stem":"19世纪，普鲁士军事理论家（　）提出：战争无非是政治通过另一种手段的继续。","options":["马汉","克劳塞维茨","利德尔·哈特","约米尼"],"answer":1,"exp":"克劳塞维茨在《战争论》中提出“战争无非是政治通过另一种手段的继续”，揭示了战争与政治的关系。利德尔·哈特讲间接路线，约米尼著《战争艺术》，马汉创海权论。","note":"原填空题改造"},{"id":"ch3-087","chapter":"ch3","type":"single","stem":"党的十九大精神概括习近平领航强军兴军的伟大成就和理论创造，鲜明提出（　），为实现党在新时代的强军目标、把人民军队全面建成世界一流军队提供了根本引领和科学指南。","options":["习近平强军思想","科技兴军战略","改革强军战略","新时代军事战略方针"],"answer":0,"exp":"党的十九大把习近平强军思想写入党章，作为新时代国防和军队建设的根本引领。军事战略方针、改革强军、科技兴军都只是其指导下的具体方针举措。","note":"原填空题改造"},{"id":"ch3-088","chapter":"ch3","type":"single","stem":"军事思想是军事科学的基础理论部分，是关于战争、（　）和（　）的基本问题的理性认识。","options":["国防、作战","国防、军事技术","国防、军队","军队、装备"],"answer":2,"exp":"军事思想是关于战争、国防和军队基本问题的理性认识，属于军事科学的最高层次。作战、装备、军事技术是军事科学其他分支的研究对象，不在其定义之列。","note":"原填空题改造"},{"id":"ch3-089","chapter":"ch3","type":"single","stem":"被誉为中国古代军事论著典范的是宋朝编著的（　）。","options":["《武经总要》","《虎钤经》","《武经七书》","《太白阴经》"],"answer":2,"exp":"宋朝将《孙子》《吴子》等七部兵书汇编为《武经七书》，作为武学教材，被誉为古代军事论著典范。《武经总要》是军事百科性著作，另两部为唐代兵书。","note":"原填空题改造"},{"id":"ch3-090","chapter":"ch3","type":"single","stem":"军事思想是军事科学的理论基础部分，是关于（　）、（　）和（　）的基本问题的理性认识。","options":["战争、国防、军事技术","军队、国防、战略","战争、军队、作战","战争、军队、国防"],"answer":3,"exp":"军事思想是关于战争、军队和国防基本问题的理性认识，是军事科学的理论基础；作战、军事技术、战略等属军事科学其他层次或分支的研究对象。","note":"原填空题改造"},{"id":"ch3-091","chapter":"ch3","type":"single","stem":"（　）时期的军事思想，是我国（　），奠定了中国古代军事思想的基础。","options":["秦汉、军事思想史上的第一个高峰","春秋战国、军事思想史上的第一个高峰","夏商周、冷兵器时代军事思想的集大成","春秋战国、古代军事思想形成的重要标志"],"answer":1,"exp":"春秋战国时期的军事思想是我国军事思想史上的第一个高峰，奠定了中国古代军事思想的基础；秦汉、夏商周不是这一高峰所在时期，其余表述非教材原话。","note":"原填空题改造"},{"id":"ch3-092","chapter":"ch3","type":"single","stem":"“政治是不流血的战争，战争是流血的政治”形象地说明（　）。","options":["战争与经济的关系","战争的规律","战争的性质","战争与政治的关系"],"answer":3,"exp":"毛泽东此语揭示战争是政治的继续、政治以战争为手段，说明战争与政治的本质联系，而不是单纯讲战争的经济根源、规律或性质。"},{"id":"ch3-093","chapter":"ch3","type":"single","stem":"（　）中国军事思想发展到一个全新的阶段，且在第三世界国家产生深远影响。","options":["孙子兵法","毛泽东军事思想","邓小平新时期军队建设思想","江泽民国防和军队建设思想"],"answer":1,"exp":"毛泽东军事思想把马克思主义军事理论同中国革命战争实践相结合，形成人民军队、人民战争和战略战术体系，把中国军事思想推进到全新阶段。"},{"id":"ch3-094","chapter":"ch3","type":"single","stem":"要造成一种无形和有形的力量，使敌人想打而不敢打，想打又打不起来。这种军事战略被称为（　）。","options":["遏制战略","打赢战略","防御战略","和平战略"],"answer":0,"exp":"靠实力与威慑使对手想打而不敢打、想打又打不起来，正是遏制战略的目标；打赢战略着眼于实战取胜，防御战略和和平战略重在姿态与政策。"},{"id":"ch3-095","chapter":"ch3","type":"judge","stem":"孙武主张上兵伐谋，其次伐交，其次伐兵，其下攻城，意思是最好的是以谋制胜，使敌人屈服。","options":["正确","错误"],"answer":0,"exp":"孙武主张上兵伐谋，其次伐交，其次伐兵，其下攻城，强调以谋略使敌屈服是最高境界，攻城是不得已的下策，故该判断正确。"},{"id":"ch3-096","chapter":"ch3","type":"judge","stem":"《论持久战》是毛泽东等老一辈军事家集体创作的军事名著。","options":["正确","错误"],"answer":1,"exp":"错。《论持久战》是毛泽东1938年发表的个人军事著作，系统阐述持久战方针，并非老一辈军事家集体创作，题干说法与此不符。"},{"id":"ch3-097","chapter":"ch3","type":"judge","stem":"战争的根本目的在于政治，而不在于经济。","options":["正确","错误"],"answer":1,"exp":"错。战争的根本目的在于政治，但政治是经济的集中体现，战争最终根源于经济利益，题干把政治与经济对立、否认经济根源，故错误。"},{"id":"ch3-098","chapter":"ch3","type":"judge","stem":"战争观是指对战争的根本看法。包括对战争的起源、根源、性质、本质、目的、战争与相应因素的内在联系、消灭战争的途径及战争与革命、战争与和平的关系等观点。","options":["正确","错误"],"answer":0,"exp":"战争观是对战争的根本看法，涵盖战争的起源、根源、性质、目的，战争与政治经济等因素的内在联系，以及消灭战争的途径、战争与和平的关系。"},{"id":"ch3-099","chapter":"ch3","type":"judge","stem":"孙子认为作为一个名将必须具备五个基本条件，这就是“智、信、仁、勇、忠”。","options":["正确","错误"],"answer":1,"exp":"孙子提出的为将五德是智、信、仁、勇、严，忠不在其中，严指治军纪律严明，故题干把严写成忠是错误的。"},{"id":"ch3-100","chapter":"ch3","type":"judge","stem":"积极防御是指以积极的攻势行动，战胜进攻之敌的防御。","options":["正确","错误"],"answer":0,"exp":"积极防御不是消极等待、被动挨打，而是以防为体、以攻为用，通过战役战斗上的攻势行动消耗和战胜进攻之敌，因而又称攻势防御。"},{"id":"ch3-101","chapter":"ch3","type":"judge","stem":"军事思想是指对战争的根本看法。","options":["正确","错误"],"answer":1,"exp":"题干给出的是战争观的定义。军事思想是关于战争、军队和国防基本问题的理性认识，包括战争观、军事问题认识论和方法论，范围更宽。"},{"id":"ch3-102","chapter":"ch3","type":"judge","stem":"“间接路线战略”理论是由英国富勒提出。","options":["正确","错误"],"answer":1,"exp":"间接路线战略由英国军事理论家利德尔·哈特提出，富勒则以装甲战理论著称，题干把两人成果混淆，故该判断错误。"},{"id":"ch3-103","chapter":"ch3","type":"judge","stem":"美国的杜黑提出海权论，主张建立并运用具有优势的海军和其他海上力量去控制海洋，进而通过夺取制海权控制世界。","options":["正确","错误"],"answer":1,"exp":"海权论由美国马汉提出；杜黑是意大利人，主张制空权理论。题干把提出者、国籍和理论内容全部弄错，故表述错误。"},{"id":"ch4-064","chapter":"ch4","type":"single","stem":"把努力构建能够打赢信息化战争、有效履行使命任务的（　）作为2020年前深化国防和军队改革目标。","options":["中国特色现代作战体系","中国特色现代军事力量体系","中国特色现代军事理论体系","中国特色现代国防体系"],"answer":2,"exp":"深化国防和军队改革的目标是构建中国特色现代军事力量体系，重点在力量结构与编成。军事理论体系、作战体系、国防体系是不同层面概念，不能替代这一目标。","note":"原填空题改造"},{"id":"ch4-065","chapter":"ch4","type":"single","stem":"在信息化条件下，（　）已发展成为一种具有普遍意义的作战理念，成为诸军兵种部队作战的基本形式。","options":["协同作战","独立作战","合同作战","联合作战"],"answer":3,"exp":"信息化条件下诸军兵种依托网络化指挥信息系统实施联合作战，它已成为普遍作战理念和基本作战形式。合同作战、协同作战是机械化战争阶段的提法，已显过时。","note":"原填空题改造"},{"id":"ch4-066","chapter":"ch4","type":"single","stem":"与机械化战争相比，信息化战争最突出的特点就是（　）。","options":["平台与平台的对抗","兵力兵器的数量对抗","单一军种的独立对抗","体系与体系的对抗"],"answer":3,"exp":"信息化战争最突出的特点是体系与体系的对抗，靠信息主导的整体效能取胜；平台对抗、单一军种对抗和数量对抗都是机械化战争的典型特征。","note":"原填空题改造"},{"id":"ch4-067","chapter":"ch4","type":"single","stem":"新军事变革的主旨是将（　）发展成为（　）。","options":["信息化军队、智能化军队","传统军队、现代化军队","机械化军队、信息化军队","机械化战争、信息化战争"],"answer":2,"exp":"新军事变革的主旨是把机械化军队发展成为信息化军队，实现军队形态整体转型；其余选项或混淆军队与战争形态，或不是教材的规范表述。","note":"原填空题改造"},{"id":"ch4-068","chapter":"ch4","type":"single","stem":"（　）、（　）和太空成为信息化战争的（　）。","options":["信息域、网络域、战略制高点","陆域、认知域、战略制高点","信息域、认知域、战略制高点","信息域、认知域、主要战场"],"answer":2,"exp":"信息化战争的空间拓展到信息域、认知域和太空，三者共同构成战略制高点；网络域、陆域以及主要战场等表述与题干三域并列的结构不符。","note":"原填空题改造"},{"id":"ch4-069","chapter":"ch4","type":"single","stem":"信息化战争以夺取（　）为核心目标。","options":["制空权","制信息权","制电磁权","制海权"],"answer":1,"exp":"信息化战争以夺取制信息权为核心目标，信息优势是取得其他作战优势的前提；制空权、制海权、制电磁权虽重要，但服务于信息优势的夺取。","note":"原填空题改造"},{"id":"ch4-070","chapter":"ch4","type":"single","stem":"争夺现代战争的控制权主要有：制空权、制海权、（　）、（　）和（　）。","options":["制电磁权、制信息权、制太空权","制信息权、制网络权、制太空权","制电磁权、制信息权、制陆权","制电磁权、制网络权、制太空权"],"answer":0,"exp":"现代战争控制权包括制空权、制海权、制电磁权、制信息权和制太空权；网络权、制陆权不在题干所列五种控制权之内。","note":"原填空题改造"},{"id":"ch4-071","chapter":"ch4","type":"single","stem":"六维空间是指（　）。","options":["海、陆、空、天、深海、极地","海、陆、空、天、网络电磁、深海","海、陆、空、天、电磁频谱、人工智能","海、陆、空、天、网络电磁、认知领域"],"answer":3,"exp":"六维空间指海、陆、空、天、网络电磁、认知领域六个维度；深海、极地、电磁频谱、人工智能虽被视为新兴领域，但不属于这一六维表述。","note":"原填空题改造"},{"id":"ch4-072","chapter":"ch4","type":"single","stem":"“新军事革命”的概念是由英文Revolution in Military Affairs翻译而来，美国官方于（　）结束后逐步使用。","options":["越南战争","阿富汗战争","科索沃战争","海湾战争"],"answer":3,"exp":"“新军事革命”由英文Revolution in Military Affairs译来，美国官方在1991年海湾战争结束后逐步使用；越南战争、科索沃战争、阿富汗战争时间不符。","note":"原填空题改造"},{"id":"ch4-073","chapter":"ch4","type":"single","stem":"在信息化条件下，（　）已发展成为一种具有普遍意义的（　），成为诸军兵种部队作战的基本形式。","options":["合同作战、作战样式","体系作战、作战理论","协同作战、作战方法","联合作战、作战理念"],"answer":3,"exp":"信息化条件下联合作战已成为具有普遍意义的作战理念，并成为诸军兵种作战的基本形式；合同作战、协同作战是此前的作战形式，体系作战搭配不当。","note":"原填空题改造"},{"id":"ch4-074","chapter":"ch4","type":"judge","stem":"先进的军事理论，历来是武器装备和军队建设的先导，也是战争制胜的前提条件。","options":["正确","错误"],"answer":0,"exp":"先进军事理论揭示战争规律、引领军队建设和作战方式变革，是武器装备发展、军队建设的先导，也是夺取战争胜利的重要前提，故判对。"},{"id":"ch4-075","chapter":"ch4","type":"judge","stem":"武器装备的断代性发展，是军事领域出现革命性变化的重要标志。","options":["正确","错误"],"answer":0,"exp":"武器装备出现代际跃升，如冷兵器到火器、火器到机械化、机械化到信息化，往往引发军事领域革命性变化，故该判断正确。"},{"id":"ch4-076","chapter":"ch4","type":"judge","stem":"没有制天权，就不可能掌握制信息权和制空权，也就没有制海、制陆和制电磁权。","options":["正确","错误"],"answer":0,"exp":"太空是当代战争的战略制高点，制天权是制信息权、制空权的基础，失去制天权则制海、制陆、制电磁权也难以保障，故判对。"},{"id":"ch4-077","chapter":"ch4","type":"judge","stem":"信息化战争以夺取制信息权为核心目标。","options":["正确","错误"],"answer":0,"exp":"信息化战争以信息为主导，只有夺取制信息权才能掌握战场主动权，进而夺取制空、制海权，故该判断正确。"},{"id":"ch4-078","chapter":"ch4","type":"judge","stem":"非接触作战是交战双方的战略、战役及战术行动界限越来越模糊，已经没有明显的交战线，因而战场形态呈现非线式。","options":["正确","错误"],"answer":1,"exp":"题干说的是非线式作战，混淆了两个概念。非接触作战指双方不接触，用信息系统和远程武器实施防区外打击；战线模糊、战场非线式才叫非线式作战。"},{"id":"ch4-079","chapter":"ch4","type":"judge","stem":"信息域、认知域和太空将成为信息化战争的战略制高点。","options":["正确","错误"],"answer":0,"exp":"信息化战争在多维空间展开，信息域决定信息优势，认知域争夺意志与舆论主动权，太空为侦察、通信、导航提供支撑，三者成为新的战略制高点。"},{"id":"ch4-080","chapter":"ch4","type":"judge","stem":"非线式作战是敌对双方在不接触的情况下，使用信息系统和远程作战武器实施防区外打击的作战行动样式。","options":["正确","错误"],"answer":1,"exp":"这是非接触作战的定义，题干张冠李戴。非线式作战指战场没有固定战线、前后方界限模糊，作战力量在全纵深不规则展开，并非以是否接触来界定。"},{"id":"ch4-081","chapter":"ch4","type":"judge","stem":"信息化战争是信息化社会的主要战争形态。它是依托网络化信息系统，使用信息化武器装备及相应作战方法，在陆、海、空、天和网络电磁等空间及认知领域进行的以体系对抗为主要形式的战争。","options":["正确","错误"],"answer":0,"exp":"信息化战争依托网络化信息系统，使用信息化武器装备，在陆海空天和网络电磁空间及认知领域展开，以体系对抗为主要形式，是信息化社会主导的战争形态。"},{"id":"ch5-058","chapter":"ch5","type":"single","stem":"（　）系中国目前建造排水量最大的水下作战舰艇，堪称“国之重器”。","options":["093型核潜艇","095型核潜艇","094型核潜艇","092型核潜艇"],"answer":2,"exp":"094型是我国自行建造的弹道导弹核潜艇，排水量在现役水下舰艇中最大，故称国之重器。093、095型属攻击型核潜艇，092型为上一代艇，吨位均不及094型。","note":"原填空题改造"},{"id":"ch5-059","chapter":"ch5","type":"single","stem":"（　）的出现，被称为战争史上继火药、核武器之后的“第三次革命”。","options":["高超音速武器","定向能武器","人工智能武器","精确制导武器"],"answer":2,"exp":"人工智能武器能自主感知、决策和行动，被视为继火药、核武器之后的第三次军事革命。精确制导、高超音速、定向能武器同属新概念武器，但未获此定位。","note":"原填空题改造"},{"id":"ch5-060","chapter":"ch5","type":"single","stem":"（　）是美国陆军主战坦克中最先进的型号。","options":["M1A2 SEP","M60A3","M1A1","M1A2 TUSK"],"answer":0,"exp":"M1A2 SEP是M1系列的系统增强型，信息化程度与防护力最强，为美陆军现役最先进主战坦克。M1A2 TUSK只是城市作战套件，M1A1和M60A3均为较早型号。","note":"原填空题改造"},{"id":"ch5-061","chapter":"ch5","type":"single","stem":"2015年8月1日，俄正式成立“（　）”，实现对航空、防空和反导防御、太空部队的统一指挥。","options":["战略火箭军","空天防御兵","空降军","空天军"],"answer":3,"exp":"2015年俄罗斯将空军与空天防御兵合并组建空天军，统一指挥航空、防空反导和太空力量。战略火箭军掌管陆基核力量，空降军是独立兵种，均不承担这一职能。","note":"原填空题改造"},{"id":"ch5-062","chapter":"ch5","type":"single","stem":"航天技术是由（　）、（　）和（　）构成的高度综合性技术。","options":["运载器技术、航天器技术、卫星应用技术","运载器技术、航天器技术、地面测控技术","运载器技术、航天器技术、空间探测技术","运载器技术、航天器技术、返回着陆技术"],"answer":1,"exp":"航天技术由运载器技术、航天器技术和地面测控技术三大支柱构成，分别解决上天、在天和管天问题。卫星应用、返回着陆、空间探测都是派生的具体技术方向。","note":"原填空题改造"},{"id":"ch5-063","chapter":"ch5","type":"single","stem":"2011年9月29日，中国第一个目标飞行器（　）在酒泉卫星发射中心成功发射。","options":["天宫二号","天舟一号","天宫一号","神舟八号"],"answer":2,"exp":"天宫一号是我国首个目标飞行器，2011年9月29日在酒泉发射，用于交会对接试验。天宫二号是其后发射的空间实验室，神舟八号是飞船，天舟一号是货运飞船。","note":"原填空题改造"},{"id":"ch5-064","chapter":"ch5","type":"single","stem":"2021年4月29日，中国空间站（　）在我国文昌航天发射场发射升空，准确进入预定轨道。","options":["梦天实验舱","问天实验舱","天和核心舱","天舟货运飞船"],"answer":2,"exp":"2021年4月29日发射的是天和核心舱，标志中国空间站在轨建造全面展开；问天、梦天实验舱于2022年发射，天舟是货运飞船。","note":"原填空题改造"},{"id":"ch5-065","chapter":"ch5","type":"single","stem":"（　）是装有大量电子设备并与军事信息系统联网的装甲车辆、作战飞机、作战舰艇等。","options":["军事信息系统","主战装备","信息化作战平台","精确制导武器"],"answer":2,"exp":"题干描述的是信息化作战平台，即加装大量电子设备并接入军事信息系统的作战平台；精确制导武器、军事信息系统、主战装备与平台的所指不同。","note":"原填空题改造"},{"id":"ch5-066","chapter":"ch5","type":"single","stem":"C4ISR系统中“SR”分别指（　）和（　）。","options":["预警、跟踪","通信、指挥","监视、侦察","搜索、识别"],"answer":2,"exp":"C4ISR中S为Surveillance即监视，R为Reconnaissance即侦察，二者是情报获取的重要环节；换成搜索、识别、预警、跟踪或通信、指挥都不符合缩略语原意。","note":"原填空题改造"},{"id":"ch5-067","chapter":"ch5","type":"single","stem":"电子对抗的重点将向（　）一体化系统和反精确制导武器方向发展。","options":["C3I","C4KISR","C2","C4ISR"],"answer":3,"exp":"电子对抗重点向C4ISR一体化系统和反精确制导武器方向发展；C3I是其早期形态，C4KISR、C2不是题干所指的一体化系统表述。","note":"原填空题改造"},{"id":"ch5-068","chapter":"ch5","type":"single","stem":"隐身技术是指通过减弱目标自身的（　）特征信号，使其难以被探测器发现的技术。","options":["发射和辐射","反射和散射","红外和电磁","声波和光波"],"answer":0,"exp":"隐身技术通过减弱目标自身的发射和辐射特征信号降低被探测概率；反射和散射、红外和电磁、声波和光波只是特征信号的具体类型，概括不完整。","note":"原填空题改造"},{"id":"ch5-069","chapter":"ch5","type":"single","stem":"现代电子战中（　）的核心与关键设施将成为首要的打击目标。","options":["电子战装备","军事信息系统","精确制导武器","信息化作战平台"],"answer":1,"exp":"现代电子战把军事信息系统的核心与关键设施作为首要打击目标，其瘫痪可瓦解整个作战体系；电子战装备、信息化作战平台、精确制导武器是手段而非目标。","note":"原填空题改造"},{"id":"ch5-070","chapter":"ch5","type":"single","stem":"精确制导武器主要特点是：一是（　）；二是具有（　）；三是（　）；四是具有较强的（　）。","options":["直接命中率高、遥控制导能力、作战效能好、近距离突防能力","直接命中率高、自主制导能力、作战效能一般、中距离突防能力","直接命中率高、自主制导能力、作战效能好、远距离突防能力","命中精度一般、自主制导能力、作战效能好、远距离突防能力"],"answer":2,"exp":"精确制导武器的特点是直接命中率高、具有自主制导能力、作战效能好和较强的远距离突防能力；其余选项分别错在遥控制导或精度、效能、突防距离不符。","note":"原填空题改造"},{"id":"ch5-071","chapter":"ch5","type":"single","stem":"导弹按作战任务，可分为（　）和（　），按飞行弹道的特点分为（　）和（　）。","options":["洲际导弹、战术导弹、巡航导弹、弹道式导弹","战略导弹、战术导弹、巡航导弹、空地导弹","战略导弹、战术导弹、巡航导弹、弹道式导弹","战略导弹、战役导弹、巡航导弹、弹道式导弹"],"answer":2,"exp":"导弹按作战任务分为战略导弹和战术导弹，按飞行弹道特点分为巡航导弹和弹道式导弹；洲际导弹按射程划分，空地导弹按发射平台与目标关系划分。","note":"原填空题改造"},{"id":"ch5-072","chapter":"ch5","type":"single","stem":"侦察监视技术是指发现、识别、监视、跟踪目标并对目标进行定位所采用的（　）。","options":["技术","方法","装备","手段"],"answer":0,"exp":"侦察监视技术是发现、识别、监视、跟踪目标并对其定位所采用的技术，定义落点在技术；手段、方法、装备只是近义词，不是定义原文。","note":"原填空题改造"},{"id":"ch5-073","chapter":"ch5","type":"single","stem":"精确制导武器对战争的影响主要是扩大了作战空间；改善了（　）；增强了作战指挥的时效性，提高了指挥质量；促进了（　）的发展。","options":["战场感知手段、电子对抗技术","信息获取手段、反侦察监视技术","指挥控制手段、伪装防护技术","情报处理方式、防空反导技术"],"answer":1,"exp":"精确制导武器改善了信息获取手段，并促进反侦察监视技术发展，这是其对战争影响的两方面；战场感知、电子对抗等搭配与教材表述不符。","note":"原填空题改造"},{"id":"ch5-074","chapter":"ch5","type":"single","stem":"国际上禁止使用核、生、化等大规模杀伤性武器，但许多国家还是要研制生产这类武器，这主要是因为一、是争夺霸权主义的需要；二是（　）的需要。","options":["争夺资源","遏制被攻击","对外扩张","转嫁危机"],"answer":1,"exp":"除争夺霸权外，一些国家研制核生化武器还出于遏制被攻击、增强威慑的需要；对外扩张、转嫁危机、争夺资源均非题干所指的第二点原因。","note":"原填空题改造"},{"id":"ch5-075","chapter":"ch5","type":"single","stem":"现代战争中的电子对抗手段主要包括（　）、（　）、（　）和（　）。","options":["通信对抗、雷达对抗、水声对抗、导航对抗","雷达对抗、光电对抗、水声对抗、卫星对抗","通信对抗、雷达对抗、光电对抗、网络对抗","通信对抗、雷达对抗、光电对抗、水声对抗"],"answer":3,"exp":"电子对抗按对象分为通信对抗、雷达对抗、光电对抗和水声对抗四类；网络对抗、导航对抗、卫星对抗虽属电子对抗领域，但不是题干所要求的四种基本手段。","note":"原填空题改造"},{"id":"ch5-076","chapter":"ch5","type":"single","stem":"所谓大飞机，一般来说是指起飞总重超过（　）的运输类飞机，包括军用大型运输机和民用大型运输机，也包括（　）以上的干线客机。","options":["120吨、200座","150吨、180座","100吨、150座","80吨、120座"],"answer":2,"exp":"大飞机一般指起飞总重超过100吨的运输类飞机，也包括150座以上的干线客机；80吨、120吨、200吨等数值不符合这一通行标准。","note":"原填空题改造"},{"id":"ch5-077","chapter":"ch5","type":"single","stem":"2007年10月24日，我国第一颗绕月卫星（　）成功发射；2011年9月29日，中国第一个目标飞行器（　）在酒泉卫星发射中心发射；2013年6月11日，神舟十号载人飞船成功发射，并与天宫一号进行交会对接成功，标志着中国已经基本掌握了（　）技术，为天宫二号的建造打下坚实基础。","options":["嫦娥二号、天宫二号、空间站组建","嫦娥一号、天宫二号、载人天地往返","嫦娥三号、天宫一号、航天器深空探测","嫦娥一号、天宫一号、空间飞行器交会对接"],"answer":3,"exp":"2007年发射的是嫦娥一号，2011年发射的目标飞行器是天宫一号，神舟十号与之对接使我国基本掌握空间飞行器交会对接技术；嫦娥二号、天宫二号与时间不符。","note":"原填空题改造"},{"id":"ch5-078","chapter":"ch5","type":"single","stem":"信息化杀伤武器可分为（　）。","options":["常规武器和核武器","精确制导武器和普通弹药","进攻性武器和防御性武器","软杀伤性武器和硬杀伤性武器"],"answer":3,"exp":"信息化杀伤武器按杀伤机理分为软杀伤性武器和硬杀伤性武器；常规与核武器、精确制导与普通弹药、进攻性与防御性武器是按其他标准划分。","note":"原填空题改造"},{"id":"ch5-079","chapter":"ch5","type":"single","stem":"（　）的出现，被称为战争史上继火药、核武器之后的“（　）”。","options":["人工智能武器、新一轮军事革命","无人作战系统、第三次革命","精确制导武器、第三次革命","人工智能武器、第三次革命"],"answer":3,"exp":"人工智能武器的出现被称为战争史上继火药、核武器之后的“第三次革命”；精确制导武器、无人作战系统、激光武器虽同属新式武器，但无此称誉。","note":"原填空题改造"},{"id":"ch5-080","chapter":"ch5","type":"single","stem":"（　）战争中，F-22战斗机首次参加实战。","options":["利比亚","叙利亚","阿富汗","伊拉克"],"answer":1,"exp":"2014年美军F-22在打击叙利亚境内极端组织的空袭中首次投入实战，此前在伊拉克上空仅执行侦察巡逻任务，故首次实战为叙利亚战争。"},{"id":"ch5-081","chapter":"ch5","type":"single","stem":"信息化装备的核心是（　）。","options":["军事通讯系统","军事侦察系统","军事信息系统","军事导航系统"],"answer":2,"exp":"信息化装备以军事信息系统为核心，通信、侦察、导航等分系统都在信息系统的统一支撑下融合成体系，故核心是军事信息系统。"},{"id":"ch5-082","chapter":"ch5","type":"single","stem":"不属于新“三打三防”的是：（　）","options":["防核生化武器","打隐形飞机","防电子干扰"],"answer":0,"exp":"新三打三防指打隐形飞机、打巡航导弹、打武装直升机，防精确打击、防电子干扰、防侦察监视；防核生化武器属传统三防内容。"},{"id":"ch5-083","chapter":"ch5","type":"single","stem":"C4ISR 中 I 表示（　）","options":["信息","侦察","情报","监视"],"answer":2,"exp":"C4ISR由指挥、控制、通信、计算机、情报、监视、侦察七个要素构成，其中字母I取自英文Intelligence一词，意为情报，故选情报。"},{"id":"ch5-084","chapter":"ch5","type":"single","stem":"C4ISR 中 R 表示（　）","options":["信息","侦察","情报","监视"],"answer":1,"exp":"C4ISR中的R取自英文Reconnaissance，意为侦察；同一缩写中S表示监视、I表示情报，前面的字母则依次对应指挥、控制、通信和计算机，故R表示侦察。"},{"id":"ch5-085","chapter":"ch5","type":"single","stem":"以下不属于军事高技术特点的是（　）","options":["低风险","高投入","知识密集","创新性"],"answer":0,"exp":"军事高技术具有高投入、高风险、知识密集、创新性强等特点，低风险与其高风险属性相悖，因而不属于军事高技术的特点。"},{"id":"ch5-086","chapter":"ch5","type":"single","stem":"（　）年1月，美国成功发射人造地球卫星，从而揭开了航天技术发展的新篇章。","options":["1957","1958","1959","1968"],"answer":1,"exp":"1957年苏联发射第一颗人造卫星，1958年1月美国成功发射探险者一号，成为第二个进入航天时代的国家，故时间为1958年。"},{"id":"ch5-087","chapter":"ch5","type":"single","stem":"信息化建设的核心是（　）。","options":["军事通讯系统","军事侦察系统","军事信息系统","军事导航系统"],"answer":2,"exp":"信息化建设以军事信息系统为核心，通过信息网络把侦察、通信、指挥、打击等要素联成一体，其余系统均为其支撑环节。"},{"id":"ch5-088","chapter":"ch5","type":"multi","stem":"新概念武器与其它武器本质的区别，主要表现在（　）等方面。","options":["基本原理不同","杀伤机理不同","作战方式不同","使用时机不同"],"answer":[0,1,2,3],"exp":"新概念武器在基本原理、杀伤机理上突破传统，并带来作战方式和使用时机的变化，四方面共同构成与传统武器的本质区别，故全选。"},{"id":"ch5-089","chapter":"ch5","type":"multi","stem":"电子对抗对现代战争的影响主要体现在（　）","options":["反侦察难度进一步加大","作战手段得到全面创新","作战样式出现质的飞跃","扩大了作战空间"],"answer":[0,1,2],"exp":"电子对抗围绕电磁频谱展开，使反侦察难度加大，催生新作战手段，推动作战样式质变，故A、B、C正确；它不直接拓展作战空间，故不选D。"},{"id":"ch5-090","chapter":"ch5","type":"judge","stem":"商、周时期的战车是最早的陆战平台，乘员有明确的分工与协调。","options":["正确","错误"],"answer":0,"exp":"商周时期战车成为最早的陆战平台，车上御者、戈手、射手分工明确、协同作战，车战成为当时主要作战方式，故该判断正确。"},{"id":"ch5-091","chapter":"ch5","type":"judge","stem":"无人化兵器登上战争舞台，必将对传统的军事思想、作战理论、作战样式、军事组织结构和武器装备发展等带来一系列新的变革和挑战。","options":["正确","错误"],"answer":0,"exp":"无人化兵器改变作战力量构成和交战方式，必然对军事思想、作战理论、作战样式、军队组织结构和装备发展带来深刻变革与挑战，故判对。"},{"id":"ch5-092","chapter":"ch5","type":"judge","stem":"F-35被认为是第四代战斗机的典型代表。","options":["正确","错误"],"answer":1,"exp":"错。按国际通行的五代划分，F-35是第五代隐身战斗机；第四代典型代表是F-15、F-16、苏-27等，故题干判断错误。"},{"id":"ch5-093","chapter":"ch5","type":"judge","stem":"图-160轰炸机是世界上最大的轰炸机。","options":["正确","错误"],"answer":0,"exp":"图-160是俄罗斯研制的超音速战略轰炸机，最大起飞重量和尺寸居世界轰炸机之首，故称世界上最大的轰炸机，判断正确。"},{"id":"ch5-094","chapter":"ch5","type":"judge","stem":"C-17运输机是美国空军现役最大的战略运输机。","options":["正确","错误"],"answer":1,"exp":"错。美国空军现役最大的战略运输机是C-5银河，C-17是大型战略战术运输机，载重量和航程都小于C-5，故题干判断错误。"},{"id":"ch5-095","chapter":"ch5","type":"judge","stem":"智能化作战平台归根结底仍然是人的能力的延伸和发展。","options":["正确","错误"],"answer":0,"exp":"智能化作战平台无论自主程度多高，都是人设计、控制和运用的工具，其作战效能最终取决于人，仍是人的能力的延伸，故判对。"},{"id":"ch5-096","chapter":"ch5","type":"judge","stem":"F-35 被认为是第五代战斗机的典型代表。","options":["正确","错误"],"answer":1,"exp":"错。F-35是第五代多用途战斗机，第五代战斗机的典型代表通常指F-22；且按俄式划代它属第四代，故称第五代典型代表不准确。"},{"id":"ch5-097","chapter":"ch5","type":"judge","stem":"“直接命中”也包括战斗部爆炸后形成的破片直接命中目标并将它击毁。","options":["正确","错误"],"answer":0,"exp":"直接命中既包括弹体直接撞击目标，也包括战斗部爆炸后破片直接命中并击毁目标，二者都属直接毁伤，故该判断正确。"},{"id":"ch5-098","chapter":"ch5","type":"judge","stem":"1915 年，法军制成了世界上第一辆坦克。","options":["正确","错误"],"answer":1,"exp":"错。世界第一辆坦克是英国1916年制造的马克Ⅰ型，同年投入索姆河战役，并非1915年法军制成，故题干判断错误。"},{"id":"ch5-099","chapter":"ch5","type":"judge","stem":"“威慑”和“报复”是有限报复核战略的基本点。","options":["正确","错误"],"answer":0,"exp":"有限报复核战略以威慑和报复为基本点，平时靠威慑遏止对手，遭核打击后实施有限报复，二者构成其核心，故该判断正确。"},{"id":"ch5-100","chapter":"ch5","type":"judge","stem":"电子对抗是指为削弱和破坏敌方电子设备的使用效能，保护己方电子设备正常发挥效能所采用的技术。","options":["正确","错误"],"answer":0,"exp":"电子对抗又称电子战，通过电子侦察、干扰、欺骗和防护等手段削弱破坏敌方电子设备效能、保护己方效能正常发挥，故判对。"},{"id":"ch5-101","chapter":"ch5","type":"judge","stem":"航天侦察主要用于战略侦察，也可进行战役侦察和战术侦察。","options":["正确","错误"],"answer":0,"exp":"航天侦察覆盖范围广、不受国界限制，主要服务于战略侦察，也能为战役、战术行动提供情报，故该判断正确。"},{"id":"ch5-102","chapter":"ch5","type":"judge","stem":"以军事信息技术为核心的军事高技术成为世界军事变革发生和发展的直接动力。","options":["正确","错误"],"answer":0,"exp":"军事高技术以军事信息技术为核心，其发展直接推动武器装备、作战方式和军队体制变革，是世界军事变革的直接动力，故判对。"},{"id":"ch5-103","chapter":"ch5","type":"judge","stem":"现代电子战中，军事信息系统的核心与关键设施将成为首要的打击目标。","options":["正确","错误"],"answer":0,"exp":"信息化战争以信息为主导，指挥控制中心、通信枢纽、雷达站等信息系统关键节点是作战体系的中枢，一旦被毁则体系失灵，故成为电子战首要打击目标。"},{"id":"ch5-104","chapter":"ch5","type":"judge","stem":"新“三打三防”是指打坦克、打武装直升机、打巡航导弹；防侦察监视、防精确打击、防电子干扰。","options":["正确","错误"],"answer":1,"exp":"新三打三防是打隐身飞机、打巡航导弹、打武装直升机，防精确打击、防电子干扰、防侦察监视；打坦克属旧三打三防内容，故该表述有误。"},{"id":"ch5-105","chapter":"ch5","type":"judge","stem":"核武器爆炸时产生五种杀伤破坏因素。即光辐射、冲击波、早期核辐射、放射性沾染、核电磁脉冲。","options":["正确","错误"],"answer":0,"exp":"核爆炸释放的能量形成光辐射、冲击波、早期核辐射、放射性沾染和核电磁脉冲五种杀伤破坏因素，它们是核武器威力的基本构成，表述正确。"},{"id":"ch5-106","chapter":"ch5","type":"judge","stem":"军事伪装的基本原理是减小目标与背景在光学反射或辐射能量等方面的差别，以隐蔽目标和降低目标的显著性；模拟或扩大目标与背景的这些差别以构成假目标。","options":["正确","错误"],"answer":0,"exp":"伪装通过减小或扩大目标与背景在光学、红外、雷达等方面的差异实现隐真示假，前者使目标难以被识别，后者制造假目标迷惑敌人，原理表述正确。"},{"id":"ch5-107","chapter":"ch5","type":"judge","stem":"侦察卫星在现代高技术战争中，能够最大限度地发挥高技术兵器的效能，提高军队的机动能力，掌握战争的主动权。","options":["正确","错误"],"answer":0,"exp":"侦察卫星不受国界和地形限制，可大范围、全天时获取情报，为指挥决策和远程精确打击提供目标信息，是发挥高技术兵器效能、争夺主动权的重要支撑。"},{"id":"ch5-108","chapter":"ch5","type":"judge","stem":"电子对抗兵是中国人民解放军空军所特有的一个兵种。","options":["正确","错误"],"answer":1,"exp":"电子对抗兵是各军种普遍编设的专业兵种，陆军、海军、空军、火箭军均有电子对抗力量，并非空军所特有，故该判断错误。"},{"id":"ch5-109","chapter":"ch5","type":"judge","stem":"第二炮兵是中国人民解放军导弹部队的代称，它是我军的一个独立的兵种。","options":["正确","错误"],"answer":1,"exp":"第二炮兵已于2015年改建为火箭军，火箭军与陆海空军等并列，是独立军种而非独立兵种，故题干中独立的兵种的表述有误。"},{"id":"ch5-110","chapter":"ch5","type":"judge","stem":"军事高技术是指处于科学技术前沿或尖端地位，应用于军事领域并对增强军事实力有巨大推动作用的技术。","options":["正确","错误"],"answer":0,"exp":"军事高技术处于科学技术前沿，应用于军事领域后能显著提升武器装备性能和军队作战能力，是增强军事实力的重要推动力量，表述正确。"},{"id":"ch5-111","chapter":"ch5","type":"judge","stem":"在电子战的各种作战手段中，最常用的是电子干扰、电子欺骗、电子摧毁，被誉为是电子战的“三板斧”。","options":["正确","错误"],"answer":0,"exp":"电子干扰削弱敌方电子设备效能，电子欺骗以虚假信息误导敌方，电子摧毁用火力或反辐射武器直接毁伤，三者是电子战最常用的手段。"},{"id":"ch5-112","chapter":"ch5","type":"judge","stem":"C4ISR 系统是指指挥、控制、通信、计算机、情报、监视和侦察系统。","options":["正确","错误"],"answer":0,"exp":"C4ISR由指挥、控制、通信、计算机、情报、监视、侦察七个要素构成，是军队实现信息获取、传输处理和指挥控制一体化的综合系统。"},{"id":"ch5-113","chapter":"ch5","type":"judge","stem":"基因武器成本低，杀伤能力强，持续时间短。","options":["正确","错误"],"answer":1,"exp":"基因武器成本低、杀伤力强，但作用持续时间长，具有遗传性和隐蔽性，难以检测和防护，故持续时间短的说法与其特点相反，表述错误。"},{"id":"ch5-114","chapter":"ch5","type":"judge","stem":"F117 隐形飞机采用的隐身技术有隐身外形设计、隐身结构设计和采用吸波材料。","options":["正确","错误"],"answer":0,"exp":"F117通过多面体外形设计散射雷达波、以隐身结构设计减少强反射源，并涂敷吸波材料，三者共同降低雷达特征，实现隐身，表述正确。"},{"id":"ch5-115","chapter":"ch5","type":"judge","stem":"生物武器伤害特点之一是具有传染性。","options":["正确","错误"],"answer":0,"exp":"生物战剂多为致病微生物，可在人、畜、植物之间传播流行，造成疫病蔓延，传染性是生物武器区别于其他大规模杀伤性武器的重要特点。"},{"id":"ch5-116","chapter":"ch5","type":"judge","stem":"按在战争中的运用范围，军事伪装分为战略伪装、战役伪装、战术伪装。","options":["正确","错误"],"answer":0,"exp":"按在战争中的运用范围划分，伪装分为战略伪装、战役伪装和战术伪装三个层次，分别服务于不同规模作战行动隐蔽企图的需要。"},{"id":"ch5-117","chapter":"ch5","type":"judge","stem":"伪装在现代战争中既是防守技术，又是进攻技术。","options":["正确","错误"],"answer":0,"exp":"伪装既能隐蔽己方企图和行动、保存战力，属防御性技术；又能制造假象、诱敌误判，配合进攻行动，因而兼具防守与进攻双重功能。"},{"id":"zt2-001","chapter":"zt2","type":"single","stem":"（　）是习近平新时代中国特色社会主义思想的重要组成部分，是党的军事指导理论最新成果，是坚持走中国特色强军之路、全面推进国防和军队现代化的行动纲领。","options":["邓小平新时期军队建设思想","江泽民国防和军队建设思想","毛泽东军事思想","习近平新时代强军建设思想"],"answer":3,"exp":"该句是对习近平新时代强军建设思想的定位，称其为党的军事指导理论最新成果；毛泽东军事思想、邓小平新时期军队建设思想属此前阶段的理论。","note":"原填空题改造"},{"id":"zt2-002","chapter":"zt2","type":"single","stem":"当今世界正经历（　），这是我们党立足中华民族伟大复兴战略全局，正确认识全球发展大势、深刻洞察世界格局变化而作出的重大判断。","options":["世界多极化格局","国际格局大调整","百年未有之大变局","经济全球化浪潮"],"answer":2,"exp":"“百年未有之大变局”是党立足民族复兴战略全局、洞察世界格局变化作出的重大判断；世界多极化、经济全球化只是具体趋势，不能替代这一判断。","note":"原填空题改造"},{"id":"zt2-003","chapter":"zt2","type":"single","stem":"对我国而言，政治安全最为核心的内容是（　）的巩固和国家政治安定。","options":["国家主权","意识形态安全","中国共产党执政地位","社会主义法制"],"answer":2,"exp":"政治安全最核心的是中国共产党执政地位的巩固和国家政治安定，执政地位决定政权性质；社会主义法制、国家主权、意识形态安全不构成“最核心”表述。","note":
